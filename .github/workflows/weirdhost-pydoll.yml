name: Weirdhost 过盾测试（pydoll）

# 只做一件事：用 pydoll 打开 hub.weirdhost.xyz，过 Cloudflare，把过盾后的页面截图发到 TG。
# 不登录、不续期、不碰现有 Weirdhost 续期工作流。手动触发，无 cron。

on:
  workflow_dispatch:
    inputs:
      url:
        description: '要打开的地址（默认首页）'
        required: false
        default: 'https://hub.weirdhost.xyz/'

permissions:
  contents: read

jobs:
  probe:
    name: pydoll 过盾测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/weirdhost_pydoll/probe.py
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 修复 apt 源
        run: |
          # runner 自带的 azure 镜像走 http，避开 apt https 方法里会卡死的 TLS select 路径；
          # archive / security 做备用源。22.04 和 24.04 一律写成旧版 sources.list（apt 两边都认），
          # 顺手清掉 ubuntu.sources 与 apt-mirrors.txt，否则 22.04 会报 "no longer has a Release file"。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          # apt 默认是"单次 read"超时，慢源会一直滴漏不触发，这里配小并加重试
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 📦 安装系统依赖
        timeout-minutes: 10
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 update -o Acquire::http::Timeout=15
          timeout 300 sudo apt-get install -o Acquire::Retries=3 -y xvfb

      - name: 📦 安装 Python 依赖
        run: pip install pydoll-python requests

      - name: 🌐 设置代理 (sing-box)
        env:
          WEIRDHOST_PROXY_NODE: ${{ secrets.WEIRDHOST_PROXY_NODE }}
        run: |
          if [ -z "$WEIRDHOST_PROXY_NODE" ]; then
            echo "❌ 未配置 WEIRDHOST_PROXY_NODE，禁止直连"
            exit 1
          fi
          NODE_LINK="$WEIRDHOST_PROXY_NODE" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 运行 pydoll 探针
        id: probe
        env:
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          IS_PROXY: ${{ env.IS_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WEIRDHOST_URL: ${{ inputs.url }}
          SHOT_PATH: /tmp/weirdhost_login.png
        working-directory: private-repo/scripts/weirdhost_pydoll
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
            python probe.py 2>&1 | tee probe.log; exit ${PIPESTATUS[0]}

      - name: 📎 上传截图（供回看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weirdhost-pydoll-shot
          path: /tmp/weirdhost_login.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 🧹 清理代理进程
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

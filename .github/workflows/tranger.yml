name: Tranger 保活

on:
  workflow_dispatch:
  repository_dispatch:
    types: [nezha-offline]

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/tranger/tranger.py
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🌐 校验代理配置
        env:
          TRANGER_PROXY: ${{ secrets.TRANGER_PROXY }}
        run: |
          if [ -z "$TRANGER_PROXY" ]; then
            echo "❌ 必须配置 TRANGER_PROXY（强制代理模式）"
            exit 1
          fi

      - name: 🌐 设置代理 (sing-box)
        env:
          TRANGER_PROXY: ${{ secrets.TRANGER_PROXY }}
        run: |
          NODE_LINK="$TRANGER_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 📦 安装 Python 依赖
        run: pip install 'requests[socks]'

      - name: 🚀 执行开机
        id: run_script
        env:
          PYTHONIOENCODING: utf-8
          TRANGER_AUTH: ${{ secrets.TRANGER_AUTH }}
          TRANGER_REFRESH_TOKEN: ${{ secrets.TRANGER_REFRESH_TOKEN }}
          TG_BOT: ${{ secrets.TG_BOT }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        working-directory: private-repo/scripts/tranger
        run: |
          set -o pipefail
          python tranger.py 2>&1 | tee tranger.log

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4

      - name: ❌ 失败通知（前置步骤）
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "[SKIP] 未配置 TG_BOT_TOKEN / TG_CHAT_ID"
            exit 0
          fi
          MSG="❌ ${GITHUB_WORKFLOW} 失败（脚本未运行）%0A任务: ${GITHUB_JOB}%0A仓库: ${GITHUB_REPOSITORY}%0A运行页: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${MSG}" || true

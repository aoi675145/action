name: Antagonix 续期

on:
  schedule:
    - cron: '33 5 29 10 *'
  workflow_dispatch:
    inputs:
      force_renew:
        description: '强制续期（忽略剩余时间，手动触发时可选）'
        type: boolean
        required: false
        default: false

permissions:
  actions: write
  contents: read

jobs:
  renew:
    name: 执行续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 从私库拉取脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p scripts
          RAW="https://raw.githubusercontent.com/aoi675145/scripts/main/scripts"

          fetch() {
            curl -fsSL -H "Authorization: Bearer ${REPO_TOKEN}" -H "Cache-Control: no-cache" -o "$2" "$1?t=$(date +%s)"
          }

          echo "[INFO] pull antagonix.py"
          if fetch "${RAW}/antagonix/antagonix.py" scripts/antagonix.py && [ -s scripts/antagonix.py ]; then
            echo "[INFO] antagonix.py ready ($(wc -l < scripts/antagonix.py) lines)"
          else
            echo "[ERROR] scripts/antagonix/antagonix.py not found"
            exit 1
          fi

          echo "[INFO] pull shared setup_proxy.sh"
          if fetch "${RAW}/setup_proxy.sh" scripts/setup_proxy.sh && [ -s scripts/setup_proxy.sh ]; then
            echo "[INFO] setup_proxy.sh ready ($(wc -l < scripts/setup_proxy.sh) lines)"
          else
            echo "[WARN] setup_proxy.sh missing, proxy step will be skipped"
            rm -f scripts/setup_proxy.sh
          fi

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 修复 apt 源
        run: |
          # runner 自带的 azure 镜像走 http，避开 apt https 方法里会卡死的 TLS select 路径；
          # archive / security 做备用源。22.04 和 24.04 一律写成旧版 sources.list（apt 两边都认），
          # 顺手清掉 ubuntu.sources 与 apt-mirrors.txt，否则 22.04 会报 "no longer has a Release file"。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          # apt 默认是"单次 read"超时，慢源会一直滴漏不触发，这里配小并加重试
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 📦 安装依赖
        timeout-minutes: 10
        run: |
          timeout 120 sudo apt-get update -o Acquire::Retries=3 -qq
          timeout 300 sudo apt-get install -o Acquire::Retries=3 -y xvfb fonts-wqy-microhei
          python -m pip install --upgrade pip --quiet --retries 5 --timeout 60
          pip install --quiet 'requests[socks]' seleniumbase --retries 5 --timeout 60
          seleniumbase install chromedriver

      - name: ⚙️ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.ANTAGONIX_PROXY }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "::error::ANTAGONIX_PROXY 未配置（必填，本脚本不允许直连）"
            exit 1
          fi
          if [ ! -f scripts/setup_proxy.sh ]; then
            echo "::error::私库里缺 scripts/setup_proxy.sh，无法起代理"
            exit 1
          fi
          bash scripts/setup_proxy.sh

      - name: 🚀 执行续期脚本
        id: run_script
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          ANTAGONIX_RENEW_BEFORE_HOURS: ${{ vars.ANTAGONIX_RENEW_BEFORE_HOURS || '6' }}
          ANTAGONIX_FORCE_RENEW: ${{ inputs.force_renew && '1' || '' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          python -u scripts/antagonix.py 2>&1 | tee renew.log

      - name: 🧽 清理代理进程
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2

      - name: ❌ 失败通知（前置步骤）
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "[SKIP] 未配置 TG_BOT_TOKEN / TG_CHAT_ID"
            exit 0
          fi
          MSG="❌ ${GITHUB_WORKFLOW} 失败（脚本未运行）%0A任务: ${GITHUB_JOB}%0A仓库: ${GITHUB_REPOSITORY}%0A运行页: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${MSG}" || true

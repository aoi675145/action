name: BoxMine AFK

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 1 9 *'
permissions:
  actions: write

concurrency:
  group: boxmine-afk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet "requests[socks]" websocket-client PySocks python-socks

      - name: 校验必填 Secrets
        env:
          DISCORD_TOKEN_A: ${{ secrets.DISCORD_TOKEN_A }}
          BOXMINE_PROXY:   ${{ secrets.BOXMINE_PROXY }}
        run: |
          if [ -z "$DISCORD_TOKEN_A" ]; then
            echo "❌ DISCORD_TOKEN_A 未配置"
            exit 1
          fi
          if [ -z "$BOXMINE_PROXY" ]; then
            echo "❌ BOXMINE_PROXY 未配置"
            exit 1
          fi
          echo "✅ 必填 Secrets 校验通过"

      - name: 配置 AFK 代理
        env:
          BOXMINE_PROXY: ${{ secrets.BOXMINE_PROXY }}
        run: |
          if [[ "$BOXMINE_PROXY" != vless://* ]]; then
            echo "🔗 使用现有代理配置"
            echo "PROXY_URL=$BOXMINE_PROXY" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "🔗 检测到 VLESS 节点，配置本地 Xray SOCKS5"
          wget -q https://github.com/oyz6/action/releases/download/proxy/Xray-linux-64.zip -O xray.zip
          unzip -q xray.zip -d xray
          chmod +x xray/xray

          python3 << 'PYEOF'
          import json
          import os
          import sys
          from urllib.parse import parse_qs, unquote, urlparse

          raw = os.environ["BOXMINE_PROXY"].strip()
          parsed = urlparse(raw)
          if parsed.scheme != "vless" or not parsed.username or not parsed.hostname or not parsed.port:
              print("❌ VLESS 节点格式错误")
              sys.exit(1)

          params = parse_qs(parsed.query)
          security = params.get("security", ["none"])[0]
          network = params.get("type", ["tcp"])[0]
          sni = params.get("sni", [parsed.hostname])[0]
          fingerprint = params.get("fp", ["chrome"])[0]
          flow = params.get("flow", [""])[0]
          public_key = params.get("pbk", [""])[0]
          short_id = params.get("sid", [""])[0]
          host = params.get("host", [sni])[0]
          path = unquote(params.get("path", ["/"])[0])

          outbound = {
              "protocol": "vless",
              "settings": {
                  "vnext": [{
                      "address": parsed.hostname,
                      "port": parsed.port,
                      "users": [{"id": unquote(parsed.username), "encryption": "none"}],
                  }]
              },
              "streamSettings": {"network": network, "security": security},
          }
          user = outbound["settings"]["vnext"][0]["users"][0]
          if flow:
              user["flow"] = flow
          if security == "reality":
              if not public_key:
                  print("❌ VLESS Reality 节点缺少 pbk")
                  sys.exit(1)
              reality = {"serverName": sni, "fingerprint": fingerprint, "publicKey": public_key}
              if short_id:
                  reality["shortId"] = short_id
              outbound["streamSettings"]["realitySettings"] = reality
          elif security == "tls":
              outbound["streamSettings"]["tlsSettings"] = {"serverName": sni, "fingerprint": fingerprint}
          if network == "ws":
              outbound["streamSettings"]["wsSettings"] = {"path": path, "headers": {"Host": host}}
          elif network == "grpc":
              outbound["streamSettings"]["grpcSettings"] = {"serviceName": params.get("serviceName", [""])[0]}

          config = {
              "log": {"loglevel": "warning"},
              "inbounds": [{"listen": "127.0.0.1", "port": 10808, "protocol": "socks", "settings": {"udp": True}}],
              "outbounds": [outbound],
          }
          with open("xray_config.json", "w", encoding="utf-8") as handle:
              json.dump(config, handle, indent=2)
          print(f"✅ VLESS 配置已生成：{parsed.hostname[:2]}***{parsed.hostname[-2:]}")
          PYEOF

          ./xray/xray run -c xray_config.json > xray.log 2>&1 &
          echo "🔄 等待 Xray 启动..."
          for i in 1 2 3 4 5; do
            if curl -x socks5h://127.0.0.1:10808 -fsS --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
              echo "✅ VLESS 代理连接成功"
              echo "PROXY_URL=socks5://127.0.0.1:10808" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "⏳ Xray 连接重试 $i/5"
            sleep 3
          done
          echo "❌ VLESS 代理连接失败"
          sed -n '1,80p' xray.log
          exit 1

      - name: 运行 AFK 脚本
        id: afk
        env:
          DISCORD_TOKEN:                ${{ secrets.DISCORD_TOKEN_A }}
          TG_BOT_TOKEN:                 ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:                   ${{ secrets.TG_CHAT_ID }}
          PROXY_URL:                    ${{ env.PROXY_URL }}
          PYTHONUNBUFFERED:             1
        run: python scripts/boxmine/boxmine_afk.py

      - name: 更新下次 AFK 调度
        if: success()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          NEXT_CRON: ${{ steps.afk.outputs.cron }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if [ -z "$NEXT_CRON" ]; then
            echo "⚠️ 未获取到下次 AFK 时间，保留现有调度"
            exit 0
          fi
          python3 - <<'PYEOF'
          import base64
          import json
          import os
          import re
          import urllib.request

          token = os.environ["REPO_TOKEN"]
          repo = os.environ["TARGET_REPO"]
          workflow_ref = os.environ["WORKFLOW_REF"]
          cron = os.environ["NEXT_CRON"]
          marker = f"{repo}/"
          path_ref = workflow_ref.split(marker, 1)[1]
          path = path_ref.rsplit("@", 1)[0]
          api = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "BoxMine-AFK",
          }
          request = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              current = json.load(response)
          content = base64.b64decode(current["content"]).decode("utf-8")
          updated, count = re.subn(
              r"(?m)^(\s*-\s*cron:\s*)['\"][^'\"]+['\"]\s*$",
              lambda match: f"{match.group(1)}'{cron}'",
              content,
              count=1,
          )
          if count != 1:
              raise RuntimeError("未找到工作流 schedule cron")
          if updated == content:
              print("ℹ️ Cron 没有变化")
              raise SystemExit(0)
          payload = json.dumps({
              "message": "Update BoxMine AFK schedule",
              "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
              "sha": current["sha"],
          }).encode("utf-8")
          request = urllib.request.Request(api, data=payload, headers={**headers, "Content-Type": "application/json"}, method="PUT")
          with urllib.request.urlopen(request, timeout=30):
              pass
          print(f"✅ Cron 已更新：{cron}（UTC）")
          PYEOF

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6


name: Puratya 续期

on:
  workflow_dispatch:
  schedule:
    - cron: '57 7 8 11 *' # 下一个: 2026-11-08 07:57 UTC / 2026-11-08 15:57 北京时间 (失败重试)

concurrency:
  group: puratya-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write

    steps:
      - name: 📥 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: scripts_repo

      - name: 📥 拉取工作流仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/action
          token: ${{ secrets.REPO_TOKEN }}
          path: action_repo

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 修复 apt 源
        run: |
          # runner 自带的 azure 镜像走 http，避开 apt https 方法里会卡死的 TLS select 路径；
          # archive / security 做备用源。22.04 和 24.04 一律写成旧版 sources.list（apt 两边都认），
          # 顺手清掉 ubuntu.sources 与 apt-mirrors.txt，否则 22.04 会报 "no longer has a Release file"。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          # apt 默认是"单次 read"超时，慢源会一直滴漏不触发，这里配小并加重试
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 📦 安装依赖
        timeout-minutes: 12
        run: |
          pip install curl_cffi pydoll-python --retries 5 --timeout 60
          timeout 120 sudo apt-get update -o Acquire::Retries=3 -y -qq
          timeout 300 sudo apt-get install -o Acquire::Retries=3 -y -qq jq curl xvfb fonts-noto-cjk

      - name: 🌐 安装并启动代理
        env:
          NODE_LINK: ${{ secrets.PURATYA_PROXY }}
        run: |
          if [ -z "${NODE_LINK}" ]; then
            echo "[ERROR] 未配置 PURATYA_PROXY，代理为必填项，停止执行"
            exit 1
          fi
          bash scripts_repo/scripts/setup_proxy.sh

      - name: 🚀 运行续期脚本
        id: run_script
        working-directory: scripts_repo/scripts/puratya
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" python puratya.py
          mkdir -p DEBUG && [ -f /tmp/pt_page.png ] && cp /tmp/pt_page.png DEBUG/page.png || true

      - name: 💾 同步 cookies.txt 回私有仓库
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git -C scripts_repo config user.name "github-actions[bot]"
          git -C scripts_repo config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "scripts_repo/scripts/puratya/DEBUG" ]; then
            git -C scripts_repo add scripts/puratya/DEBUG 2>/dev/null || true
          fi
          if [ -f "scripts_repo/scripts/puratya/cookies.txt" ]; then
            git -C scripts_repo add scripts/puratya/cookies.txt
          fi
          if git -C scripts_repo diff --cached --quiet; then
            echo "scripts 仓库无变更需要提交"
          else
            git -C scripts_repo commit -m "🍪 auto: 更新 cookies"
            git -C scripts_repo remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/aoi675145/scripts.git
            git -C scripts_repo pull --rebase --autostash || true
            git -C scripts_repo push
          fi

      - name: 🚀 自动修改下一次运行时间
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          WORKFLOW_FILE: action_repo/.github/workflows/puratya.yml
        run: |
          python3 << 'EOF'
          import os
          import re
          from datetime import datetime, timedelta

          workflow_file = os.environ.get("WORKFLOW_FILE")
          date_file = 'scripts_repo/scripts/puratya/next_time.txt'
          now_utc = datetime.utcnow()

          when = None
          label = '续期日前2天 09:05'
          if os.path.exists(date_file):
              with open(date_file, 'r', encoding='utf-8') as handle:
                  content = handle.read()
              retry = re.search(r'retry_minutes=(\d+)', content)
              stamp = re.search(r'(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})', content)
              if retry:
                  when = now_utc + timedelta(minutes=int(retry.group(1)))
                  label = '失败重试'
              elif stamp:
                  when = datetime(*[int(part) for part in stamp.groups()])

          if when is None or when <= now_utc:
              when = (now_utc + timedelta(days=1)).replace(hour=1, minute=5, second=0, microsecond=0)
              label = '兜底方案'

          new_cron = f"{when.minute} {when.hour} {when.day} {when.month} *"
          bj_time = when + timedelta(hours=8)
          next_date_str = (f"{when.strftime('%Y-%m-%d %H:%M')} UTC / "
                           f"{bj_time.strftime('%Y-%m-%d %H:%M')} 北京时间 ({label})")

          with open(workflow_file, 'r', encoding='utf-8') as handle:
              content = handle.read()
          new_content = re.sub(r"- cron: '.*?'.*",
                               f"- cron: '{new_cron}' # 下一个: {next_date_str}",
                               content, count=1)
          with open(workflow_file, 'w', encoding='utf-8') as handle:
              handle.write(new_content)
          print(f"✅ 已把下一次运行时间更新为: {new_cron} (目标时间: {next_date_str})")
          EOF

          git -C action_repo config user.name "github-actions[bot]"
          git -C action_repo config user.email "github-actions[bot]@users.noreply.github.com"
          git -C action_repo add .github/workflows/puratya.yml
          NEXT_LABEL=$(grep -o '下一个: [^()]*' action_repo/.github/workflows/puratya.yml | head -1 | sed 's/下一个: //;s/ *$//')
          git -C action_repo commit -m "🔄 下次运行: ${NEXT_LABEL:-未知}" || echo "action 仓库没有 Cron 变更需要提交"
          git -C action_repo remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/aoi675145/action.git
          git -C action_repo pull --rebase --autostash || true
          git -C action_repo push

      - name: 📨 TG 失败通知
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WF_NAME: ${{ github.workflow }}
          WF_REPO: ${{ github.repository }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_RUN_NUM: ${{ github.run_number }}
        run: |
          MSG=$(printf '❌ Puratya 续期失败\n任务: %s (%s)\n仓库: %s\n运行页: https://github.com/%s/actions/runs/%s' \
            "${WF_NAME}" "${WF_RUN_NUM}" "${WF_REPO}" "${WF_REPO}" "${WF_RUN_ID}")
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - name: 🧹 清理 sing-box
        if: always()
        run: |
          pkill -f sing-box 2>/dev/null || true
          rm -f sing-box sing-box-config.json sing-box.log sing-box-*.json sing-box-*.log sing-box-*.tar.gz

      - name: 🧹 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1

name: EkNodes 续期

on:
  workflow_dispatch:
  schedule:
    - cron: "55 1 */5 * *"

concurrency:
  group: eknodes-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/eknodes/eknodes.py
            scripts/setup_proxy.sh.sh
          sparse-checkout-cone-mode: false

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 设置代理 (sing-box)
        env:
          EKNODES_PROXY: ${{ secrets.EKNODES_PROXY }}
        run: |
          if [ -z "${EKNODES_PROXY:-}" ]; then
            echo "❌ EKNODES_PROXY 未配置，已禁止直连，工作流终止"
            exit 1
          fi
          echo "✅ 已检测到 EKNODES_PROXY，开始配置强制代理"
          NODE_LINK="$EKNODES_PROXY" bash private-repo/scripts/setup_proxy.sh.sh

      - name: 验证代理环境
        run: |
          if [ "${IS_PROXY:-false}" != "true" ] || [ -z "${PROXY_SERVER:-}" ]; then
            echo "❌ 代理脚本未生成有效的代理环境变量，已禁止继续运行"
            exit 1
          fi
          echo "✅ 代理环境验证成功"

      - name: 安装 Python 依赖
        run: pip install 'requests[socks]'

      - name: 执行续期
        env:
          PYTHONIOENCODING: utf-8
          EKNODES: ${{ secrets.EKNODES }}
          EKNODES_COOKIE_FILE: cookies.txt
          TG_BOT: ${{ secrets.TG_BOT }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        working-directory: private-repo/scripts/eknodes
        run: |
          set -o pipefail
          python eknodes.py 2>&1 | tee renew.log

      - name: 提交 Cookie 更新
        if: success()
        working-directory: private-repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if [[ -f scripts/eknodes/cookies.txt ]] && [[ -n $(git status --short scripts/eknodes/cookies.txt) ]]; then
            git add scripts/eknodes/cookies.txt
            git commit -m "Auto-update EkNodes auth session [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Cookie 未生成或无变化，跳过提交"
          fi

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4

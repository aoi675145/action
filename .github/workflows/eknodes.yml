name: EkNodes 续期

on:
  workflow_dispatch:
  schedule:
    - cron: "55 1 */5 * *"

concurrency:
  group: eknodes-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/eknodes/eknodes.py
            scripts/setup_proxy.sh.sh
          sparse-checkout-cone-mode: false

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 设置代理 (sing-box)
        env:
          EKNODES_PROXY: ${{ secrets.EKNODES_PROXY }}
        run: |
          NODE_LINK="$EKNODES_PROXY" bash private-repo/scripts/setup_proxy.sh.sh

      - name: 安装 Python 依赖
        run: pip install 'requests[socks]'

      - name: 执行续期
        env:
          PYTHONIOENCODING: utf-8
          EKNODES: ${{ secrets.EKNODES }}
          TG_BOT: ${{ secrets.TG_BOT }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        working-directory: private-repo/scripts/eknodes
        run: |
          set -o pipefail
          python eknodes.py 2>&1 | tee renew.log

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4

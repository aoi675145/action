name: Hostlio 续期

on:
  workflow_dispatch:
  repository_dispatch:
    types: [hostlio]

concurrency:
  group: hostlio-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/hostlio/**
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装依赖
        run: pip install -q 'requests[socks]'

      - name: 🌐 设置代理 (sing-box)
        env:
          HOSTLIO_PROXY: ${{ secrets.HOSTLIO_PROXY }}
        run: |
          if [ -z "$HOSTLIO_PROXY" ]; then
            echo "::error::HOSTLIO_PROXY 未配置（必填，本脚本必须走代理）"
            exit 1
          fi
          NODE_LINK="$HOSTLIO_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 运行续期脚本
        id: run_script
        env:
          PYTHONIOENCODING: utf-8
          HOSTLIO_SERVICES: ${{ secrets.HOSTLIO_SERVICES }}
          HOSTLIO_INCLUDE_CANCELLED: ${{ secrets.HOSTLIO_INCLUDE_CANCELLED }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          python -u private-repo/scripts/hostlio/hostlio.py 2>&1 | tee hostlio.log

      - name: 📨 TG 失败通知
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WF_NAME: ${{ github.workflow }}
          WF_REPO: ${{ github.repository }}
          WF_RUN_ID: ${{ github.run_id }}
        run: |
          MSG="❌ Hostlio 续期失败%0A任务: ${WF_NAME}%0A仓库: ${WF_REPO}%0A运行页: https://github.com/${WF_REPO}/actions/runs/${WF_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - name: 🍪 回写续签 Cookie 到私库
        if: always()
        working-directory: private-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f scripts/hostlio/cookies.txt ] && ! git diff --quiet scripts/hostlio/cookies.txt; then
            git add scripts/hostlio/cookies.txt
            git commit -m "chore(hostlio): 自动回写会话 Cookie"
            git push
            echo "🍪 cookies.txt 已更新并推送"
          else
            echo "🍪 cookies.txt 无变化，跳过提交"
          fi

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log hostlio.log

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3

name: PearlNodes 续期

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  renew:
    name: 执行续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 从私库拉取脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p scripts
          RAW="https://raw.githubusercontent.com/aoi675145/scripts/main/scripts"

          fetch() {
            curl -fsSL -H "Authorization: Bearer ${REPO_TOKEN}" -o "$2" "$1"
          }

          echo "[INFO] pull pearl.py"
          DOWNLOAD_FILE="$(mktemp)"
          if fetch "${RAW}/pearl/pearl.py" "${DOWNLOAD_FILE}"; then
            echo "[INFO] source: scripts/pearl/pearl.py"
          elif fetch "${RAW}/Pearl/pearl.py" "${DOWNLOAD_FILE}"; then
            echo "[WARN] source: scripts/Pearl/pearl.py"
          elif [ -s scripts/pearl.py ]; then
            rm -f "${DOWNLOAD_FILE}"
            echo "[WARN] private repo unreachable, keep scripts/pearl.py from this repo"
            echo "[INFO] pearl.py ready ($(wc -l < scripts/pearl.py) lines)"
            DOWNLOAD_FILE=""
          else
            rm -f "${DOWNLOAD_FILE}"
            echo "[ERROR] pearl.py not found"
            exit 1
          fi
          if [ -n "${DOWNLOAD_FILE}" ]; then
            test -s "${DOWNLOAD_FILE}"
            mv "${DOWNLOAD_FILE}" scripts/pearl.py
            echo "[INFO] pearl.py ready ($(wc -l < scripts/pearl.py) lines)"
          fi

          echo "[INFO] pull shared setup_proxy.sh"
          if fetch "${RAW}/setup_proxy.sh" scripts/setup_proxy.sh && [ -s scripts/setup_proxy.sh ]; then
            echo "[INFO] setup_proxy.sh ready ($(wc -l < scripts/setup_proxy.sh) lines)"
          else
            echo "[ERROR] shared scripts/setup_proxy.sh not found"
            exit 1
          fi

          echo "[INFO] resolve requirements"
          if [ -s requirements.txt ]; then
            cp requirements.txt scripts/requirements.txt
            echo "[INFO] use requirements.txt from repo root"
          elif fetch "${RAW}/pearl/requirements.txt" scripts/requirements.txt \
            && [ -s scripts/requirements.txt ]; then
            echo "[INFO] use private scripts/pearl/requirements.txt"
          else
            printf 'requests\nPySocks\nseleniumbase\nxvfbwrapper\n' > scripts/requirements.txt
            echo "[WARN] fallback to builtin requirements"
          fi
          cat scripts/requirements.txt

      - name: 安装系统依赖（Chrome + Xvfb + tkinter）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb curl gnupg python3-tk
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          python3 -c "import tkinter; print('[OK] tkinter available')" \
            || echo "[WARN] tkinter unavailable, script will stub mouseinfo"

      - name: 安装 Python 依赖
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          sbase get uc_driver || echo "[WARN] uc_driver fetch failed, UC mode will download it"

      - name: ⚙️ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.PEARL_PROXY }}
        run: bash scripts/setup_proxy.sh

      - name: 执行续期脚本
        env:
          PEARL: ${{ secrets.PEARL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PEARL_LOGIN_ATTEMPTS: '8'
          PEARL_HISTORY_WARMUP: 'true'
          PEARL_COOKIE_FILE: 'pearl-cookies.txt'
        run: python -u scripts/pearl.py

      - name: 提交会话文件
        if: always()
        run: |
          if [ ! -f pearl-cookies.txt ]; then
            echo "[SKIP] no cookie file"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pearl-cookies.txt
          if git diff --cached --quiet; then
            echo "[SKIP] cookie unchanged"
            exit 0
          fi
          git commit -m "chore: roll pearl session cookie"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push || echo "[WARN] push failed, next run will retry"

      - name: 🧽 清理代理进程
        if: always()
        run: pkill -f sing-box || true

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2

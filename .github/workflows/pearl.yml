name: PearlNodes 续期

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  renew:
    name: 执行续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 从私库拉取脚本与 cookies.txt
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p scripts
          RAW="https://raw.githubusercontent.com/aoi675145/scripts/main/scripts"

          fetch() {
            curl -fsSL -H "Authorization: Bearer ${REPO_TOKEN}" -o "$2" "$1"
          }

          echo "[INFO] pull pearl.py"
          DOWNLOAD_FILE="$(mktemp)"
          if fetch "${RAW}/pearl/pearl.py" "${DOWNLOAD_FILE}"; then
            echo "[INFO] source: scripts/pearl/pearl.py"
          elif fetch "${RAW}/Pearl/pearl.py" "${DOWNLOAD_FILE}"; then
            echo "[WARN] source: scripts/Pearl/pearl.py"
          elif [ -s scripts/pearl.py ]; then
            rm -f "${DOWNLOAD_FILE}"
            echo "[WARN] private repo unreachable, keep scripts/pearl.py from this repo"
            echo "[INFO] pearl.py ready ($(wc -l < scripts/pearl.py) lines)"
            DOWNLOAD_FILE=""
          else
            rm -f "${DOWNLOAD_FILE}"
            echo "[ERROR] pearl.py not found"
            exit 1
          fi
          if [ -n "${DOWNLOAD_FILE}" ]; then
            test -s "${DOWNLOAD_FILE}"
            mv "${DOWNLOAD_FILE}" scripts/pearl.py
            echo "[INFO] pearl.py ready ($(wc -l < scripts/pearl.py) lines)"
          fi

          echo "[INFO] pull shared setup_proxy.sh"
          if fetch "${RAW}/setup_proxy.sh" scripts/setup_proxy.sh && [ -s scripts/setup_proxy.sh ]; then
            echo "[INFO] setup_proxy.sh ready ($(wc -l < scripts/setup_proxy.sh) lines)"
          else
            echo "[ERROR] shared scripts/setup_proxy.sh not found"
            exit 1
          fi

          echo "[INFO] pull cookies.txt"
          if fetch "${RAW}/pearl/cookies.txt" cookies.txt && [ -s cookies.txt ]; then
            echo "[INFO] cookies.txt ready ($(wc -l < cookies.txt) lines)"
          else
            rm -f cookies.txt
            echo "[WARN] scripts/pearl/cookies.txt missing in private repo"
          fi

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet requests PySocks

      - name: ⚙️ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.PEARL_PROXY }}
        run: bash scripts/setup_proxy.sh

      - name: 执行续期脚本
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PEARL_COOKIE_FILE: 'cookies.txt'
        run: python -u scripts/pearl.py

      - name: 回写 cookies.txt 到私库
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ ! -f cookies.txt ]; then
            echo "[SKIP] no cookies.txt"
            exit 0
          fi
          rm -rf scripts-repo
          git clone --depth 1 "https://x-access-token:${REPO_TOKEN}@github.com/aoi675145/scripts.git" scripts-repo
          cd scripts-repo
          mkdir -p scripts/pearl
          if [ -f scripts/pearl/cookies.txt ] && cmp -s ../cookies.txt scripts/pearl/cookies.txt; then
            echo "[SKIP] cookie unchanged"
            exit 0
          fi
          cp ../cookies.txt scripts/pearl/cookies.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/pearl/cookies.txt
          git commit -m "chore: roll pearl session cookie"
          git push || echo "[WARN] push failed, next run will retry"

      - name: 🧽 清理代理进程
        if: always()
        run: pkill -f sing-box || true

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2

name: PearlNodes 续期

on:
  schedule:
    - cron: '16 13 4 10 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  renew:
    name: 执行续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 从私库拉取脚本
        # pearl.py comes from scripts/pearl/; setup_proxy.sh is the shared one.
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p scripts
          RAW="https://raw.githubusercontent.com/aoi675145/scripts/main/scripts"

          fetch() { # fetch <url> <dest>
            curl -fsSL -H "Authorization: Bearer ${REPO_TOKEN}" -o "$2" "$1"
          }

          echo "[INFO] pull pearl.py"
          DOWNLOAD_FILE="$(mktemp)"
          if fetch "${RAW}/pearl/pearl.py" "${DOWNLOAD_FILE}"; then
            echo "[INFO] source: scripts/pearl/pearl.py"
          elif fetch "${RAW}/Pearl/pearl.py" "${DOWNLOAD_FILE}"; then
            echo "[WARN] source: scripts/Pearl/pearl.py"
          elif [ -s scripts/pearl.py ]; then
            rm -f "${DOWNLOAD_FILE}"
            echo "[WARN] private repo unreachable, keep scripts/pearl.py from this repo"
            echo "[INFO] pearl.py ready ($(wc -l < scripts/pearl.py) lines)"
            DOWNLOAD_FILE=""
          else
            rm -f "${DOWNLOAD_FILE}"
            echo "[ERROR] pearl.py not found"
            exit 1
          fi
          if [ -n "${DOWNLOAD_FILE}" ]; then
            test -s "${DOWNLOAD_FILE}"
            mv "${DOWNLOAD_FILE}" scripts/pearl.py
            echo "[INFO] pearl.py ready ($(wc -l < scripts/pearl.py) lines)"
          fi

          echo "[INFO] pull shared setup_proxy.sh"
          if fetch "${RAW}/setup_proxy.sh" scripts/setup_proxy.sh && [ -s scripts/setup_proxy.sh ]; then
            echo "[INFO] setup_proxy.sh ready ($(wc -l < scripts/setup_proxy.sh) lines)"
          else
            echo "[ERROR] shared scripts/setup_proxy.sh not found"
            exit 1
          fi

          echo "[INFO] resolve requirements"
          if [ -s requirements.txt ]; then
            cp requirements.txt scripts/requirements.txt
            echo "[INFO] use requirements.txt from repo root"
          elif fetch "${RAW}/pearl/requirements.txt" scripts/requirements.txt \
            && [ -s scripts/requirements.txt ]; then
            echo "[INFO] use private scripts/pearl/requirements.txt"
          else
            printf 'requests\nPySocks\nplaywright\nxvfbwrapper\ncurl_cffi\n' > scripts/requirements.txt
            echo "[WARN] fallback to builtin requirements"
          fi
          cat scripts/requirements.txt

      - name: 安装系统依赖（Chrome + Xvfb）
        run: |
          sudo apt-get update
          # Xvfb: Playwright headful 模式需要虚拟显示；channel="chrome" 跑
          # 的是上面已装的 Google Chrome 官方构建，不是 Playwright 自带 Chromium。
          sudo apt-get install -y xvfb curl gnupg
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: 恢复持久化浏览器 profile
        # Cache the Chrome profile across runs so _GRECAPTCHA and browsing history
        # survive; with a valid session the reCAPTCHA step is skipped entirely.
        uses: actions/cache@v4
        with:
          path: chrome-profile
          key: pearl-chrome-profile-${{ github.run_id }}
          restore-keys: |
            pearl-chrome-profile-

      - name: 清理 profile 残留锁
        # A killed run leaves SingletonLock behind and Chrome then refuses to start
        # (SessionNotCreatedException: chrome not reachable).
        run: rm -rf chrome-profile/Singleton* || true

      - name: 安装 Python 依赖
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          # Playwright 需要 OS 库（channel="chrome" 用系统 Chrome，不必下 Chromium 二进制）
          python -m playwright install-deps chromium || echo "[WARN] playwright install-deps skipped"

      - name: ⚙️ 设置代理 (sing-box)
        # PEARL_PROXY: vless/vmess/trojan/hysteria2/tuic/anytls/ss/socks5 node link
        env:
          NODE_LINK: ${{ secrets.PEARL_PROXY }}
        run: bash scripts/setup_proxy.sh

      - name: 执行续期脚本
        env:
          PEARL: ${{ secrets.PEARL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # reCAPTCHA v3 is a probabilistic score: a rejection on the first tries
          # is normal for the same exit IP and a clean browser, hence the retries.
          PEARL_LOGIN_ATTEMPTS: '8'
          # PEARL_SID: 可选，已保存的 connect.sid。有它就直接注入跳过 reCAPTCHA，
          # 没有则走完整的浏览器登录流程。用 export_sid.py 刷新（sid 大约 24h 过期）。
          PEARL_SID: ${{ secrets.PEARL_SID }}
          PEARL_CHROME_PROFILE: 'chrome-profile'
          PEARL_HISTORY_WARMUP: 'true'
        run: python -u scripts/pearl.py

      - name: 上传登录失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pearl-login-screenshots
          path: output/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: 🔄 自动修改下次 Cron
        # Reads next_time.txt (UTC) and rewrites this workflow's cron line.
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          WORKFLOW_REPO: ${{ github.repository }}
        run: |
          if [ ! -f next_time.txt ]; then
            echo "[SKIP] next_time.txt not found"
            exit 0
          fi

          python3 << 'PYEOF'
          import os
          import re
          import subprocess
          from datetime import datetime

          with open("next_time.txt", encoding="utf-8") as f:
              raw = f.read().strip()

          m = re.search(r"(\d{4})\D+(\d{1,2})\D+(\d{1,2})\D+(\d{1,2})\D+(\d{1,2})", raw)
          if not m:
              print("cannot parse next_time.txt: %r" % raw)
              raise SystemExit(1)

          target = datetime(int(m[1]), int(m[2]), int(m[3]), int(m[4]), int(m[5]))
          new_cron = "%d %d %d %d *" % (target.minute, target.hour, target.day, target.month)
          info = target.strftime("%Y-%m-%d %H:%M UTC")
          print("next run: " + info)
          print("new cron: " + new_cron)

          token = os.environ["REPO_TOKEN"]
          repo = os.environ["WORKFLOW_REPO"]
          subprocess.run(
              ["git", "clone", "https://x-access-token:%s@github.com/%s.git" % (token, repo), "wf-repo"],
              check=True, capture_output=True,
          )
          os.chdir("wf-repo")

          wf = ".github/workflows/pearl.yml"
          with open(wf, encoding="utf-8") as f:
              content = f.read()
          new_content, count = re.subn(
              r"- cron: '.*?'.*",
              "- cron: '%s'" % new_cron,
              content,
              count=1,
          )
          if count == 0:
              print("[SKIP] no cron line in workflow")
              raise SystemExit(0)
          with open(wf, "w", encoding="utf-8") as f:
              f.write(new_content)

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True, capture_output=True)
          subprocess.run(
              ["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"],
              check=True, capture_output=True,
          )
          subprocess.run(["git", "add", wf], check=True, capture_output=True)
          r = subprocess.run(
              ["git", "commit", "-m", "chore: update pearl cron", "-m", "next run: " + info],
              capture_output=True, text=True,
          )
          if r.returncode == 0:
              subprocess.run(["git", "push"], check=True, capture_output=True)
              print("[OK] cron updated")
          else:
              print("[SKIP] nothing to commit")
          PYEOF

      - name: 保存浏览器 profile 缓存
        # After the cron rewrite: persist the session no matter how the run ended,
        # so the next run can skip reCAPTCHA.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: chrome-profile
          key: pearl-chrome-profile-${{ github.run_id }}

      - name: 🧽 清理代理进程
        if: always()
        run: pkill -f sing-box || true

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2

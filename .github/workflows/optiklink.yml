name: OptikLink-Keep
on:
  schedule:
    - cron: '40 1 */2 * *'
  workflow_dispatch:
jobs:
  keepalive:
    name: 执行保活
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 拉取私有代码
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 📦 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 修复 apt 源
        run: |
          # runner 自带的 azure 镜像走 http，避开 apt https 方法里会卡死的 TLS select 路径；
          # archive / security 做备用源。22.04 和 24.04 一律写成旧版 sources.list（apt 两边都认），
          # 顺手清掉 ubuntu.sources 与 apt-mirrors.txt，否则 22.04 会报 "no longer has a Release file"。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          # apt 默认是"单次 read"超时，慢源会一直滴漏不触发，这里配小并加重试
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 📦 安装 Playwright
        timeout-minutes: 10
        run: |
          pip install --upgrade pip --retries 5 --timeout 60
          pip install playwright --retries 5 --timeout 60
          python -m playwright install --with-deps chromium
          timeout 120 sudo apt-get update -o Acquire::Retries=3 && timeout 300 sudo apt-get install -o Acquire::Retries=3 -y xvfb

      - name: 🌐 启动代理
        env:
          NODE_LINK: ${{ secrets.OPTIKLINK_PROXY_NODE }}
        run: bash scripts/setup_proxy.sh

      - name: 🚀 运行保活脚本
        id: keepalive
        env:
          DISCORD_TOKEN_K:   ${{ secrets.DISCORD_TOKEN_K }}
          TG_BOT:            ${{ secrets.TG_BOT }}
          GOST_PROXY:        ${{ env.PROXY_SERVER }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/optikLink/optiklink.py

      - name: 📨 发送失败通知
        if: failure() && steps.keepalive.outcome != 'failure'
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 标题只在 scripts/tg_title.py 里维护
          TITLE=$(python3 -c "import sys;sys.path.insert(0,'scripts');from tg_title import title;print(title('optiklink'))" 2>/dev/null || echo '❌ 任务执行失败')
          export TITLE
          node <<'NODE'
          const https = require('https');

          const [chatId, token] = (process.env.TG_BOT || ',').split(',');
          if (!chatId || !token) {
            console.log('[INFO] TG_BOT 未配置，跳过失败通知');
            process.exit(0);
          }

          const text = [
            process.env.TITLE || '❌ 任务执行失败',
            '📊 执行结果: ❌ GitHub Actions 执行失败 (Python)',
            `🔗 运行日志: ${process.env.RUN_URL}`,
          ].join('\n');

          const body = JSON.stringify({ chat_id: chatId, text });
          const req = https.request({
            hostname: 'api.telegram.org',
            path: `/bot${token}/sendMessage`,
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(body),
            },
            timeout: 15000,
          }, (res) => {
            res.resume();
            res.on('end', () => {
              console.log(res.statusCode === 200
                ? '[INFO] TG 失败通知已发送'
                : `[WARN] TG 失败通知发送失败: HTTP ${res.statusCode}`);
            });
          });

          req.on('timeout', () => {
            console.log('[WARN] TG 失败通知发送超时');
            req.destroy();
          });
          req.on('error', (error) => console.log(`[WARN] TG 失败通知异常: ${error.message}`));
          req.end(body);
          NODE

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

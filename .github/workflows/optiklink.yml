name: OptikLink-Keep
on:
  schedule:
    - cron: '40 1 */2 * *'
  workflow_dispatch:
jobs:
  keepalive:
    name: 执行保活
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 拉取私有代码
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 📦 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 修复 apt 源
        run: |
          # 源一律钉官方 https：80 端口在部分 runner 上整段超时，443 正常。
          # 这里不跑 apt-get update —— 索引刷新交给下一步 ensure-apt.sh（自带 5s 探活 + 归档兜底 + 时间预算）。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb https://archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb https://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "10";
          Acquire::https::Timeout "10";
          Acquire::ForceIPv4 "true";
          Acquire::http::Pipeline-Depth "0";
          EOF
          if ! curl -s -o /dev/null -I --max-time 5 https://archive.ubuntu.com/ubuntu/; then
            echo "::warning::archive.ubuntu.com 5s 内不可达，依赖安装走镜像自带/后续兜底"
          fi
      - name: 📦 安装 Playwright
        timeout-minutes: 10
        run: |
          pip install --upgrade pip --retries 5 --timeout 60
          pip install playwright --retries 5 --timeout 60
          python -m playwright install --with-deps chromium
          # 系统包按需安装：镜像自带就不碰 apt，源不可达也不会把 job 拖死（脚本见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/action/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh \
              --need-pkg "xvfb"
          fi

      - name: 🌐 启动代理
        env:
          NODE_LINK: ${{ secrets.OPTIKLINK_PROXY_NODE }}
        run: bash scripts/setup_proxy.sh

      - name: 🚀 运行保活脚本
        id: keepalive
        env:
          DISCORD_TOKEN_K:   ${{ secrets.DISCORD_TOKEN_K }}
          TG_BOT:            ${{ secrets.TG_BOT }}
          GOST_PROXY:        ${{ env.PROXY_SERVER }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/optikLink/optiklink.py

      - name: 📨 发送失败通知
        if: failure() && steps.keepalive.outcome != 'failure'
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 标题只在 scripts/tg_title.py 里维护
          TITLE=$(python3 -c "import sys;sys.path.insert(0,'scripts');from tg_title import title;print(title('optiklink'))" 2>/dev/null || echo '❌ 任务执行失败')
          export TITLE
          node <<'NODE'
          const https = require('https');

          const [chatId, token] = (process.env.TG_BOT || ',').split(',');
          if (!chatId || !token) {
            console.log('[INFO] TG_BOT 未配置，跳过失败通知');
            process.exit(0);
          }

          const text = [
            process.env.TITLE || '❌ 任务执行失败',
            '📊 执行结果: ❌ GitHub Actions 执行失败 (Python)',
            `🔗 运行日志: ${process.env.RUN_URL}`,
          ].join('\n');

          const body = JSON.stringify({ chat_id: chatId, text });
          const req = https.request({
            hostname: 'api.telegram.org',
            path: `/bot${token}/sendMessage`,
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(body),
            },
            timeout: 15000,
          }, (res) => {
            res.resume();
            res.on('end', () => {
              console.log(res.statusCode === 200
                ? '[INFO] TG 失败通知已发送'
                : `[WARN] TG 失败通知发送失败: HTTP ${res.statusCode}`);
            });
          });

          req.on('timeout', () => {
            console.log('[WARN] TG 失败通知发送超时');
            req.destroy();
          });
          req.on('error', (error) => console.log(`[WARN] TG 失败通知异常: ${error.message}`));
          req.end(body);
          NODE

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

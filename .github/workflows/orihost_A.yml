name: OriHost 续期 (A)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 18 11 *'   # 自动更新下次运行时间

permissions:
  contents: write
  actions: write

concurrency:
  group: orihost-a
  cancel-in-progress: false

jobs:
  run_renewal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          path: scripts_repo
          token: ${{ secrets.REPO_TOKEN }}

      - name: 📥 拉取工作流仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/action
          path: action_repo
          token: ${{ secrets.REPO_TOKEN }}

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 修复 apt 源
        run: |
          # runner 自带的 azure 镜像走 http，避开 apt https 方法里会卡死的 TLS select 路径；
          # archive / security 做备用源。22.04 和 24.04 一律写成旧版 sources.list（apt 两边都认），
          # 顺手清掉 ubuntu.sources 与 apt-mirrors.txt，否则 22.04 会报 "no longer has a Release file"。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          # apt 默认是"单次 read"超时，慢源会一直滴漏不触发，这里配小并加重试
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 📦 安装依赖
        timeout-minutes: 10
        run: |
          # 系统包按需安装：镜像自带就不碰 apt，源不可达也不会把 job 拖死（脚本见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/action/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh \
              --need-pkg "wget xvfb x11-utils xdotool scrot"
          fi
          python -m pip install --upgrade pip --retries 5 --timeout 60
          pip install seleniumbase requests PySocks --retries 5 --timeout 60
          seleniumbase install chromium

      - name: 🌐 设置代理 (sing-box)
        timeout-minutes: 10
        env:
          Ori_PROXY: ${{ secrets.Ori_PROXY_A }}
        run: |
          NODE_LINK="$Ori_PROXY" bash scripts_repo/scripts/setup_proxy.sh

      - name: 🚫 屏蔽广告域名
        run: |
          for domain in pagead2.googlesyndication.com googleads.g.doubleclick.net www.googleadservices.com ep2.adtrafficquality.google 5gvci.com nap5k.com n6wxm.com; do
            echo "0.0.0.0 $domain" | sudo tee -a /etc/hosts > /dev/null
            echo "🚫 已屏蔽 $domain"
          done

      - name: 🚀 运行 OriHost Python 脚本
        id: run_renew
        working-directory: scripts_repo/scripts/orihost
        env:
          Ori_cookies: ${{ secrets.Ori_cookies_A }}
          Ori_PROXY: ${{ env.PROXY_SERVER }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python orihost.py 2>&1 | tee renew.log; exit ${PIPESTATUS[0]}

      - name: ⚙️ 提取到期时间
        id: extract_due
        if: success()
        working-directory: scripts_repo/scripts/orihost
        run: |
          DUE_DATE=$(grep -oP '到期时间\(标准\): \K\d{4}-\d{2}-\d{2}' renew.log | tail -1 || echo "")
          if [ -z "$DUE_DATE" ]; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
            echo "::warning::未能提取到期时间，跳过 Cron 更新"
            exit 0
          fi
          echo "due_date=$DUE_DATE" >> $GITHUB_OUTPUT
          echo "skip_update=false" >> $GITHUB_OUTPUT
          echo "::notice::📅 当前到期时间: $DUE_DATE"

      - name: ⏰ 修改下次 Cron 时间
        if: success() && steps.extract_due.outputs.skip_update != 'true'
        run: |
          set -e

          DUE_DATE="${{ steps.extract_due.outputs.due_date }}"
          echo "📅 当前到期时间: $DUE_DATE"

          echo "⏳ 到期日: $DUE_DATE"

          # 到期前三天运行
          RUN_DATE=$(date -u -d "$DUE_DATE -3 days" +"%Y-%m-%d")
          RUN_DAY=$(date -u -d "$RUN_DATE" +"%-d")
          RUN_MONTH=$(date -u -d "$RUN_DATE" +"%-m")

          # 每个工作流固定自己的时段，避免两个号同一分钟一起跑
          CRON_MIN=15
          CRON_UTC_HOUR=2
          BH_HOUR=$(( (CRON_UTC_HOUR + 8) % 24 ))
          NEW_CRON="$CRON_MIN $CRON_UTC_HOUR $RUN_DAY $RUN_MONTH *"

          echo "::notice::⏰ 下次运行: $RUN_DATE $(printf '%02d' $BH_HOUR):$CRON_MIN 北京时间"
          echo "::notice::📟 新 Cron: $NEW_CRON"

          git clone https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/${{ github.repository }}.git workflow_repo
          cd workflow_repo

          WORKFLOW_FILE=".github/workflows/orihost_A.yml"

          LINE_NUM=$(grep -n "cron: '" "$WORKFLOW_FILE" | head -n1 | cut -d: -f1)

          if [ -z "$LINE_NUM" ]; then
            echo "::error::找不到 cron 行"
            exit 1
          fi

          echo "::notice::更新第 $LINE_NUM 行"

          sed -i "${LINE_NUM}c\\    - cron: '$NEW_CRON'   # 自动更新下次运行时间" "$WORKFLOW_FILE"

          if git diff --quiet "$WORKFLOW_FILE"; then
            echo "::notice::没有变化需要提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW_FILE"
          git commit -m "🔄 下次运行: $RUN_DATE UTC" \
                     -m "下次运行: $RUN_DATE UTC" \
                     -m "Cron: $NEW_CRON" \
                     -m "到期时间: $DUE_DATE"
          git push

          echo "::notice::✅ Cron 更新成功"

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2

      - name: ❌ 失败通知（前置步骤）
        if: failure() && steps.run_renew.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "[SKIP] 未配置 TG_BOT_TOKEN / TG_CHAT_ID"
            exit 0
          fi
          MSG="❌ ${GITHUB_WORKFLOW} 失败（脚本未运行）%0A任务: ${GITHUB_JOB}%0A仓库: ${GITHUB_REPOSITORY}%0A运行页: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${MSG}" || true

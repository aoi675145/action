name: Teoheberg 续期

on:
  workflow_dispatch:

  schedule:
    - cron: '23 0 * * *'

  push:
    paths:
      - "teoheberg/teoheberg.js"
      - "teoheberg/teoheberg.yml"

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          APP_DIR="teoheberg"
          mkdir -p "$APP_DIR"

          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq -o Dpkg::Use-Pty=0 xvfb ffmpeg python3 python3-pip 2>&1 | tail -5
          cd "$APP_DIR"
          npm init -y --silent
          npm install --silent playwright
          python3 -m pip install --quiet SpeechRecognition pydub
          npx playwright install --with-deps chromium 2>&1 | tail -5

      - name: 安装并启动代理
        env:
          TEOHE_PROXY_NODE: ${{ secrets.TEOHE_PROXY_NODE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          tg_send() {
            local msg="$1"
            if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT_ID}" \
                -d "text=${msg}" \
                -d "parse_mode=Markdown" > /dev/null 2>&1
            fi
            echo "$msg"
          }

          if [ -z "$TEOHE_PROXY_NODE" ]; then
            tg_send "❌ Teohe 执行失败: 未配置 TEOHE_PROXY_NODE"
            exit 1
          fi

          wget -q https://github.com/oyz6/action/releases/download/proxy/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray && chmod +x xray/xray

          python3 << 'PYEOF'
          import os, sys, json, base64
          from urllib.parse import parse_qs, unquote, urlparse

          def mask(s):
              return f"{s[:2]}***{s[-2:]}" if len(s) > 4 else "****"

          url = os.environ.get("TEOHE_PROXY_NODE", "").strip()
          if not url:
              print("[ERROR] TEOHE_PROXY_NODE 为空")
              sys.exit(1)

          if url.startswith("vless://"):
              protocol = "vless"
              content = url[8:]
          elif url.startswith("vmess://"):
              protocol = "vmess"
              content = url[8:]
          elif url.startswith("trojan://"):
              protocol = "trojan"
              content = url[9:]
          elif url.startswith("ss://"):
              protocol = "ss"
              content = url[5:]
          elif url.startswith("socks5://") or url.startswith("socks://"):
              protocol = "socks5"
              content = url.split("://")[1].split("#")[0]
              if "@" in content:
                  server = content.split("@")[1].split(":")[0]
              else:
                  server = content.split(":")[0]
              print(f"[INFO] SOCKS5 -> {mask(server)}")
              with open("use_external_socks.txt", "w") as f:
                  f.write(url.split("#")[0])
              sys.exit(0)
          else:
              print(f"[ERROR] 不支持的协议: {url.split('://')[0]}")
              sys.exit(1)

          if "#" in content:
              content = content.rsplit("#", 1)[0]

          config = {
              "log": {"loglevel": "warning"},
              "inbounds": [
                  {"port": 1080, "listen": "127.0.0.1", "protocol": "socks", "settings": {"udp": True}},
                  {"port": 1081, "listen": "127.0.0.1", "protocol": "http"}
              ],
              "outbounds": []
          }

          if protocol == "vless":
              uuid, rest = content.split("@", 1)
              if "?" in rest:
                  host_port, params_str = rest.split("?", 1)
              else:
                  host_port, params_str = rest, ""
              if ":" in host_port:
                  address, port = host_port.rsplit(":", 1)
              else:
                  address, port = host_port, "443"
              params = parse_qs(params_str)
              security = params.get("security", ["none"])[0]
              network = params.get("type", ["tcp"])[0]
              sni = params.get("sni", [address])[0]
              fp = params.get("fp", ["chrome"])[0]
              flow = params.get("flow", [""])[0]
              pbk = params.get("pbk", [""])[0]
              host = params.get("host", [sni])[0]
              path = unquote(params.get("path", ["/"])[0])
              print(f"[INFO] VLESS -> {mask(address)}:{port} (security: {security}, network: {network})")
              outbound = {
                  "protocol": "vless",
                  "settings": {
                      "vnext": [{
                          "address": address,
                          "port": int(port),
                          "users": [{"id": uuid, "encryption": "none"}]
                      }]
                  },
                  "streamSettings": {
                      "network": network,
                      "security": security
                  }
              }
              if flow:
                  outbound["settings"]["vnext"][0]["users"][0]["flow"] = flow
              if security == "reality":
                  outbound["streamSettings"]["realitySettings"] = {
                      "serverName": sni, "fingerprint": fp, "publicKey": pbk
                  }
              elif security == "tls":
                  insecure = params.get("insecure", [""])[0] or params.get("allowInsecure", [""])[0]
                  outbound["streamSettings"]["tlsSettings"] = {
                      "serverName": sni,
                      "fingerprint": fp,
                      "allowInsecure": insecure in ("1", "true"),
                  }
              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {
                      "path": path, "headers": {"Host": host}
                  }
              elif network == "grpc":
                  service_name = params.get("serviceName", [""])[0]
                  outbound["streamSettings"]["grpcSettings"] = {"serviceName": service_name}
              config["outbounds"].append(outbound)

          elif protocol == "vmess":
              try:
                  padding = 4 - len(content) % 4
                  if padding != 4:
                      content += "=" * padding
                  decoded = base64.b64decode(content).decode("utf-8")
                  vm = json.loads(decoded)
              except Exception as e:
                  print(f"[ERROR] VMess 解析失败: {e}")
                  sys.exit(1)
              address = vm.get("add", "")
              port = int(vm.get("port", 443))
              uuid = vm.get("id", "")
              aid = int(vm.get("aid", 0))
              network = vm.get("net", "tcp")
              tls = vm.get("tls", "")
              sni = vm.get("sni", "") or vm.get("host", address)
              host = vm.get("host", address)
              path = vm.get("path", "/")
              fp = vm.get("fp", "chrome")
              print(f"[INFO] VMess -> {mask(address)}:{port} (network: {network}, tls: {tls})")
              outbound = {
                  "protocol": "vmess",
                  "settings": {
                      "vnext": [{
                          "address": address, "port": port,
                          "users": [{"id": uuid, "alterId": aid, "security": "auto"}]
                      }]
                  },
                  "streamSettings": {
                      "network": network,
                      "security": "tls" if tls == "tls" else "none"
                  }
              }
              if tls == "tls":
                  insecure = vm.get("insecure", "0") or vm.get("allowInsecure", "0")
                  outbound["streamSettings"]["tlsSettings"] = {
                      "serverName": sni, "fingerprint": fp,
                      "allowInsecure": insecure in ("1", "true"),
                  }
              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {
                      "path": path, "headers": {"Host": host}
                  }
              config["outbounds"].append(outbound)

          elif protocol == "trojan":
              password, rest = content.split("@", 1)
              if "?" in rest:
                  host_port, params_str = rest.split("?", 1)
              else:
                  host_port, params_str = rest, ""
              if ":" in host_port:
                  address, port = host_port.rsplit(":", 1)
              else:
                  address, port = host_port, "443"
              params = parse_qs(params_str)
              sni = params.get("sni", [address])[0]
              network = params.get("type", ["tcp"])[0]
              host = params.get("host", [sni])[0]
              path = unquote(params.get("path", ["/"])[0])
              fp = params.get("fp", ["chrome"])[0]
              print(f"[INFO] Trojan -> {mask(address)}:{port} (network: {network})")
              insecure = params.get("insecure", [""])[0] or params.get("allowInsecure", [""])[0]
              outbound = {
                  "protocol": "trojan",
                  "settings": {
                      "servers": [{
                          "address": address, "port": int(port), "password": password
                      }]
                  },
                  "streamSettings": {
                      "network": network, "security": "tls",
                      "tlsSettings": {
                          "serverName": sni, "fingerprint": fp,
                          "allowInsecure": insecure in ("1", "true"),
                      }
                  }
              }
              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {
                      "path": path, "headers": {"Host": host}
                  }
              config["outbounds"].append(outbound)

          elif protocol == "ss":
              try:
                  if "@" in content:
                      encoded, server_part = content.split("@", 1)
                      decoded = base64.b64decode(encoded + "==").decode("utf-8")
                      method, password = decoded.split(":", 1)
                      address, port = server_part.split(":", 1)
                  else:
                      decoded = base64.b64decode(content + "==").decode("utf-8")
                      if "@" in decoded:
                          user_part, server_part = decoded.split("@", 1)
                          method, password = user_part.split(":", 1)
                          address, port = server_part.split(":", 1)
                      else:
                          raise ValueError("无法解析")
              except Exception as e:
                  print(f"[ERROR] Shadowsocks 解析失败: {e}")
                  sys.exit(1)
              print(f"[INFO] Shadowsocks -> {mask(address)}:{port}")
              outbound = {
                  "protocol": "shadowsocks",
                  "settings": {
                      "servers": [{
                          "address": address, "port": int(port),
                          "method": method, "password": password
                      }]
                  }
              }
              config["outbounds"].append(outbound)

          with open("xray_config.json", "w") as f:
              json.dump(config, f, indent=2)
          print("[INFO] ✅ 代理配置已生成")
          PYEOF

          if [ -f "use_external_socks.txt" ]; then
            EXTERNAL_SOCKS=$(cat use_external_socks.txt)
            echo "PROXY_SERVER=$EXTERNAL_SOCKS" >> $GITHUB_ENV
            echo "[INFO] ✅ 使用外部 SOCKS5 代理"
            exit 0
          fi

          ./xray/xray run -c xray_config.json > xray.log 2>&1 &
          sleep 5

          echo "[INFO] 测试代理连接..."
          for i in 1 2 3 4 5; do
            if curl -x socks5://127.0.0.1:1080 -s --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
              echo "[INFO] ✅ 代理连接成功"
              echo "PROXY_SERVER=socks5://127.0.0.1:1080" >> $GITHUB_ENV
              exit 0
            fi
            echo "[WARN] 尝试 $i/5..."
            sleep 3
          done

          tg_send "❌ Teohe 执行失败: 代理连接失败"
          cat xray.log
          exit 1

      - name: Fetch private login script
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -euo pipefail
          APP_DIR="teoheberg"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            -o teoheberg.js \
            "https://api.github.com/repos/aoi675145/scripts/contents/scripts/teohe/teoheberg.js?ref=main"

      - name: Run full flow
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEOHE_PROXY_NODE: ${{ env.PROXY_SERVER }}
          TEOHE_COOKIES: ${{ secrets.TEOHE_COOKIES }}
        run: |
          set -euo pipefail
          APP_DIR="teoheberg"
          cd "$APP_DIR"
          mkdir -p screenshots
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node teoheberg.js

      - name: Cleanup old runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: teoheberg.yml
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["REPO"]
          workflow_file = os.environ["WORKFLOW_FILE"]
          r = subprocess.run([
              "gh", "api", f"repos/{repo}/actions/workflows/{workflow_file}/runs", "--paginate"
          ], capture_output=True, text=True, check=True)
          runs = json.loads(r.stdout).get("workflow_runs", [])
          target = sorted(runs, key=lambda x: x.get("created_at", ""), reverse=True)
          for run in target[3:]:
              rid = str(run["id"])
              print(f"Deleting {rid}")
              subprocess.run(["gh","api","-X","DELETE",f"repos/{repo}/actions/runs/{rid}"], check=True)
          PY

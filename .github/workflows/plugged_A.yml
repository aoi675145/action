name: Plugged Tokens (A)

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: '结束后领签到/任务（取消勾选 = 只刷币）'
        type: boolean
        default: true
      buy_plus:
        description: '余额够时自动兑换 Plus 会员（默认关闭，不花 tokens）'
        type: boolean
        default: false
      provider:
        description: '只刷指定渠道（留空=全部；例 adfocus）'
        type: string
        required: false
        default: ''

permissions:
  actions: write

concurrency:
  group: plugged-tokens-a
  cancel-in-progress: false

jobs:
  farm:
    timeout-minutes: 180
    runs-on: ubuntu-latest

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-scripts
          sparse-checkout: |
            scripts/plugged/plugged.py
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Both offerwalls run over plain HTTP: linkvertise over GraphQL, adfocus
      # via curl_cffi (Chrome TLS fingerprint + /serve/state beacons). No
      # browser, no xvfb, nothing to install beyond the two HTTP clients.
      - name: 📦 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          pip install -q requests curl_cffi cryptography pydoll-python
          # The adfocus fallback drives a real Chromium (headed, under xvfb):
          # the offerwall refuses replayed HTTP beacons often enough that the
          # browser leg pays for itself.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null

      - name: 🛡️ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.PLUGGED_PROXY_NODE_A }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "❌ 未配置 PLUGGED_PROXY_NODE_A"
            exit 1
          fi
          chmod +x private-scripts/scripts/setup_proxy.sh
          NODE_LINK="$NODE_LINK" bash private-scripts/scripts/setup_proxy.sh

          source "$GITHUB_ENV"
          if [ "${IS_PROXY:-false}" != "true" ] || [ -z "${PROXY_SERVER:-}" ]; then
            echo "❌ 代理脚本未返回有效的 PROXY_SERVER"
            exit 1
          fi
          echo "PROXY_URL=$PROXY_SERVER" >> "$GITHUB_ENV"

          PROXY_IP=""
          for attempt in 1 2 3 4; do
            if PROXY_IP=$(curl -fsS --max-time 20 --proxy "$PROXY_SERVER" https://api.ipify.org 2>/dev/null) && [ -n "$PROXY_IP" ]; then break; fi
            echo "⚠️ 代理探测失败（$attempt/4），3 秒后重试"
            sleep 3
          done
          if [ -z "$PROXY_IP" ]; then
            echo "❌ 代理出口验证失败"
            exit 1
          fi
          MASKED_IP=$(python3 -c 'import sys; ip=sys.argv[1].strip(); p=ip.split("."); v=[x for x in ip.split(":") if x]; print(f"{p[0]}.{p[1]}.***.***" if len(p)==4 else (f"{v[0]}:{v[1]}:***" if ":" in ip and len(v)>=2 else "***"))' "$PROXY_IP")
          echo "✅ 代理出口 IP: $MASKED_IP"
          echo "EXIT_IP=$PROXY_IP" >> "$GITHUB_ENV"

      - name: 🚀 执行脚本
        env:
          PLUGGED_COOKIES: ${{ secrets.PLUGGED_COOKIES_A }}
          PLUGGED_BUY_PLUS: ${{ inputs.buy_plus }}
          PLUGGED_EXCHANGE: ${{ inputs.exchange }}
          PLUGGED_ONLY: ${{ inputs.provider }}
          PLUGGED_DUMP_HTML: ${{ vars.PLUGGED_DUMP_HTML }}
          PROXY_URL: ${{ env.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          cd private-scripts/scripts/plugged
          TMPDIR=/tmp xvfb-run -a --server-args="-screen 0 1366x768x24" python3 -u plugged.py 2>&1 | tee farm.log

      - name: 🧹 清理 sing-box
        if: always()
        run: |
          pkill -f sing-box 2>/dev/null || true
          rm -f sing-box sing-box-config.json sing-box.log sing-box-*.tar.gz

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2

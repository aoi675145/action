name: TechnoHeberg-Coins

on:
  workflow_dispatch:
  schedule:
    - cron: "45 0 * * *"

jobs:
  run_techno_coins:
    runs-on: ubuntu-latest
    steps:

      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/techon/techon_coins.py
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            google-chrome-stable \
            xvfb \
            x11-utils \
            xdotool \
            scrot \
            jq

      - name: 安装 Python 依赖
        run: |
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: 设置代理 (sing-box)
        env:
          TECHNO_PROXY: ${{ secrets.TECHNO_PROXY }}
        run: |
          if [ -z "${TECHNO_PROXY:-}" ]; then
            echo "❌ TECHNO_PROXY 未配置，已禁止直连，工作流终止"
            exit 1
          fi
          NODE_LINK="$TECHNO_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 验证代理环境
        run: |
          if [ "${IS_PROXY:-false}" != "true" ] || [ -z "${PROXY_SERVER:-}" ]; then
            echo "❌ 代理脚本未生成有效的代理环境变量，已禁止继续运行"
            exit 1
          fi
          echo "✅ 代理环境验证成功"

      - name: 运行脚本
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LOCAL_PROXY: ${{ env.PROXY_SERVER }}
          TG_BOT: ${{ secrets.TG_BOT }}
        working-directory: private-repo/scripts/techon
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python techon_coins.py

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

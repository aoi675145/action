name: OuiHeberg 续期

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ouiheberg 续期
  cancel-in-progress: false

jobs:
  get-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取私库 OuiHeberg 脚本
        uses: actions/checkout@v4
        with:
          repository: 'aoi675145/scripts'
          token: ${{ secrets.REPO_TOKEN }}
          sparse-checkout: scripts/ouiheberg/ouiheberg.py
          sparse-checkout-cone-mode: false

      - name: 启动代理转换网关
        env:
          MY_PROXY_NODE: ${{ secrets.OuiHeberg_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          FAILED=""
          if [ -z "$MY_PROXY_NODE" ]; then
            echo "[ERROR] 代理未配置 (OuiHeberg_PROXY 为空)"
            FAILED="代理未配置"
          fi

          if [ -z "$FAILED" ]; then
            # Hysteria2 support
            if [[ "$MY_PROXY_NODE" == hysteria2://* || "$MY_PROXY_NODE" == hy2://* ]]; then
              echo "[INFO] 检测到 Hysteria2 代理..."
              wget -q https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64 -O hysteria
              chmod +x hysteria

              python3 << 'PYEOF'
          import json, os, sys
          from urllib.parse import parse_qs, unquote, urlparse
          url = os.environ.get("MY_PROXY_NODE", "").strip()
          parsed = urlparse(url)
          auth = unquote(parsed.username or "")
          if not auth or not parsed.hostname or not parsed.port:
              print("[ERROR] Hysteria2 节点解析失败")
              sys.exit(1)
          params = parse_qs(parsed.query)
          sni = params.get("sni", [parsed.hostname])[0]
          insecure = params.get("insecure", params.get("allowInsecure", ["0"]))[0].lower() in {"1", "true", "yes", "on"}
          server = f"{parsed.hostname}:{parsed.port}"
          with open("hy2.yaml", "w", encoding="utf-8") as f:
              f.write(f"server: {json.dumps(server)}\n")
              f.write(f"auth: {json.dumps(auth)}\n")
              f.write("tls:\n")
              f.write(f"  sni: {json.dumps(sni)}\n")
              f.write(f"  insecure: {'true' if insecure else 'false'}\n")
              f.write("socks5:\n")
              f.write("  listen: 127.0.0.1:10808\n")
          print(f"[INFO] Hysteria2 -> {parsed.hostname}")
          PYEOF

              if [ $? -ne 0 ]; then
                echo "[ERROR] Hysteria2 配置生成失败"
                FAILED="Hysteria2 配置失败"
              else
                ./hysteria client -c hy2.yaml > hysteria.log 2>&1 &
                sleep 5

                for i in 1 2 3 4 5; do
                  if curl -x socks5h://127.0.0.1:10808 -sI --max-time 15 https://www.google.com > /dev/null 2>&1; then
                    echo "[INFO] ✅ Hysteria2 代理连接成功"
                    echo "GLOBAL_PROXY=socks5://127.0.0.1:10808" >> $GITHUB_ENV
                    break
                  fi
                  echo "[WARN] Hysteria2 尝试 $((i+1))/5..."
                  sleep 3
                done

                if ! grep -q "GLOBAL_PROXY" "$GITHUB_ENV" 2>/dev/null; then
                  echo "[ERROR] Hysteria2 代理连接失败"
                  FAILED="Hysteria2 节点不通"
                fi
              fi
            else
              wget -q https://github.com/akina005/akina/releases/download/proxy/Xray-linux-64.zip
              mkdir -p xray-bin
              unzip -oq Xray-linux-64.zip -d xray-bin
              chmod +x xray-bin/xray
              sudo mv xray-bin/xray /usr/local/bin/xray

              python3 << 'PYEOF'
          import os, sys, json, base64
          from urllib.parse import parse_qs, unquote, urlparse
          url = os.environ.get("MY_PROXY_NODE", "").strip()
          if not url:
              sys.exit(0)
          config = {"log": {"loglevel": "warning"}, "inbounds": [{"port": 10808, "listen": "127.0.0.1", "protocol": "socks", "settings": {"udp": True}}], "outbounds": []}
          if url.startswith(("socks5://", "socks://")):
              with open("external_socks.txt", "w") as f:
                  f.write(url.split("#")[0])
              sys.exit(0)
          try:
              if url.startswith("vless://"):
                  p = urlparse(url); qs = parse_qs(p.query); net = qs.get("type", ["tcp"])[0]; sec = qs.get("security", ["none"])[0]
                  user = {"id": p.username, "encryption": qs.get("encryption", ["none"])[0]}
                  flow = qs.get("flow", [""])[0]
                  if flow:
                      user["flow"] = flow
                  out = {"protocol": "vless", "settings": {"vnext": [{"address": p.hostname, "port": p.port or 443, "users": [user]}]}, "streamSettings": {"network": net, "security": sec}}
                  if sec == "tls":
                      tls = {"serverName": qs.get("sni", [p.hostname])[0], "fingerprint": qs.get("fp", ["chrome"])[0], "allowInsecure": qs.get("allowInsecure", qs.get("insecure", ["0"]))[0] == "1"}
                      alpn = qs.get("alpn", [""])[0]
                      if alpn:
                          tls["alpn"] = [x.strip() for x in alpn.split(",") if x.strip()]
                      out["streamSettings"]["tlsSettings"] = tls
                  elif sec == "reality":
                      reality = {"serverName": qs.get("sni", [p.hostname])[0], "fingerprint": qs.get("fp", ["chrome"])[0], "publicKey": qs.get("pbk", [""])[0]}
                      sid = qs.get("sid", qs.get("shortId", [""]))[0]
                      if sid:
                          reality["shortId"] = sid
                      spx = qs.get("spx", [""])[0]
                      if spx:
                          reality["spiderX"] = unquote(spx)
                      out["streamSettings"]["realitySettings"] = reality
                  if net == "ws":
                      out["streamSettings"]["wsSettings"] = {"path": unquote(qs.get("path", ["/"])[0]), "headers": {"Host": qs.get("host", [p.hostname])[0]}}
                  config["outbounds"].append(out)
              elif url.startswith("vmess://"):
                  v = json.loads(base64.b64decode(url[8:].split("#")[0] + "==").decode("utf-8"))
                  out = {"protocol": "vmess", "settings": {"vnext": [{"address": v["add"], "port": int(v["port"]), "users": [{"id": v["id"], "alterId": int(v.get("aid", 0))}]}]}, "streamSettings": {"network": v.get("net", "tcp"), "security": v.get("tls", "none")}}
                  if v.get("tls", "none") == "tls":
                      out["streamSettings"]["tlsSettings"] = {"serverName": v.get("sni", v["add"]), "fingerprint": v.get("fp", "chrome"), "allowInsecure": v.get("insecure", v.get("allowInsecure", "0")) in ("1", "true")}
                  if v.get("net") == "ws":
                      out["streamSettings"]["wsSettings"] = {"path": v.get("path", "/"), "headers": {"Host": v.get("host", v["add"])}}
                  config["outbounds"].append(out)
              elif url.startswith("trojan://"):
                  p = urlparse(url); qs = parse_qs(p.query)
                  config["outbounds"].append({"protocol": "trojan", "settings": {"servers": [{"address": p.hostname, "port": p.port or 443, "password": p.username}]}, "streamSettings": {"network": qs.get("type", ["tcp"])[0], "security": "tls", "tlsSettings": {"serverName": qs.get("sni", [p.hostname])[0]}}})
              elif url.startswith("ss://"):
                  c = url[5:].split("#")[0]
                  if "@" in c:
                      e, s = c.split("@", 1); d = base64.b64decode(e + "==").decode(); m, pw = d.split(":", 1); a, po = s.split(":", 1)
                      po = po.split("?")[0]
                  else:
                      d = base64.b64decode(c + "==").decode()
                      if "@" in d:
                          u, s = d.split("@", 1); m, pw = u.split(":", 1); a, po = s.split(":", 1)
                          po = po.split("?")[0]
                      else:
                          raise ValueError("ss parse error")
                  config["outbounds"].append({"protocol": "shadowsocks", "settings": {"servers": [{"address": a, "port": int(po), "method": m, "password": pw}]}})
              with open("xray_config.json", "w") as f:
                  json.dump(config, f, indent=2)
          except Exception:
              print("解析失败")
              sys.exit(1)
          PYEOF

              if [ -f "external_socks.txt" ]; then
                EXT_PROXY=$(cat external_socks.txt)
                echo "::add-mask::$EXT_PROXY"
                echo "GLOBAL_PROXY=$EXT_PROXY" >> $GITHUB_ENV
              else
                xray run -c xray_config.json > xray.log 2>&1 &
                sleep 8
                if curl -x socks5://127.0.0.1:10808 -sI --max-time 15 https://www.google.com > /dev/null; then
                  echo "GLOBAL_PROXY=socks5://127.0.0.1:10808" >> $GITHUB_ENV
                else
                  echo "[ERROR] Xray 启动失败或节点不连通"
                  FAILED="代理节点不通"
                fi
              fi
            fi
          fi

          if [ -n "$FAILED" ]; then
            TG_CHAT_ID=$(echo "$TG_BOT" | cut -d',' -f1)
            TG_TOKEN=$(echo "$TG_BOT" | cut -d',' -f2)
            RUN_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            if [ -n "$TG_TOKEN" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT_ID}" \
                -d text="🔑 OuiHeberg 激活码获取任务%0A🕐 ${RUN_TIME}%0A❌ 代理失败: ${FAILED}" > /dev/null
            fi
            exit 1
          fi

      - name: 安装 Python 依赖
        run: |
          python3 -m pip install --disable-pip-version-check requests websocket-client pysocks

      - name: 获取 OuiHeberg 激活码
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          python3 scripts/ouiheberg/ouiheberg.py

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6


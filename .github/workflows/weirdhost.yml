name: Weirdhost 续期

on:
  schedule:
    # 一天两次：UTC 00:36 / 12:36 = 北京 08:36 / 20:36（错开整点，GitHub 整点最容易排队延迟）。
    # 想改成正 8 点就用 '0 0,12 * * *'。
    - cron: '36 0,12 * * *'
  workflow_dispatch:

jobs:
  add_time:
    name: 续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 固定 UTC：面板前端的续期判定是拿 expire 字符串与本机时钟比较的，
      # 日志里的 nextRun 也按同一钟面判断，两个都必须落在 UTC 上。
      TZ: UTC
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/weirdhost/weirdhost.py
            scripts/weirdhost/logs.txt
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 检查是否需要续期
        id: check_renew
        run: |
          LOG_FILE="private-repo/scripts/weirdhost/logs.txt"
          if [ ! -f "$LOG_FILE" ]; then
            echo "need_renew=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # nextRun 与 expiry 同一钟面（面板时钟，KST），面板前端就是拿它与浏览器本地时钟比较；
          # 本 job 已固定 TZ=UTC（见 jobs.add_time.env），所以这里直接按 UTC 语义比较即可。
          ALL_SKIP=true
          for uuid in $(jq -r 'keys[]' "$LOG_FILE"); do
            next_run=$(jq -r ".[\"$uuid\"].nextRun" "$LOG_FILE")
            if [ -z "$next_run" ] || [ "$next_run" = "null" ]; then
              ALL_SKIP=false; break
            fi
            next_ts=$(date -d "$next_run" +%s 2>/dev/null) || { ALL_SKIP=false; break; }
            [ "$(date +%s)" -ge "$next_ts" ] && { ALL_SKIP=false; break; }
          done
          if [ "$ALL_SKIP" = "true" ]; then
            echo "need_renew=false" >> $GITHUB_OUTPUT
            echo "::notice::所有服务器均未到续期时间，跳过本次运行"
          else
            echo "need_renew=true" >> $GITHUB_OUTPUT
          fi

      - name: 设置 Python 环境
        if: steps.check_renew.outputs.need_renew == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 设置代理 (sing-box)
        if: steps.check_renew.outputs.need_renew == 'true'
        env:
          WEIRDHOST_PROXY_NODE: ${{ secrets.WEIRDHOST_PROXY_NODE }}
        run: |
          if [ -z "$WEIRDHOST_PROXY_NODE" ]; then
            echo "❌ 未配置 WEIRDHOST_PROXY_NODE，必须使用代理"
            exit 1
          fi
          NODE_LINK="$WEIRDHOST_PROXY_NODE" bash private-repo/scripts/setup_proxy.sh

      - name: 修复 apt 源
        if: steps.check_renew.outputs.need_renew == 'true'
        run: |
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt

      - name: 安装系统依赖
        if: steps.check_renew.outputs.need_renew == 'true'
        run: |
          # apt 直连 GitHub runner 内置源即可（前面已改写为官方 https 源），
          # 不走 sing-box 代理——代理只给浏览器访问 weirdhost 用
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y xvfb xdotool fonts-noto-cjk jq

      - name: 安装 Python 依赖
        if: steps.check_renew.outputs.need_renew == 'true'
        run: |
          # pip 直连 pypi，不走代理
          pip install seleniumbase aiohttp pynacl

      - name: 屏蔽广告域名
        if: steps.check_renew.outputs.need_renew == 'true'
        run: |
          for domain in pagead2.googlesyndication.com googleads.g.doubleclick.net www.googleadservices.com ep2.adtrafficquality.google c1.rfihub.net; do
            echo "0.0.0.0 $domain" | sudo tee -a /etc/hosts > /dev/null
            echo "🚫 已屏蔽 $domain"
          done

      - name: 运行续期脚本
        if: steps.check_renew.outputs.need_renew == 'true'
        env:
          WEIRDHOST_COOKIE: ${{ secrets.WEIRDHOST_COOKIE }}
          WEIRDHOST_PROXY_NODE: ${{ env.PROXY_SERVER }}
          IS_PROXY: ${{ env.IS_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: private-repo/scripts/weirdhost
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python weirdhost.py 2>&1 | tee renew.log; exit ${PIPESTATUS[0]}

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 清理旧的工作流运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

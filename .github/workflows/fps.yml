name: fps.ms 续期

on:
  workflow_dispatch:
  schedule:
    # 初始值: 每天 UTC 02:00; 每次运行后自动更新为"到期前 15~20 小时"
    - cron: '34 17 17 8 *'
env:
  SCRIPTS_REPO: aoi675145/scripts
  SCRIPTS_DIR: scripts/fps
  SCRIPTS_BRANCH: main

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      FPS_PROXY_SECRET: ${{ secrets.FPS_PROXY }}

    steps:

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 准备运行环境
        run: |
          echo "📦 安装 Python 与 Chrome 运行依赖..."
          pip install --upgrade pip -q
          pip install seleniumbase requests -q
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libxss1 libasound2t64 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libxkbcommon0 \
            fonts-wqy-zenhei fonts-noto-cjk \
            jq bc curl xvfb x11-utils >/dev/null
          mkdir -p screenshots
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          echo "XVFB_PID=$!" >> "$GITHUB_ENV"
          sleep 2
          if ! kill -0 "$!" 2>/dev/null; then
            echo "❌ Xvfb 启动失败"
            cat /tmp/xvfb.log
            exit 1
          fi
          echo "✅ 运行环境准备完成"

      - name: 设置并验证代理 (sing-box)
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ -z "$FPS_PROXY_SECRET" ]; then
            echo "❌ 未配置 FPS_PROXY，禁止直连"
            exit 1
          fi
          echo "🔗 正在配置强制代理..."
          curl -sSf -H "Authorization: token $REPO_TOKEN" \
            -o setup_proxy.sh \
            "https://raw.githubusercontent.com/${SCRIPTS_REPO}/${SCRIPTS_BRANCH}/scripts/setup_proxy.sh.sh"
          if [ ! -s setup_proxy.sh ]; then
            echo "❌ 拉取代理脚本失败，禁止直连"
            exit 1
          fi
          NODE_LINK="$FPS_PROXY_SECRET" bash setup_proxy.sh
          source "$GITHUB_ENV"
          if [ -z "${PROXY_SERVER:-}" ]; then
            echo "❌ 代理脚本未生成 PROXY_SERVER，禁止直连"
            exit 1
          fi
          PROXY_IP=$(curl -fsS --max-time 20 --proxy "$PROXY_SERVER" https://api.ipify.org) || {
            echo "❌ 代理连通性检查失败，禁止直连"
            exit 1
          }
          MASKED_IP=$(python -c 'import sys; p=sys.argv[1].strip().split("."); print(".".join(p[:2]+["***","***"]) if len(p)==4 else sys.argv[1][:8]+"***")' "$PROXY_IP")
          echo "✅ 强制代理已就绪，出口 IP: $MASKED_IP"

      - name: 运行 fps.ms 续期脚本
        id: run_renew
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FPS_PROXY: ${{ env.PROXY_SERVER }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISPLAY: ':99'
        run: |
          if [ -z "$FPS_PROXY" ]; then
            echo "❌ PROXY_SERVER 未传入脚本，禁止直连"
            exit 1
          fi

          RAW="https://raw.githubusercontent.com/${SCRIPTS_REPO}/${SCRIPTS_BRANCH}/${SCRIPTS_DIR}"
          echo "📥 拉取 fps.ms 脚本与会话..."
          curl -sSf -H "Authorization: token $REPO_TOKEN" -o fps.py "$RAW/fps.py"
          if [ ! -s fps.py ]; then
            echo "❌ 拉取 fps.py 失败（检查 REPO_TOKEN / 路径）"
            exit 1
          fi
          echo "✅ fps.py 已拉取 ($(wc -c < fps.py) bytes)"

          if ! curl -sSf -H "Authorization: token $REPO_TOKEN" -o cookies.txt "$RAW/cookies.txt"; then
            echo "⚠️ 私库无 cookies.txt，将使用 DISCORD_TOKEN 重建会话"
          else
            echo "✅ cookies.txt 已拉取 ($(wc -c < cookies.txt) bytes)"
          fi

          echo "🚀 启动 fps.ms 自动续期"
          python fps.py 2>&1 | tee renew.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ fps.ms 任务执行完成"
          else
            echo "❌ fps.ms 任务执行失败，退出码: $EXIT_CODE"
          fi
          exit "$EXIT_CODE"

      - name: 自动修改下次 Cron
        if: ${{ always() && steps.run_renew.outputs.cron != '' }}
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          NEXT_CRON: ${{ steps.run_renew.outputs.cron }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if [ -z "$NEXT_CRON" ]; then
            echo "⚠️ 未获取到下次运行时间，保留现有调度"
            exit 0
          fi
          python3 - <<'PYEOF'
          import base64
          import json
          import os
          import re
          import urllib.request

          token = os.environ["REPO_TOKEN"]
          repo = os.environ["TARGET_REPO"]
          workflow_ref = os.environ["WORKFLOW_REF"]
          cron = os.environ["NEXT_CRON"]
          marker = f"{repo}/"
          path_ref = workflow_ref.split(marker, 1)[1]
          path = path_ref.rsplit("@", 1)[0]
          api = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "FPS-Renew",
          }
          request = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              current = json.load(response)
          content = base64.b64decode(current["content"]).decode("utf-8")
          updated, count = re.subn(
              r"(?m)^(\s*-\s*cron:\s*)['\"][^'\"]+['\"]\s*$",
              lambda match: f"{match.group(1)}'{cron}'",
              content,
              count=1,
          )
          if count != 1:
              raise RuntimeError("未找到工作流 schedule cron")
          if updated == content:
              print("ℹ️ Cron 没有变化")
              raise SystemExit(0)
          payload = json.dumps({
              "message": "Update fps.ms renewal schedule",
              "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
              "sha": current["sha"],
          }).encode("utf-8")
          request = urllib.request.Request(api, data=payload, headers={**headers, "Content-Type": "application/json"}, method="PUT")
          with urllib.request.urlopen(request, timeout=30):
              pass
          print(f"✅ Cron 已更新：{cron}（UTC）")
          PYEOF

      - name: 更新cookies.txt
        if: ${{ always() && env.PROXY_SERVER != '' }}
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ ! -s cookies.txt ]; then
            echo "⚠️ 无 cookies.txt，跳过上传"
            exit 0
          fi
          API="https://api.github.com/repos/${SCRIPTS_REPO}/contents/${SCRIPTS_DIR}/cookies.txt"
          AUTH="Authorization: token $REPO_TOKEN"
          SHA=$(curl -s -H "$AUTH" -H "Accept: application/vnd.github+json" "$API" | jq -r '.sha // empty')
          B64=$(base64 -w0 cookies.txt)
          if [ -n "$SHA" ]; then
            echo "{\"message\":\"update: cookies.txt [skip ci]\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" > /tmp/upd.json
            curl -sSf -X PUT -H "$AUTH" -H "Accept: application/vnd.github+json" -d @/tmp/upd.json "$API" > /dev/null
            echo "✅ cookies.txt 已更新"
          else
            echo "{\"message\":\"create: cookies.txt [skip ci]\",\"content\":\"$B64\"}" > /tmp/up.json
            curl -sSf -X PUT -H "$AUTH" -H "Accept: application/vnd.github+json" -d @/tmp/up.json "$API" > /dev/null
            echo "✅ cookies.txt 已创建"
          fi

      - name: 清理运行进程和临时文件
        if: always()
        run: |
          if [ -n "${XVFB_PID:-}" ]; then
            kill "$XVFB_PID" 2>/dev/null || true
          fi
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log setup_proxy.sh

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
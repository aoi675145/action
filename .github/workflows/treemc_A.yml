name: TreeMC 续期 A

on:
  schedule:
    - cron: '5 */8 * * *'
  workflow_dispatch:

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: 拉取脚本库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: scripts_repo
          sparse-checkout: |
            scripts/treemc/treemc.py
            scripts/setup_proxy.sh.sh
          sparse-checkout-cone-mode: false

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 设置代理 (sing-box)
        env:
          TREEMC_PROXY: ${{ secrets.TREEMC_PROXY_A }}
        run: |
          NODE_LINK="$TREEMC_PROXY" bash scripts_repo/scripts/setup_proxy.sh.sh

      - name: 安装 Python 依赖
        run: pip install --quiet 'requests[socks]'

      - name: 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN_A }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        working-directory: scripts_repo/scripts/treemc
        run: |
          set -o pipefail
          python treemc.py 2>&1 | tee renew.log

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 5

name: QuartexNode_API 续期
on:
  workflow_dispatch:
  schedule:
    - cron: '33 3 26 5 *' # 下一个: 2026-05-26 03:33 UTC / 2026-05-26 11:33 北京时间 (API剩余时间减24h执行)

jobs:
  run_renewal_api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write

    steps:
      - name: 📥 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          ref: main
          path: scripts_repo
          token: ${{ secrets.REPO_TOKEN }}
          sparse-checkout: |
            scripts/quartex/main_API.py
          sparse-checkout-cone-mode: false

      - name: 📥 拉取工作流仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/action
          path: action_repo
          token: ${{ secrets.REPO_TOKEN }}

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 运行 QuartexNode API 脚本
        working-directory: scripts_repo/scripts/quartex
        env:
          quartexnode_TOKEN: ${{ secrets.quartexnode_TOKEN }}
          quartexnode_SERVER_ID: ${{ secrets.quartexnode_SERVER_ID }}
          WORKFLOW_FILE: ${{ github.workspace }}/action_repo/.github/workflows/quartex_API.yml
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python main_API.py

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

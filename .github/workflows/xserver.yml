name: XServer 续期 

on:
  workflow_dispatch:

concurrency:
  group: xserver-renew
  cancel-in-progress: false

jobs:
  extend-server:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          # 全部加重试/超时：站点维护期间 runner 拉包也偶发卡死，不能让一步挂满 60 分钟
          pip install --timeout 20 --retries 3 httpx seleniumbase pyautogui

          # runner 上的 unattended-upgrades 会长期持有 dpkg 锁，apt 会静默干等十几分钟
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo pkill -f unattended-upgrade 2>/dev/null || true

          # xserver.ne.jp 是日文站，只需日文字体：vlgothic 2.3MB（noto-cjk 是 58MB 四语合集）
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=120 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3 \
            xvfb xdotool fonts-vlgothic
          wget -q --timeout=30 --tries=3 -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y -qq
          python -m seleniumbase get uc_driver || true

      - name: 🌐 配置代理节点 (sing-box)
        env:
          XSERVER_PROXY: ${{ secrets.XSERVER_PROXY }}
        run: |
          bash scripts/xserver/setup_singbox.sh

      - name: 🚀 运行续期脚本
        id: run_script
        env:
          PYTHONIOENCODING: utf-8
          XSERVER: ${{ secrets.XSERVER }}
          XSERVER_PROXY: ${{ secrets.XSERVER_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CRON_JOB_API: ${{ secrets.CRON_JOB_API }}
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" python scripts/xserver/main.py

      - name: 📨 TG 失败通知
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WF_NAME: ${{ github.workflow }}
          WF_REPO: ${{ github.repository }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_RUN_NUM: ${{ github.run_number }}
        run: |
          MSG="❌ XServer 续期失败%0A任务: ${WF_NAME} (${WF_RUN_NUM})%0A仓库: ${WF_REPO}%0A运行页: https://github.com/${WF_REPO}/actions/runs/${WF_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - name: 🧹 清理代理进程
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box-*.json sing-box-*.log sing-box

      - name: 🧹 清理旧运行
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4

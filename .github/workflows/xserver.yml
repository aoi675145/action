name: XServer 续期 

on:
  workflow_dispatch:

concurrency:
  group: xserver-renew
  cancel-in-progress: false

jobs:
  extend-server:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 修复 apt 源
        run: |
          # runner 自带的 azure 镜像走 http，避开 apt https 方法里会卡死的 TLS select 路径；
          # archive / security 做备用源。22.04 和 24.04 一律写成旧版 sources.list（apt 两边都认），
          # 顺手清掉 ubuntu.sources 与 apt-mirrors.txt，否则 22.04 会报 "no longer has a Release file"。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          # apt 默认是"单次 read"超时，慢源会一直滴漏不触发，这里配小并加重试
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF
          # 索引刷新失败不阻断：真缺包时后面那步的 ensure-apt 会点名报错，避免源滴漏把 job 拖死
          timeout 90 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=8 -o Acquire::https::Timeout=8 -o Acquire::ForceIPv4=true \
            || timeout 120 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=8 -o Acquire::https::Timeout=8 -o Acquire::ForceIPv4=true \
            || echo "::warning::apt 索引刷新失败（源不可达），继续"
      - name: 📦 安装依赖
        timeout-minutes: 10
        run: |
          # 全部加重试/超时：站点维护期间 runner 拉包也偶发卡死，不能让一步挂满 60 分钟
          pip install --timeout 20 --retries 3 httpx seleniumbase pyautogui

          # runner 上的 unattended-upgrades 会长期持有 dpkg 锁，apt 会静默干等十几分钟
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo pkill -f unattended-upgrade 2>/dev/null || true

          # xserver.ne.jp 是日文站，只需日文字体：vlgothic 2.3MB（noto-cjk 是 58MB 四语合集）
          # 系统包按需安装：镜像自带就不碰 apt，源不可达也不会把 job 拖死（脚本见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/action/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh \
              --need-pkg "xvfb xdotool fonts-vlgothic"
          fi
          wget -q --timeout=30 --tries=3 -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || timeout 300 sudo apt-get install -o Acquire::Retries=3 -f -y -qq
          python -m seleniumbase get uc_driver || true

      - name: 🌐 配置代理节点 (sing-box)
        env:
          XSERVER_PROXY: ${{ secrets.XSERVER_PROXY }}
        run: |
          bash scripts/xserver/setup_singbox.sh

      - name: 🚀 运行续期脚本
        id: run_script
        env:
          PYTHONIOENCODING: utf-8
          XSERVER: ${{ secrets.XSERVER }}
          XSERVER_PROXY: ${{ secrets.XSERVER_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CRON_JOB_API: ${{ secrets.CRON_JOB_API }}
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" python scripts/xserver/main.py

      - name: 📨 TG 失败通知
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WF_NAME: ${{ github.workflow }}
          WF_REPO: ${{ github.repository }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_RUN_NUM: ${{ github.run_number }}
        run: |
          MSG="❌ XServer 续期失败%0A任务: ${WF_NAME} (${WF_RUN_NUM})%0A仓库: ${WF_REPO}%0A运行页: https://github.com/${WF_REPO}/actions/runs/${WF_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - name: 🧹 清理代理进程
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box-*.json sing-box-*.log sing-box

      - name: 🧹 清理旧运行
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4

name: XServer 续期 

on:
  schedule:
    - cron: '12 13 30 8 *'  # 自动更新下次运行时间
  workflow_dispatch:

jobs:
  extend-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install httpx

      - name: 配置代理节点 (sing-box)
        env:
          XSERVER_PROXY: ${{ secrets.XSERVER_PROXY }}
        run: |
          bash scripts/xserver/setup_singbox.sh

      - name: 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          XSERVER: ${{ secrets.XSERVER }}
          XSERVER_PROXY: ${{ secrets.XSERVER_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ACCOUNTS_TO_RENEW: ALL
        run: python scripts/xserver/main.py

      - name: 自动修改下次 Cron
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          WORKFLOW_REPO: ${{ github.repository }}
        run: |
          NEXT_FILE="next_time.txt"
          if [ ! -f "$NEXT_FILE" ]; then
            echo "⏭️ next_time.txt 不存在，跳过 cron 更新"
            exit 0
          fi

          echo "📅 读取最早可续期时间..."
          python3 << 'PYEOF'
          import os, re, subprocess
          from datetime import datetime, timedelta

          date_file = "next_time.txt"
          with open(date_file) as f:
              raw = f.read().strip()

          m = re.search(r'(\d{4})\D+(\d{1,2})\D+(\d{1,2})\D+(\d{1,2})\D+(\d{1,2})', raw)
          if not m:
              print("❌ 解析失败"); exit(1)

          jst = datetime(int(m[1]), int(m[2]), int(m[3]), int(m[4]), int(m[5]))
          utc = jst - timedelta(hours=9)
          new_cron = f"{utc.minute} {utc.hour} {utc.day} {utc.month} *"
          info = f"{utc.strftime('%Y-%m-%d %H:%M')} UTC (JST: {jst.strftime('%Y-%m-%d %H:%M')})"
          print(f"⏰ {info}")
          print(f"📟 {new_cron}")

          token = os.environ["REPO_TOKEN"]
          repo = os.environ["WORKFLOW_REPO"]
          subprocess.run(["git", "clone", f"https://x-access-token:{token}@github.com/{repo}.git", "wf-repo"], check=True, capture_output=True)
          os.chdir("wf-repo")

          wf = ".github/workflows/xserver.yml"
          with open(wf) as f:
              content = f.read()
          content = re.sub(r"- cron: '.*?'.*", f"- cron: '{new_cron}'  # 自动更新下次运行时间", content, count=1)
          with open(wf, 'w') as f:
              f.write(content)

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True, capture_output=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True, capture_output=True)
          subprocess.run(["git", "add", wf], check=True, capture_output=True)
          r = subprocess.run(["git", "commit", "-m", "🔄 自动更新 XServer 续期 Cron", "-m", f"下次运行: {info}"], capture_output=True, text=True)
          if r.returncode == 0:
              subprocess.run(["git", "push"], check=True, capture_output=True)
              print("✅ Cron 更新成功")
          else:
              print("ℹ️  无变更需提交")
          PYEOF

      - name: TG 失败通知
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WF_NAME: ${{ github.workflow }}
          WF_REPO: ${{ github.repository }}
          WF_RUN_ID: ${{ github.run_id }}
          WF_RUN_NUM: ${{ github.run_number }}
        run: |
          MSG="❌ XServer 续期失败%0A任务: ${WF_NAME} (${WF_RUN_NUM})%0A仓库: ${WF_REPO}%0A运行页: https://github.com/${WF_REPO}/actions/runs/${WF_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - name: 清理代理进程
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box-*.json sing-box-*.log sing-box

      - name: 清理旧运行
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4

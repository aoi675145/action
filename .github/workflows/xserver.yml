name: XServer 续期多账号版

on:
  schedule:
    - cron: '47 0 * * *'  
  workflow_dispatch:

jobs:
  extend-server:
    runs-on: ubuntu-latest

    steps:
      - name: 检查是否需要续期
        id: check
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          XSERVER_1: ${{ secrets.XSERVER_1 }}
          XSERVER_2: ${{ secrets.XSERVER_2 }}
          XSERVER_3: ${{ secrets.XSERVER_3 }}
          XSERVER_4: ${{ secrets.XSERVER_4 }}
          XSERVER_5: ${{ secrets.XSERVER_5 }}
          XSERVER_6: ${{ secrets.XSERVER_6 }}
          XSERVER_7: ${{ secrets.XSERVER_7 }}
          XSERVER_8: ${{ secrets.XSERVER_8 }}
          XSERVER_9: ${{ secrets.XSERVER_9 }}
          XSERVER_10: ${{ secrets.XSERVER_10 }}
        run: |
          echo "📋 读取 logs.txt..."

          HTTP_CODE=$(curl -sL -o /tmp/logs_response.json -w "%{http_code}" \
            -H "Authorization: token $REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/akina005/scripts/contents/scripts/XServer/logs.txt")

          if [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "📭 logs.txt 不存在，首次运行视为全部需要续期"
            echo "need_renew=true" >> $GITHUB_OUTPUT
            echo "accounts_to_renew=ALL" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ 读取 logs.txt 失败 (HTTP $HTTP_CODE)，视为全部需要续期"
            echo "need_renew=true" >> $GITHUB_OUTPUT
            echo "accounts_to_renew=ALL" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 解码 logs.txt 并保存 SHA
          python3 -c "
          import sys, json, base64
          data = json.load(sys.stdin)
          content = base64.b64decode(data['content']).decode('utf-8')
          print(content, end='')
          " < /tmp/logs_response.json > /tmp/logs.txt

          LOG_SHA=$(python3 -c "import sys,json; print(json.load(open('/tmp/logs_response.json'))['sha'])")
          echo "log_sha=$LOG_SHA" >> $GITHUB_OUTPUT

          echo "📋 检查各账号续期时间..."
          python3 << 'PY'
          import os
          from datetime import datetime, timedelta, timezone

          # 解析 XSERVER_N 环境变量获取账号邮箱
          accounts = []
          for key, value in sorted(os.environ.items()):
              if not key.startswith("XSERVER_") or not key[8:].isdigit():
                  continue
              if key.endswith("_XARY"):
                  continue
              parts = value.split("-----")
              if len(parts) < 2:
                  continue
              email = parts[0].strip()
              if email:
                  accounts.append(email.lower())

          # 解析 logs.txt
          logs_map = {}
          try:
              with open('/tmp/logs.txt') as f:
                  for line in f:
                      line = line.strip()
                      if '-----' not in line:
                          continue
                      p = line.split('-----')
                      if len(p) >= 2:
                          logs_map[p[0].strip().lower()] = p[1].strip()
          except FileNotFoundError:
              pass

          jst = timezone(timedelta(hours=9))
          now = datetime.now(jst)

          needs_renew = False
          for email in accounts:
              if email not in logs_map:
                  print(f"  👤 {email}: 不在 logs.txt 中，需要续期")
                  needs_renew = True
                  break
              try:
                  next_dt = datetime.strptime(logs_map[email], '%Y-%m-%d %H:%M').replace(tzinfo=jst)
                  if now >= next_dt:
                      print(f"  👤 {email}: 已到续期时间 ({logs_map[email]})，需要续期")
                      needs_renew = True
                      break
                  print(f"  👤 {email}: 跳过 ({logs_map[email]})")
              except ValueError:
                  print(f"  👤 {email}: 时间格式无效，需要续期")
                  needs_renew = True
                  break

          print(f"need_renew={'true' if needs_renew else 'false'}")
          print(f"accounts_to_renew=ALL")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"need_renew={'true' if needs_renew else 'false'}\n")
              f.write(f"accounts_to_renew=ALL\n")
          PY

          if [ "$(grep 'need_renew=false' $GITHUB_OUTPUT)" ]; then
            echo "✅ 所有账号均未到续期时间，跳过后续步骤"
          fi

      # ========== 以下所有步骤仅在需要续期时执行 ==========
      - name: 拉取私有仓库
        if: steps.check.outputs.need_renew == 'true'
        uses: actions/checkout@v4
        with:
          repository: akina005/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python
        if: steps.check.outputs.need_renew == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: steps.check.outputs.need_renew == 'true'
        run: |
          pip install httpx

      - name: 配置代理节点
        if: steps.check.outputs.need_renew == 'true'
        env:
          XSERVER_1_XARY: ${{ secrets.XSERVER_1_XARY }}
          XSERVER_2_XARY: ${{ secrets.XSERVER_2_XARY }}
          XSERVER_3_XARY: ${{ secrets.XSERVER_3_XARY }}
          XSERVER_4_XARY: ${{ secrets.XSERVER_4_XARY }}
          XSERVER_5_XARY: ${{ secrets.XSERVER_5_XARY }}
          XSERVER_6_XARY: ${{ secrets.XSERVER_6_XARY }}
          XSERVER_7_XARY: ${{ secrets.XSERVER_7_XARY }}
          XSERVER_8_XARY: ${{ secrets.XSERVER_8_XARY }}
          XSERVER_9_XARY: ${{ secrets.XSERVER_9_XARY }}
          XSERVER_10_XARY: ${{ secrets.XSERVER_10_XARY }}
        run: |
          set -e
          echo "⬇️ 下载 Xray..."
          wget -q https://github.com/akina005/akina/releases/download/proxy/Xray-linux-64.zip
          echo "📦 解压..."
          mkdir -p xray-bin
          unzip -oq Xray-linux-64.zip -d xray-bin
          chmod +x xray-bin/xray
          sudo mv xray-bin/xray /usr/local/bin/xray
          echo "✅ Xray $(xray version | head -1)"

          echo "⚙️ 生成代理配置..."
          python - <<'PY'
          import base64, json, os
          from urllib.parse import parse_qs, unquote, urlparse

          def to_bool(v): return str(v).lower() in {"1","true","yes","on"}

          def build_stream(network, security, query, host):
              stream = {"network": network or "tcp", "security": "none"}
              if security and security != "none":
                  stream["security"] = security
              if security == "tls":
                  tls_settings = {
                      "serverName": query.get("sni", [host])[0] or host,
                      "allowInsecure": True,
                  }
                  alpn = query.get("alpn", [""])[0]
                  if alpn:
                      tls_settings["alpn"] = [s.strip() for s in alpn.split(",") if s.strip()]
                  stream["tlsSettings"] = tls_settings
              elif security == "reality":
                  reality_settings = {"serverName": query.get("sni", [host])[0] or host}
                  fp = query.get("fp", [""])[0] or query.get("fingerprint", [""])[0]
                  if fp:
                      reality_settings["fingerprint"] = fp
                  pbk = query.get("pbk", [""])[0] or query.get("publicKey", [""])[0]
                  if pbk:
                      reality_settings["publicKey"] = pbk
                  sid = query.get("sid", [""])[0] or query.get("shortId", [""])[0]
                  if sid:
                      reality_settings["shortId"] = sid
                  spx = query.get("spx", [""])[0] or query.get("spiderX", [""])[0]
                  if spx:
                      reality_settings["spiderX"] = spx
                  stream["realitySettings"] = reality_settings
              if network == "ws":
                  ws_host = query.get("host", [host])[0]
                  stream["wsSettings"] = {
                      "path": unquote(query.get("path", ["/"])[0] or "/"),
                      "headers": {"Host": ws_host} if ws_host else {},
                  }
              elif network == "grpc":
                  stream["grpcSettings"] = {
                      "serviceName": query.get("serviceName", [""])[0],
                      "multiMode": to_bool(query.get("mode", [""])[0] == "multi"),
                  }
              return stream

          def parse_vless(url):
              p = urlparse(url)
              q = parse_qs(p.query)
              host, port, uuid = p.hostname, p.port, p.username
              if not host or not port or not uuid:
                  raise SystemExit("VLESS 格式无效")
              user = {"id": uuid, "encryption": "none"}
              flow = q.get("flow", [""])[0]
              if flow: user["flow"] = flow
              network = q.get("type", ["tcp"])[0]
              security = q.get("security", ["none"])[0]
              return {
                  "protocol": "vless",
                  "settings": {"vnext": [{"address": host, "port": port, "users": [user]}]},
                  "streamSettings": build_stream(network, security, q, host),
              }

          def parse_vmess(url):
              payload = url[len("vmess://"):].strip() + "=" * (-len(url[len("vmess://"):].strip()) % 4)
              try:
                  c = json.loads(base64.urlsafe_b64decode(payload).decode("utf-8"))
              except Exception as e:
                  raise SystemExit(f"VMess 解析失败: {e}")
              host, port, uuid = c.get("add"), int(c.get("port", 0)), c.get("id")
              if not host or not port or not uuid:
                  raise SystemExit("VMess 格式无效")
              network = c.get("net", "tcp")
              security = "tls" if str(c.get("tls", "")).lower() == "tls" else "none"
              query = {
                  "path": [c.get("path", "/")],
                  "host": [c.get("host", host)],
                  "sni": [c.get("sni", host)],
              }
              if c.get("alpn"): query["alpn"] = [c["alpn"]]
              if c.get("fp"): query["fp"] = [c["fp"]]
              return {
                  "protocol": "vmess",
                  "settings": {"vnext": [{"address": host, "port": port, "users": [{"id": uuid, "alterId": int(c.get("aid", 0) or 0), "security": c.get("scy", "auto") or "auto"}]}]},
                  "streamSettings": build_stream(network, security, query, host),
              }

          configured = []
          for i in range(1, 21):
              node = os.environ.get(f"XSERVER_{i}_XARY", "").strip()
              if not node:
                  continue
              if node.startswith("vless://"):
                  outbound = parse_vless(node)
              elif node.startswith("vmess://"):
                  outbound = parse_vmess(node)
              else:
                  print(f"⚠️ XSERVER_{i}_XARY 不支持的格式，跳过")
                  continue
              port = 7890 + i
              config = {
                  "log": {"loglevel": "warning"},
                  "inbounds": [{"tag": "http-in", "port": port, "listen": "127.0.0.1", "protocol": "http", "settings": {}}],
                  "outbounds": [{"tag": "proxy", **outbound}, {"tag": "direct", "protocol": "freedom", "settings": {}}],
                  "routing": {"domainStrategy": "AsIs", "rules": [{"type": "field", "inboundTag": ["http-in"], "outboundTag": "proxy"}]},
              }
              with open(f"xray-{i}.json", "w") as f:
                  json.dump(config, f, ensure_ascii=True, indent=2)
              configured.append((i, port))
              print(f"  ✅ 账号 {i} → 127.0.0.1:{port}")

          with open("xray-start.sh", "w") as f:
              f.write("#!/usr/bin/env bash\nset -e\n")
              for i, port in configured:
                  f.write(f"xray run -c xray-{i}.json > xray-{i}.log 2>&1 &\n")
          PY

          echo "🚀 启动代理..."
          chmod +x xray-start.sh
          ./xray-start.sh
          sleep 3

          echo "🔍 检查代理进程..."
          if pgrep -x xray > /dev/null 2>&1; then
              echo "✅ Xray 进程数: $(pgrep -x xray | wc -l)"
          else
              echo "❌ Xray 进程未运行！检查日志："
              for f in xray-*.log; do
                  [ -f "$f" ] && echo "--- $f ---" && cat "$f"
              done
              exit 1
          fi
          echo "🔍 连通性测试..."
          for i in $(seq 1 20); do
              port=$((7890 + i))
              if curl -s -o /dev/null --max-time 5 -x "http://127.0.0.1:$port" https://api.ipify.org 2>/dev/null; then
                  echo "  ✅ 账号 $i 代理正常"
              fi
          done

      - name: 运行续期脚本
        if: steps.check.outputs.need_renew == 'true'
        env:
          XSERVER_1: ${{ secrets.XSERVER_1 }}
          XSERVER_2: ${{ secrets.XSERVER_2 }}
          XSERVER_3: ${{ secrets.XSERVER_3 }}
          XSERVER_4: ${{ secrets.XSERVER_4 }}
          XSERVER_5: ${{ secrets.XSERVER_5 }}
          XSERVER_6: ${{ secrets.XSERVER_6 }}
          XSERVER_7: ${{ secrets.XSERVER_7 }}
          XSERVER_8: ${{ secrets.XSERVER_8 }}
          XSERVER_9: ${{ secrets.XSERVER_9 }}
          XSERVER_10: ${{ secrets.XSERVER_10 }}
          XSERVER_1_XARY: ${{ secrets.XSERVER_1_XARY }}
          XSERVER_2_XARY: ${{ secrets.XSERVER_2_XARY }}
          XSERVER_3_XARY: ${{ secrets.XSERVER_3_XARY }}
          XSERVER_4_XARY: ${{ secrets.XSERVER_4_XARY }}
          XSERVER_5_XARY: ${{ secrets.XSERVER_5_XARY }}
          XSERVER_6_XARY: ${{ secrets.XSERVER_6_XARY }}
          XSERVER_7_XARY: ${{ secrets.XSERVER_7_XARY }}
          XSERVER_8_XARY: ${{ secrets.XSERVER_8_XARY }}
          XSERVER_9_XARY: ${{ secrets.XSERVER_9_XARY }}
          XSERVER_10_XARY: ${{ secrets.XSERVER_10_XARY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ACCOUNTS_TO_RENEW: ${{ steps.check.outputs.accounts_to_renew }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          LOG_SHA: ${{ steps.check.outputs.log_sha }}
        run: python scripts/XServer/main.py

      - name: 清理旧运行
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1

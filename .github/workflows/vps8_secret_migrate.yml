name: 迁移 VPS8 Secrets 到 vps8 仓库

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: 密封并写入 vps8 仓库
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔐 迁移 secrets
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          VPS8: ${{ secrets.VPS8 }}
          VPS8_PROXY: ${{ secrets.VPS8_PROXY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          pip install -q pynacl requests
          python3 - <<'PYEOF'
          import base64
          import os

          import requests
          from nacl import encoding, public

          TOKEN = os.environ.get("REPO_TOKEN", "").strip()
          if not TOKEN:
              raise SystemExit("REPO_TOKEN 未配置")

          TARGET = "aoi675145/vps8"
          NAMES = [
              "VPS8",
              "VPS8_PROXY",
              "OPENAI_API_KEY",
              "OPENAI_BASE_URL",
              "OPENAI_MODEL",
              "TG_BOT_TOKEN",
              "TG_CHAT_ID",
          ]

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          resp = requests.get(
              f"https://api.github.com/repos/{TARGET}/actions/secrets/public-key",
              headers=headers,
              timeout=30,
          )
          if resp.status_code != 200:
              raise SystemExit(f"取公钥失败 {resp.status_code}: {resp.text[:200]}")
          pk = resp.json()
          box = public.SealedBox(public.PublicKey(pk["key"].encode(), encoding.Base64Encoder()))

          ok, skip, fail = [], [], []
          for name in NAMES:
              value = os.environ.get(name, "")
              if not value:
                  skip.append(name)
                  print(f"[SKIP] {name} 源仓库为空，跳过")
                  continue
              sealed = box.encrypt(value.encode())
              body = {
                  "encrypted_value": base64.b64encode(sealed).decode(),
                  "key_id": pk["key_id"],
              }
              r = requests.put(
                  f"https://api.github.com/repos/{TARGET}/actions/secrets/{name}",
                  headers=headers,
                  json=body,
                  timeout=30,
              )
              if r.status_code in (201, 204):
                  ok.append(name)
                  print(f"[OK]   {name} 已写入 {TARGET}")
              else:
                  fail.append(name)
                  print(f"[FAIL] {name} HTTP {r.status_code}: {r.text[:160]}")

          print(f"\n小结：成功 {len(ok)} / 跳过 {len(skip)} / 失败 {len(fail)}")
          if fail:
              raise SystemExit(1)
          PYEOF

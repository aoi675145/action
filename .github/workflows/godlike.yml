name: Godlike 续期
on:
  schedule:
    - cron: '5 2 * * *'  # UTC 02:05 = 北京时间每天 10:05
  workflow_dispatch:

jobs:
  add_time_job:
    name: 运行续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 从私库拉取脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "[ERROR] 未配置 REPO_TOKEN，无法拉取私库脚本"
            exit 1
          fi
          fetch() {
            curl -fsSL --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $REPO_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/aoi675145/scripts/contents/scripts/$1?ref=main" \
              -o "$2"
          }
          fetch "godlike/main.py" main.py
          fetch "setup_proxy.sh.sh" setup_proxy.sh.sh
          for f in main.py setup_proxy.sh.sh; do
            if [ ! -s "$f" ]; then
              echo "[ERROR] 私库脚本 $f 拉取失败或为空"
              exit 1
            fi
          done
          echo "[INFO] ✅ 已从私库拉取 main.py 和 setup_proxy.sh.sh"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install 'requests[socks]' playwright pynacl 'websockets>=13' python-socks
          playwright install --with-deps chromium

      - name: 设置代理 (sing-box)
        env:
          GODLIKE_PROXY: ${{ secrets.GODLIKE_PROXY }}
        run: |
          if [ -z "$GODLIKE_PROXY" ]; then
            echo "[ERROR] 未配置 GODLIKE_PROXY，本工作流必须走代理，拒绝直连"
            exit 1
          fi
          NODE_LINK="$GODLIKE_PROXY" bash setup_proxy.sh.sh

      - name: 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          GODLIKE: ${{ secrets.GODLIKE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          python main.py 2>&1 | tee renew.log

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 清理历史
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2

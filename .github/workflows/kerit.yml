name: Kerit-Renew

on:
  workflow_dispatch:
    inputs:
      reset_browser_state:
        description: '清空当前账号浏览器缓存后运行（换服务器/换环境时勾选）'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 1 */6 * *'

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --quiet seleniumbase requests beautifulsoup4

      - name: 生成账号专属缓存前缀
        env:
          BILLING_KERIT_MAIL: ${{ secrets.BILLING_KERIT_MAIL }}
        run: |
          set -e
          if [[ "$BILLING_KERIT_MAIL" != *"----"* ]]; then
            echo "::error::BILLING_KERIT_MAIL 格式错误，应为 email----password"
            exit 1
          fi

          EMAIL="${BILLING_KERIT_MAIL%%----*}"
          CACHE_SCOPE=$(printf '%s' "$EMAIL" | sha256sum | cut -c1-16)
          echo "KERIT_CACHE_PREFIX=kerit-state-${CACHE_SCOPE}-" >> "$GITHUB_ENV"
          echo "✅ 已生成账号专属缓存前缀"

      - name: 手动清空当前账号浏览器状态缓存
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_browser_state }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🗑️ 手动清空当前账号浏览器状态缓存..."

          CACHE_KEYS=$(gh cache list --limit 100 --json key -q '.[].key' --repo ${{ github.repository }} | grep "^${KERIT_CACHE_PREFIX}" || true)

          if [ -z "$CACHE_KEYS" ]; then
            echo "没有找到当前账号缓存"
          else
            echo "找到以下缓存:"
            echo "$CACHE_KEYS"
            echo ""

            for key in $CACHE_KEYS; do
              echo "删除: $key"
              gh cache delete "$key" --repo ${{ github.repository }} || true
            done

            echo "✅ 当前账号缓存已清空"
          fi

      - name: 安装并启动 Xray 代理
        env:
          BILLING_KERIT_PROXY_NODE: ${{ secrets.BILLING_KERIT_PROXY_NODE }}
        run: |
          if [ -z "$BILLING_KERIT_PROXY_NODE" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          wget -q https://github.com/oyz6/action/releases/download/proxy/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray && chmod +x xray/xray

          python3 << 'PYEOF'
          import os, sys, json, base64
          from urllib.parse import parse_qs, unquote

          def mask(s):
              return f"{s[:2]}***{s[-2:]}" if len(s) > 4 else "****"

          url = os.environ.get("BILLING_KERIT_PROXY_NODE", "").strip()
          if not url:
              print("[ERROR] BILLING_KERIT_PROXY_NODE 为空")
              sys.exit(1)

          if url.startswith("vless://"):
              protocol = "vless"
              content = url[8:]
          elif url.startswith("vmess://"):
              protocol = "vmess"
              content = url[8:]
          elif url.startswith("trojan://"):
              protocol = "trojan"
              content = url[9:]
          elif url.startswith("ss://"):
              protocol = "ss"
              content = url[5:]
          elif url.startswith("socks5://") or url.startswith("socks://"):
              protocol = "socks5"
              content = url.split("://")[1].split("#")[0]
              if "@" in content:
                  server = content.split("@")[1].split(":")[0]
              else:
                  server = content.split(":")[0]
              print(f"[INFO] SOCKS5 -> {mask(server)}")
              with open("use_external_socks.txt", "w") as f:
                  f.write(url.split("#")[0])
              sys.exit(0)
          else:
              print(f"[ERROR] 不支持的协议: {url.split('://')[0]}")
              sys.exit(1)

          if "#" in content:
              content = content.rsplit("#", 1)[0]

          config = {
              "log": {"loglevel": "warning"},
              "inbounds": [
                  {"port": 1080, "listen": "127.0.0.1", "protocol": "socks", "settings": {"udp": True}},
                  {"port": 1081, "listen": "127.0.0.1", "protocol": "http"}
              ],
              "outbounds": []
          }

          if protocol == "vless":
              uuid, rest = content.split("@", 1)
              if "?" in rest:
                  host_port, params_str = rest.split("?", 1)
              else:
                  host_port, params_str = rest, ""
              if ":" in host_port:
                  address, port = host_port.rsplit(":", 1)
              else:
                  address, port = host_port, "443"
              params = parse_qs(params_str)
              security = params.get("security", ["none"])[0]
              network = params.get("type", ["tcp"])[0]
              sni = params.get("sni", [address])[0]
              fp = params.get("fp", ["chrome"])[0]
              flow = params.get("flow", [""])[0]
              pbk = params.get("pbk", [""])[0]
              host = params.get("host", [sni])[0]
              path = unquote(params.get("path", ["/"])[0])
              print(f"[INFO] VLESS -> {mask(address)}:{port} (security: {security}, network: {network})")
              outbound = {
                  "protocol": "vless",
                  "settings": {"vnext": [{"address": address, "port": int(port), "users": [{"id": uuid, "encryption": "none"}]}]},
                  "streamSettings": {"network": network, "security": security}
              }
              if flow:
                  outbound["settings"]["vnext"][0]["users"][0]["flow"] = flow
              if security == "reality":
                  outbound["streamSettings"]["realitySettings"] = {"serverName": sni, "fingerprint": fp, "publicKey": pbk}
              elif security == "tls":
                  outbound["streamSettings"]["tlsSettings"] = {"serverName": sni, "fingerprint": fp, "allowInsecure": False}
              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {"path": path, "headers": {"Host": host}}
              elif network == "grpc":
                  outbound["streamSettings"]["grpcSettings"] = {"serviceName": params.get("serviceName", [""])[0]}
              config["outbounds"].append(outbound)

          elif protocol == "vmess":
              try:
                  padding = 4 - len(content) % 4
                  if padding != 4:
                      content += "=" * padding
                  decoded = base64.b64decode(content).decode("utf-8")
                  vm = json.loads(decoded)
              except Exception as e:
                  print(f"[ERROR] VMess 解析失败: {e}")
                  sys.exit(1)
              address = vm.get("add", "")
              port = int(vm.get("port", 443))
              uuid = vm.get("id", "")
              aid = int(vm.get("aid", 0))
              network = vm.get("net", "tcp")
              tls = vm.get("tls", "")
              sni = vm.get("sni", "") or vm.get("host", address)
              host = vm.get("host", address)
              path = vm.get("path", "/")
              fp = vm.get("fp", "chrome")
              print(f"[INFO] VMess -> {mask(address)}:{port} (network: {network}, tls: {tls})")
              outbound = {
                  "protocol": "vmess",
                  "settings": {"vnext": [{"address": address, "port": port, "users": [{"id": uuid, "alterId": aid, "security": "auto"}]}]},
                  "streamSettings": {"network": network, "security": "tls" if tls == "tls" else "none"}
              }
              if tls == "tls":
                  outbound["streamSettings"]["tlsSettings"] = {"serverName": sni, "fingerprint": fp, "allowInsecure": False}
              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {"path": path, "headers": {"Host": host}}
              config["outbounds"].append(outbound)

          elif protocol == "trojan":
              password, rest = content.split("@", 1)
              if "?" in rest:
                  host_port, params_str = rest.split("?", 1)
              else:
                  host_port, params_str = rest, ""
              if ":" in host_port:
                  address, port = host_port.rsplit(":", 1)
              else:
                  address, port = host_port, "443"
              params = parse_qs(params_str)
              sni = params.get("sni", [address])[0]
              network = params.get("type", ["tcp"])[0]
              host = params.get("host", [sni])[0]
              path = unquote(params.get("path", ["/"])[0])
              fp = params.get("fp", ["chrome"])[0]
              print(f"[INFO] Trojan -> {mask(address)}:{port} (network: {network})")
              outbound = {
                  "protocol": "trojan",
                  "settings": {"servers": [{"address": address, "port": int(port), "password": password}]},
                  "streamSettings": {"network": network, "security": "tls", "tlsSettings": {"serverName": sni, "fingerprint": fp, "allowInsecure": False}}
              }
              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {"path": path, "headers": {"Host": host}}
              config["outbounds"].append(outbound)

          elif protocol == "ss":
              try:
                  if "@" in content:
                      encoded, server_part = content.split("@", 1)
                      decoded = base64.b64decode(encoded + "==").decode("utf-8")
                      method, password = decoded.split(":", 1)
                      address, port = server_part.split(":", 1)
                  else:
                      decoded = base64.b64decode(content + "==").decode("utf-8")
                      if "@" in decoded:
                          user_part, server_part = decoded.split("@", 1)
                          method, password = user_part.split(":", 1)
                          address, port = server_part.split(":", 1)
                      else:
                          raise ValueError("无法解析")
              except Exception as e:
                  print(f"[ERROR] Shadowsocks 解析失败: {e}")
                  sys.exit(1)
              print(f"[INFO] Shadowsocks -> {mask(address)}:{port}")
              config["outbounds"].append({
                  "protocol": "shadowsocks",
                  "settings": {"servers": [{"address": address, "port": int(port), "method": method, "password": password}]}
              })

          with open("xray_config.json", "w") as f:
              json.dump(config, f, indent=2)
          print("[INFO] ✅ 代理配置已生成")
          PYEOF

          if [ -f "use_external_socks.txt" ]; then
            EXTERNAL_SOCKS=$(cat use_external_socks.txt)
            echo "BILLING_KERIT_PROXY_NODE=$EXTERNAL_SOCKS" >> $GITHUB_ENV
            echo "[INFO] ✅ 使用外部 SOCKS5 代理"
            exit 0
          fi

          ./xray/xray run -c xray_config.json > xray.log 2>&1 &
          sleep 5

          echo "[INFO] 测试代理连接..."
          for i in 1 2 3 4 5; do
            if curl -x http://127.0.0.1:1081 -s --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
              echo "[INFO] ✅ 代理连接成功"
              echo "BILLING_KERIT_PROXY_NODE=http://127.0.0.1:1081" >> $GITHUB_ENV
              exit 0
            fi
            echo "[WARN] 尝试 $i/5..."
            sleep 3
          done

          echo "[ERROR] ❌ 代理连接失败"
          cat xray.log
          exit 1

      - name: 恢复浏览器状态缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: browser_state
          key: ${{ env.KERIT_CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: |
            ${{ env.KERIT_CACHE_PREFIX }}

      - name: 清理 Chrome 锁文件
        run: |
          PROFILE_DIR="browser_state/selenium_profile"
          if [ -d "$PROFILE_DIR" ]; then
            echo "🧹 清理浏览器锁文件..."
            find "$PROFILE_DIR" -name "SingletonLock" -delete 2>/dev/null || true
            find "$PROFILE_DIR" -name "SingletonSocket" -delete 2>/dev/null || true
            find "$PROFILE_DIR" -name "SingletonCookie" -delete 2>/dev/null || true
            echo "✅ 清理完成"
          else
            echo "📂 用户数据目录不存在，无需清理"
          fi

      - name: 运行续期脚本
        id: run_renew
        env:
          BILLING_KERIT_MAIL: ${{ secrets.BILLING_KERIT_MAIL }}
          TG_BOT: ${{ secrets.TG_BOT }}
          BILLING_KERIT_PROXY_NODE: ${{ env.BILLING_KERIT_PROXY_NODE }}
        run: |
          python3 scripts/kerit/kerit.py 2>&1 | tee renew.log

      - name: 删除旧浏览器状态缓存
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🗑️ 清理旧缓存..."
          PREFIX="${KERIT_CACHE_PREFIX}"
          CACHE_KEYS=$(gh cache list --limit 100 --json key -q '.[].key' --repo ${{ github.repository }} | grep "^${PREFIX}" || true)
          if [ -z "$CACHE_KEYS" ]; then
            echo "没有找到旧缓存"
          else
            echo "找到以下缓存:"
            echo "$CACHE_KEYS"
            echo ""
            for key in $CACHE_KEYS; do
              echo "删除: $key"
              gh cache delete "$key" --repo ${{ github.repository }} || true
            done
            echo "✅ 旧缓存清理完成"
          fi

      - name: 保存浏览器状态缓存
        if: success()
        uses: actions/cache/save@v4
        with:
          path: browser_state
          key: ${{ env.KERIT_CACHE_PREFIX }}${{ github.run_id }}

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

name: ENDHOST 续期

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = 只登录不续期；renew = 登录 + 续期 + 开机"
        required: false
        default: "renew"
        type: choice
        options: [probe, renew]
      actions:
        description: "动作，逗号分隔：renew,start"
        required: false
        default: "renew,start"
        type: string

concurrency:
  group: endhost-renew
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/endhost/**
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装依赖
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet "requests[socks]" pydoll-python
          python -c "import requests, pydoll; print('deps ok')"

      - name: 🌍 安装 Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq /tmp/chrome.deb
          echo "CHROME_BIN=/usr/bin/google-chrome" >> $GITHUB_ENV
          /usr/bin/google-chrome --version

      - name: 🎨 安装 Mesa GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils xvfb || true

      - name: 🌐 设置代理
        env:
          ENDHOST_PROXY: ${{ secrets.ENDHOST_PROXY }}
        run: |
          if [ -z "$ENDHOST_PROXY" ]; then
            echo "::error::ENDHOST_PROXY 未配置"
            exit 1
          fi
          NODE_LINK="$ENDHOST_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 运行 ENDHOST
        env:
          PYTHONIOENCODING: utf-8
          ED_URL: https://endevil.live
          ED_PROXY: ${{ env.PROXY_SERVER }}
          ED_TOKEN_PROXY: ${{ env.PROXY_SERVER }}
          ED_GH_COOKIES: ${{ secrets.ENDHOST_GH_COOKIES }}
          ED_SITEKEY: ${{ secrets.ENDHOST_SITEKEY }}
          ED_FP: ${{ secrets.ENDHOST_FP }}
          ED_ACTIONS: ${{ github.event.inputs.actions || 'renew,start' }}
          ED_OUT: /tmp/edout
          ED_CHROME_ARGS: "--use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TMPDIR: /tmp
        run: |
          set -o pipefail
          FLAG="--renew"
          if [ "${{ github.event.inputs.mode || 'renew' }}" = "probe" ]; then FLAG="--probe"; fi
          echo "mode=$FLAG proxy=$ED_PROXY"
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            python -u private-repo/scripts/endhost/endhost.py "$FLAG" 2>&1 | tee endhost.log

      - name: 📤 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endhost-dump
          path: |
            /tmp/edout/**
            endhost.log
          if-no-files-found: warn
          retention-days: 3

      - name: 🧹 清理代理
        if: always()
        run: pkill -f sing-box || true

name: ENDHOST 续期

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = 只登录并抓接口；renew = 执行续期"
        required: false
        default: "probe"
        type: choice
        options: [probe, renew]
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: endhost-renew
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/endhost/**
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装 Camoufox（Chromium 过不了本站 Turnstile）
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet camoufox
          python -m camoufox fetch
          python -c "import camoufox; print('camoufox ok')"

      - name: 🎨 装 Mesa 软件 GL（CI 无显卡，canvas readback 会是空白）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils || true
          glxinfo -B 2>/dev/null | head -5 || echo "glxinfo unavailable"

      - name: 🌐 设置代理 (sing-box)
        env:
          ENDHOST_PROXY: ${{ secrets.ENDHOST_PROXY }}
        run: |
          if [ -z "$ENDHOST_PROXY" ]; then
            echo "::warning::ENDHOST_PROXY 未配置，Cloudflare 会拦数据中心出口"
            exit 0
          fi
          NODE_LINK="$ENDHOST_PROXY" bash private-repo/scripts/setup_proxy.sh || \
            echo "::warning::代理起不来，脚本会自动回退直连"

      - name: 🚀 运行 ENDHOST
        id: run_script
        env:
          PYTHONIOENCODING: utf-8
          ED_URL: https://endevil.live
          ED_PROXY: ${{ env.PROXY_SERVER }}
          ED_DEVICE_FP: ${{ secrets.ENDHOST_FP }}
          ED_GH_COOKIES: ${{ secrets.ENDHOST_GH_COOKIES }}
          ED_OUT: /tmp/edout
          MODE: ${{ github.event.inputs.mode || 'renew' }}
          TMPDIR: /tmp
        run: |
          set -o pipefail
          FLAG="--probe"
          if [ "$MODE" = "renew" ]; then FLAG="--renew"; fi
          echo "mode=$FLAG proxy=$ED_PROXY"
          xvfb-run -a --server-args="-screen 0 1366x920x24" \
            python -u private-repo/scripts/endhost/endhost.py "$FLAG" 2>&1 | tee endhost.log

      - name: 📤 上传抓取结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endhost-dump
          path: |
            /tmp/edout/**
            endhost.log
          if-no-files-found: warn
          retention-days: 3

      - name: 🧹 清理代理进程
        if: always()
        run: pkill -f sing-box || true

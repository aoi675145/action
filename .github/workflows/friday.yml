name: Friday 续期

on:
  schedule:
    # 自动更新：每次运行后脚本写入 next_run.txt，本行被改为固定日期（北京 09:23）
    - cron: "23 1 14 9 *"
  workflow_dispatch:  # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write

    steps:
      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/friday/friday.py
            scripts/setup_proxy.sh.sh
          sparse-checkout-cone-mode: false

      - name: 拉取工作流仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/action
          token: ${{ secrets.REPO_TOKEN }}
          path: action_repo
          sparse-checkout: |
            .github/workflows/friday.yml
          sparse-checkout-cone-mode: false

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 设置代理 (sing-box)
        env:
          FRIDAY_PROXY: ${{ secrets.FRIDAY_PROXY }}
        run: |
          if [ -z "$FRIDAY_PROXY" ]; then
            echo "::error::FRIDAY_PROXY 未配置，本工作流不允许直连"
            exit 1
          fi
          NODE_LINK="$FRIDAY_PROXY" bash private-repo/scripts/setup_proxy.sh.sh

      - name: 安装 Python 依赖
        run: pip install 'requests[socks]'

      - name: 执行续期
        env:
          PYTHONIOENCODING: utf-8
          FRIDAY: ${{ secrets.FRIDAY }}
          TG_BOT: ${{ secrets.TG_BOT }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        working-directory: private-repo/scripts/friday
        run: |
          set -o pipefail
          python friday.py 2>&1 | tee renew.log

      - name: 修改 cron
        if: always()
        run: |
          NEXT_FILE=private-repo/scripts/friday/next_run.txt
          if [ ! -f "$NEXT_FILE" ]; then
            echo "next_run.txt 不存在，跳过 cron 更新"
            exit 0
          fi
          next_cron=$(tr -d '\n\r' < "$NEXT_FILE")
          echo "cron: $next_cron"
          git -C action_repo remote set-url origin https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/aoi675145/action.git
          git -C action_repo fetch origin
          git -C action_repo reset --hard origin/main
          sed -i "s/- cron: \".*\"/- cron: \"$next_cron\"/" action_repo/.github/workflows/friday.yml
          git -C action_repo config user.name "github-actions[bot]"
          git -C action_repo config user.email "github-actions[bot]@users.noreply.github.com"
          git -C action_repo add .github/workflows/friday.yml
          git -C action_repo diff --cached --quiet || (git -C action_repo commit -m "auto: cron $next_cron" && git -C action_repo push --quiet && echo "✅ Cron 已更新")

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4

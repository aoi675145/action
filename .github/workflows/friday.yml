name: Friday 续期

on:
  schedule:
    # 自动更新：每次运行后脚本写入 next_run.txt，本行被改为固定日期（北京 09:23）
    - cron: "23 1 22 9 *"
  workflow_dispatch:  # 允许手动触发

permissions:
  actions: write
  contents: write

jobs:
  renew:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: 'aoi675145/scripts'
          token: ${{ secrets.REPO_TOKEN }}
          sparse-checkout: |
            scripts/friday/friday.py
            scripts/setup_proxy.sh.sh
          sparse-checkout-cone-mode: false

      - name: 拉取工作流仓库
        uses: actions/checkout@v4
        with:
          repository: 'aoi675145/action'
          token: ${{ secrets.REPO_TOKEN }}
          path: action_repo
          sparse-checkout: |
            .github/workflows/friday.yml
          sparse-checkout-cone-mode: false

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tzdata

      - name: 安装 Python 依赖
        # filelock 3.32.5 起对同线程嵌套 FileLock 抛 Deadlock，会打断
        # SeleniumBase UC 模式的 pyautogui.lock 获取；脚本启动时会给
        # pyautogui.lock 打 is_singleton 单例补丁，这里固定版本以免行为再变。
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "filelock==3.32.5" seleniumbase 'requests[socks]'

      - name: 设置代理 (sing-box)
        env:
          FRIDAY_PROXY: ${{ secrets.FRIDAY_PROXY }}
        run: |
          if [ -z "$FRIDAY_PROXY" ]; then
            echo "::error::FRIDAY_PROXY 未配置，本工作流不允许直连"
            exit 1
          fi
          NODE_LINK="$FRIDAY_PROXY" bash scripts/setup_proxy.sh.sh

      - name: 执行续期
        env:
          PYTHONIOENCODING: utf-8
          FRIDAY: ${{ secrets.FRIDAY }}
          TG_BOT: ${{ secrets.TG_BOT }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        working-directory: scripts/friday
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" \
            python -u friday.py 2>&1 | tee renew.log
        continue-on-error: true

      - name: 修改 cron
        if: always()
        run: |
          NEXT_FILE=scripts/friday/next_run.txt
          if [ ! -f "$NEXT_FILE" ]; then
            echo "next_run.txt 不存在，跳过 cron 更新"
            exit 0
          fi
          next_cron=$(tr -d '\n\r' < "$NEXT_FILE")
          echo "cron: $next_cron"
          git -C action_repo remote set-url origin https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/aoi675145/action.git
          git -C action_repo fetch origin
          git -C action_repo reset --hard origin/main
          sed -i "s/- cron: \".*\"/- cron: \"$next_cron\"/" action_repo/.github/workflows/friday.yml
          git -C action_repo config user.name "github-actions[bot]"
          git -C action_repo config user.email "github-actions[bot]@users.noreply.github.com"
          git -C action_repo add .github/workflows/friday.yml
          git -C action_repo diff --cached --quiet || (git -C action_repo commit -m "auto: cron $next_cron" && git -C action_repo push --quiet && echo "✅ Cron 已更新")

      - name: 清理临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log
          find scripts/friday -maxdepth 1 -name "*.png" -delete 2>/dev/null || true

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3

name: VPSFREE 续期

on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * *' # 自动更新下次运行时间

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/vpsfree/vpsfree.py
            scripts/setup_proxy.sh.sh
          sparse-checkout-cone-mode: false

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable xvfb fonts-noto-cjk fonts-wqy-zenhei p7zip-full jq

      - name: 安装 Python 库
        run: |
          pip install -q seleniumbase 'requests[socks]'

      - name: 安装 ChromeDriver
        run: seleniumbase install chromedriver

      - name: 下载并解压扩展
        run: |
          mkdir -p scripts/extensions/nopecha scripts/extensions/buster

          wget -q -O scripts/extensions/nopecha/chromium.zip \
            https://github.com/NopeCHALLC/nopecha-extension/releases/download/0.6.0/chromium.zip
          7z x -y scripts/extensions/nopecha/chromium.zip -oscripts/extensions/nopecha/unpacked

          wget -q -O scripts/extensions/buster/buster.zip \
            https://github.com/dessant/buster/releases/download/v3.1.3/buster_captcha_solver_for_humans-3.1.3-chrome.zip
          7z x -y scripts/extensions/buster/buster.zip -oscripts/extensions/buster/unpacked

      - name: 设置代理 (sing-box)
        env:
          VPSFREE_PROXY: ${{ secrets.VPSFREE_PROXY }}
        run: |
          if [ -z "$VPSFREE_PROXY" ]; then
            echo "::error::VPSFREE_PROXY 未配置（必填）"
            exit 1
          fi
          NODE_LINK="$VPSFREE_PROXY" bash private-repo/scripts/setup_proxy.sh.sh

      - name: 清理旧截图
        run: rm -rf screenshots

      - name: 执行 VPSFREE 续期
        env:
          PYTHONIOENCODING: utf-8
          VPSFREE: ${{ secrets.VPSFREE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" python -u private-repo/scripts/vpsfree/vpsfree.py 2>&1 | tee renew.log

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 保存截图到私库
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ ! -d screenshots ] || [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "[截图] screenshots 目录不存在或为空，跳过"
            exit 0
          fi
          echo "[截图] 克隆私库 aoi675145/scripts，保存截图..."
          git clone --depth 1 "https://x-access-token:${REPO_TOKEN}@github.com/aoi675145/scripts.git" scripts-cache
          mkdir -p scripts-cache/scripts/vpsfree/screenshots
          cp -f screenshots/*.png scripts-cache/scripts/vpsfree/screenshots/
          cd scripts-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/vpsfree/screenshots/
          if [ -z "$(git status --porcelain -- scripts/vpsfree/screenshots/)" ]; then
            echo "[截图] 截图无变化，跳过提交"
            exit 0
          fi
          git commit -m "更新 VPSFREE 截图 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
          echo "[截图] 截图已保存到私库 scripts/vpsfree/screenshots/"

      - name: 提取下次运行时间
        id: extract_next_run
        if: success()
        run: |
          NEXT_RUN=$(grep -oP '下次触发\(UTC\): \K\d{4}-\d{2}-\d{2} \d{2}:\d{2}' renew.log | tail -1 || true)
          if [ -z "$NEXT_RUN" ]; then
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未能提取下次运行时间，跳过 Cron 更新"
            exit 0
          fi
          echo "next_run=$NEXT_RUN" >> "$GITHUB_OUTPUT"
          echo "skip_update=false" >> "$GITHUB_OUTPUT"
          echo "::notice::⏰ 下次运行时间: $NEXT_RUN UTC"

      - name: 自动修改下次 Cron
        if: success() && steps.extract_next_run.outputs.skip_update != 'true'
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          NEXT_RUN: ${{ steps.extract_next_run.outputs.next_run }}
        run: |
          set -e
          NEXT_MINUTE=$(date -u -d "$NEXT_RUN" +"%-M")
          NEXT_HOUR=$(date -u -d "$NEXT_RUN" +"%-H")
          NEXT_DAY=$(date -u -d "$NEXT_RUN" +"%-d")
          NEXT_MONTH=$(date -u -d "$NEXT_RUN" +"%-m")
          NEW_CRON="$NEXT_MINUTE $NEXT_HOUR $NEXT_DAY $NEXT_MONTH *"

          echo "::notice::📟 新 Cron: $NEW_CRON"
          git clone "https://${{ github.actor }}:${REPO_TOKEN}@github.com/${{ github.repository }}.git" workflow-repo
          cd workflow-repo

          WORKFLOW_FILE="vpsfree.yml"
          if [ ! -f "$WORKFLOW_FILE" ]; then
            WORKFLOW_FILE=".github/workflows/vpsfree.yml"
          fi
          if [ ! -f "$WORKFLOW_FILE" ]; then
            echo "::error::找不到 vpsfree.yml"
            exit 1
          fi

          LINE_NUM=$(grep -n "cron: '" "$WORKFLOW_FILE" | head -n1 | cut -d: -f1)
          if [ -z "$LINE_NUM" ]; then
            echo "::error::找不到 cron 行"
            exit 1
          fi

          sed -i "${LINE_NUM}c\\    - cron: '$NEW_CRON' # 自动更新下次运行时间" "$WORKFLOW_FILE"
          if git diff --quiet -- "$WORKFLOW_FILE"; then
            echo "::notice::Cron 无变化，无需提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW_FILE"
          git commit -m "🔄 自动更新 VPSFREE 续期 Cron" -m "下次运行: $NEXT_RUN UTC" -m "Cron: $NEW_CRON"
          git push
          echo "::notice::✅ Cron 更新成功"

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
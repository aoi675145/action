name: Wispbyte 自动重启

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '指定邮箱账号（留空运行全部，多个用逗号分隔）'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  restart:
    name: 执行重启脚本
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 从私库拉取脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p scripts
          echo "[INFO] 从私库拉取 main.py..."
          DOWNLOAD_FILE="$(mktemp)"
          if curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o "${DOWNLOAD_FILE}" \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/wispbyte/main.py"; then
            echo "[INFO] 使用私库路径: scripts/wispbyte/main.py"
          elif curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o "${DOWNLOAD_FILE}" \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/Wispbyte/main.py"; then
            echo "[WARN] 使用兼容路径: scripts/Wispbyte/main.py"
          else
            rm -f "${DOWNLOAD_FILE}"
            if [ -s scripts/main.py ]; then
              echo "[WARN] 私库脚本下载失败，继续使用当前仓库中的 scripts/main.py"
              echo "[INFO] ✅ main.py 已就绪 ($(wc -l < scripts/main.py) 行)"
              exit 0
            fi
            echo "[ERROR] 私库及当前仓库中均未找到可用的 main.py"
            exit 1
          fi
          test -s "${DOWNLOAD_FILE}"
          mv "${DOWNLOAD_FILE}" scripts/main.py
          echo "[INFO] ✅ main.py 已下载 ($(wc -l < scripts/main.py) 行)"
          # 公用代理启动脚本（setup_proxy.sh 解析节点 + 起 sing-box，导出 PROXY_SERVER）
          curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o scripts/setup_proxy.sh \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/setup_proxy.sh"
          test -s scripts/setup_proxy.sh
          echo "[INFO] ✅ setup_proxy.sh 已下载"

      - name: 📦 修复 apt 源
        run: |
          # runner 自带的 azure 镜像走 http，避开 apt https 方法里会卡死的 TLS select 路径；
          # archive / security 做备用源。22.04 和 24.04 一律写成旧版 sources.list（apt 两边都认），
          # 顺手清掉 ubuntu.sources 与 apt-mirrors.txt，否则 22.04 会报 "no longer has a Release file"。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          # apt 默认是"单次 read"超时，慢源会一直滴漏不触发，这里配小并加重试
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 📦 安装系统依赖
        timeout-minutes: 10
        run: |
          # 系统包按需安装：镜像自带就不碰 apt，源不可达也不会把 job 拖死（脚本见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/action/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh \
              --need-pkg "xvfb unzip curl gnupg"
          fi
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || timeout 300 sudo apt-get install -o Acquire::Retries=3 -f -y

      - name: 📦 安装 Python 依赖
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install seleniumbase pyvirtualdisplay requests curl_cffi pydoll-python websockets
          echo "[INFO] 预安装 SeleniumBase UC Driver..."
          if sbase get uc_driver >/tmp/uc-driver-install.log 2>&1; then
            echo "[INFO] ✅ UC Driver 已准备完成"
          else
            cat /tmp/uc-driver-install.log
            exit 1
          fi

      - name: 🌐 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: ⚙ 设置代理 (sing-box, 大阪节点)
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          NODE_LINK: ${{ secrets.WISPBYTE_PROXY_NODE }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "[ERROR] WISPBYTE_PROXY_NODE 未配置（已禁止直连，Turnstile 过不了 WARP 出口）"
            exit 1
          fi
          chmod +x scripts/setup_proxy.sh
          NODE_LINK="$NODE_LINK" bash scripts/setup_proxy.sh

          source "$GITHUB_ENV"
          if [ "${IS_PROXY:-false}" != "true" ] || [ -z "${PROXY_SERVER:-}" ]; then
            echo "[ERROR] 代理脚本未生成 PROXY_SERVER（已禁止直连）"
            exit 1
          fi
          PROXY_IP=$(curl -fsS --max-time 20 --proxy "$PROXY_SERVER" https://api.ipify.org || true)
          if [ -z "$PROXY_IP" ]; then
            echo "[ERROR] 代理出口验证失败"
            exit 1
          fi
          MASKED_IP=$(python3 -c 'import sys; ip=sys.argv[1].strip(); p=ip.split("."); v=[x for x in ip.split(":") if x]; print(f"{p[0]}.{p[1]}.***.***" if len(p)==4 else (f"{v[0]}:{v[1]}:***" if ":" in ip and len(v)>=2 else "***"))' "$PROXY_IP")
          echo "✅ 代理出口 IP: $MASKED_IP"
          # main.py 读 WISPBYTE_PROXY（curl_cffi 与 Chrome --proxy-server 都吃 socks5://）
          echo "WISPBYTE_PROXY=${PROXY_SERVER}" >> "$GITHUB_ENV"

      - name: 🚀 执行重启脚本
        id: run_script
        env:
          WISPBYTE_1: ${{ secrets.WISPBYTE_1 }}
          WISPBYTE_2: ${{ secrets.WISPBYTE_2 }}
          WISPBYTE_3: ${{ secrets.WISPBYTE_3 }}
          WISPBYTE_4: ${{ secrets.WISPBYTE_4 }}
          WISPBYTE_5: ${{ secrets.WISPBYTE_5 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          INPUT_ACCOUNTS: ${{ inputs.accounts }}
          WISPBYTE_PROXY: ${{ env.WISPBYTE_PROXY }}
        run: python -u scripts/main.py

      - name: 🧹 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2

      - name: ❌ 失败通知（前置步骤）
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "[SKIP] 未配置 TG_BOT_TOKEN / TG_CHAT_ID"
            exit 0
          fi
          MSG="❌ ${GITHUB_WORKFLOW} 失败（脚本未运行）%0A任务: ${GITHUB_JOB}%0A仓库: ${GITHUB_REPOSITORY}%0A运行页: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${MSG}" || true

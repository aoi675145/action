name: Hoster24 保活

# 保活工作流：外部系统通过 repository_dispatch 触发（event_type: hoster24），
# 也可在 Actions 页手动触发。默认动作 start：在线自动跳过，离线自动开机。
on:
  workflow_dispatch:
    inputs:
      action:
        description: '动作'
        required: true
        default: 'start'
        type: choice
        options:
          - start    # 保活：在线跳过，离线开机并等到 running
          - check    # 只读自检：Cookie/WS/上传通道/Release 资产
          - status   # 查询当前状态
          - upload   # 下载 Release 的 server.jar 并上传
          - deploy   # 上传 -> 开机 -> 等 running
      dir:
        description: '服务器上的目标目录，server.jar 固定传根目录'
        required: false
        default: '/'
      start_timeout:
        description: '开机后等待 running 的最长时间（秒）'
        required: false
        default: '600'
  repository_dispatch:
    types: [hoster24]

concurrency:
  group: hoster24-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 本仓库只放 workflow；实际脚本从私库 aoi675145/scripts 拉取
      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/hoster24/hoster24.py
            scripts/hoster24/setup_proxy.sh
            scripts/hoster24/cookies.txt
          sparse-checkout-cone-mode: false

      - name: 校验代理配置
        env:
          H24_PROXY: ${{ secrets.H24_PROXY }}
        run: |
          if [ -z "$H24_PROXY" ]; then
            echo "❌ 必须配置 H24_PROXY（强制代理模式）"
            exit 1
          fi

      # 解析 NODE_LINK -> sing-box，本地起 socks5://127.0.0.1:1080 与
      # http://127.0.0.1:1081，并把本地代理地址写入 GITHUB_ENV（后续步骤自动可用）。
      # 代理失败会 exit 1，任务直接标红。
      - name: 启动代理 (sing-box)
        env:
          H24_PROXY: ${{ secrets.H24_PROXY }}   # 代理节点分享链接（vless:// 等）
          # DIRECT_DOMAINS: 'example.com'       # 可选：命中域名直连不走代理
        run: NODE_LINK="$H24_PROXY" bash private-repo/scripts/hoster24/setup_proxy.sh

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 执行
        env:
          PYTHONIOENCODING: utf-8
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}       # 下载 Release 资产 server.jar
          H24_IDENT: ${{ secrets.H24_IDENT }}         # 服务器 ident（可选，脚本有默认值）
          H24_UA: ${{ secrets.H24_UA }}               # 与浏览器一致的 UA（可选但建议）
          H24_DIR: ${{ github.event.client_payload.dir || inputs.dir || '/' }}
          H24_START_TIMEOUT: ${{ github.event.client_payload.start_timeout || inputs.start_timeout || '600' }}
          TG_BOT: ${{ secrets.TG_BOT }}               # Telegram 通知，格式 chat_id,token（可选）
          # 注意：此处不要声明 H24_PROXY（Secret 里是节点链接）；
          # setup_proxy.sh 已把本地 socks 地址写入 GITHUB_ENV 的 H24_PROXY，自动生效
        working-directory: private-repo/scripts/hoster24
        run: |
          set -o pipefail
          # 外部触发(repository_dispatch)可带 client_payload.action，否则默认 start 保活
          ACTION="${{ github.event.client_payload.action || inputs.action || 'start' }}"
          echo "📋 动作: $ACTION"
          IP=$(curl -s -x "$H24_PROXY" --max-time 15 https://api.ipify.org || true)
          if [ -n "$IP" ]; then
            MASKED=$(printf '%s' "$IP" | awk -F'[.:]' '{if ($0 ~ /:/) print $1":"$2":****"; else print $1"."$2".x.x"}')
            echo "🌐 出口 IP: $MASKED"
          else
            echo "🌐 出口 IP: 获取失败"
          fi
          python hoster24.py "$ACTION" 2>&1 | tee hoster24.log

      # 面板若在响应中续签 connect.sid，脚本会回写 cookies.txt；这里检测变化并提交回私库
      - name: 回写续期 Cookie 到私库
        if: always()
        working-directory: private-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f scripts/hoster24/cookies.txt ] && ! git diff --quiet scripts/hoster24/cookies.txt; then
            git add scripts/hoster24/cookies.txt
            git commit -m "chore(hoster24): 自动回写 connect.sid"
            git push
            echo "🍪 cookies.txt 已更新并推送"
          else
            echo "🍪 cookies.txt 无变化，跳过提交"
          fi

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log
          rm -f private-repo/scripts/hoster24/hoster24.log

      # 运行日志含服务器信息，历史运行记录自动清理（保留最近 4 次）
      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4

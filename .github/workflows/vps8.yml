name: VPS8 签到

on:
  workflow_dispatch:
    inputs:
      force_renew:
        description: '强制续期（跳过缓存，填 1 启用）'
        required: false
        default: ''
  schedule:
    - cron: "41 23 11 10 *"

jobs:
  sign:
    name: 执行签到
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: 准备（拉取脚本与依赖清单）
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          echo "[INFO] 从私库拉取 main.py..."
          curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o main.py \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/vps8/main.py"
          echo "[INFO] ✅ main.py 已下载 ($(wc -l < main.py) 行)"

          echo "[INFO] 拉取服务到期缓存..."
          if curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o vps8_service_expiry.txt \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/vps8/vps8_service_expiry.txt" 2>/dev/null; then
            echo "[INFO] ✅ vps8_service_expiry.txt 已下载 ($(wc -l < vps8_service_expiry.txt) 行)"
          else
            echo "[INFO] 私库尚无缓存文件，首次运行"
          fi

          echo "[INFO] 拉取题型统计..."
          if curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o vps8_stats.json \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/vps8/vps8_stats.json" 2>/dev/null; then
            echo "[INFO] ✅ vps8_stats.json 已下载"
          else
            echo "[INFO] 私库尚无统计文件，首次运行"
          fi

          echo "[INFO] 拉取共用代理脚本..."
          curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o setup_proxy.sh \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/setup_proxy.sh"
          echo "[INFO] ✅ setup_proxy.sh 已下载"

          echo "[INFO] 生成依赖清单..."

          printf 'seleniumbase\nrequests\nplaywright\nopencv-python\nmsgpack\ntyper\nmatplotlib\ngoogle-genai\nhttpx\nloguru\npydantic-settings\ntenacity\npytz\n' > requirements.txt

          # ── apt 源修复 ──
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          else
            sudo tee /etc/apt/sources.list > /dev/null <<'EOF'
          deb https://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse
          deb https://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse
          deb https://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse
          EOF
          fi
          sudo rm -f /etc/apt/apt-mirrors.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装并启动代理
        env:
          VPS8_PROXY: ${{ secrets.VPS8_PROXY }}
        run: |
          if [ -z "$VPS8_PROXY" ]; then
            echo "::error::VPS8_PROXY 未配置（必填）"
            exit 1
          fi
          NODE_LINK="$VPS8_PROXY" bash setup_proxy.sh

      - name: 安装依赖
        id: deps
        run: |
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"


          # ── 系统依赖（GitHub Runner 直连 Ubuntu 官方源，不走代理；代理仅保留给浏览器）──
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get update -qq $APT_OPTS
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk p7zip-full
          # 预生成系统字体缓存，避免 Chrome 启动时刷 "Unable to revert mtime" 噪音
          sudo fc-cache -fs > /dev/null 2>&1 || true

          # ── Python 依赖 ──
          pip install -q -r requirements.txt

          # ── Chrome 缓存路径（供下一步缓存使用）──
          echo "path=$(python -c 'import seleniumbase,os;print(os.path.join(os.path.dirname(seleniumbase.__file__),"drivers"))')" >> "$GITHUB_OUTPUT"

          # ── 内部组件（固定版本）──
          git clone -q --depth 1 https://github.com/aoi675145/hcaptcha.git hcaptcha-challenger
          cd hcaptcha-challenger
          git fetch -q --depth 1 origin d4da375916cde6bb85128eb8fc9859e1f06cacbc \
            && git checkout -q --detach FETCH_HEAD \
            || echo "[WARN] 固定版本获取失败，使用默认版本"
          git rev-parse HEAD > /dev/null
          cd ..

      - name: 恢复 Chrome for Testing 缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.deps.outputs.path }}
          key: sb-drivers-${{ steps.deps.outputs.week }}
          restore-keys: |
            sb-drivers-

      - name: 安装 Chrome for Testing 与 ChromeDriver
        run: |
          sudo apt-get remove -y google-chrome-stable > /dev/null 2>&1 || true
          rm -rf ~/.cache/selenium
          DRIVERS=$(python -c "import seleniumbase,os;print(os.path.join(os.path.dirname(seleniumbase.__file__),'drivers'))")
          CFT="$DRIVERS/chrome-linux64/chrome"
          if [ ! -x "$CFT" ]; then
            echo "[INFO] 缓存未命中，下载 Chrome for Testing..."
            seleniumbase install chrome
          else
            echo "[INFO] ✅ 命中缓存，跳过 Chrome 下载"
          fi
          sudo rm -f /usr/bin/google-chrome /usr/bin/google-chrome-stable
          sudo ln -sf "$CFT" /usr/bin/google-chrome
          hash -r
          seleniumbase install chromedriver

      - name: 执行 VPS8 签到
        env:
          VPS8: ${{ secrets.VPS8 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          PROXY_HTTP: ${{ env.PROXY_SERVER }}
          VPS8_FORCE_RENEW: ${{ github.event.inputs.force_renew || '' }}
          NO_PROXY: localhost,127.0.0.1
        run: |
          rm -rf screenshots
          xvfb-run -a --server-args="-screen 0 1280x720x24" python -u main.py \
            2> >(grep -v "Unable to revert mtime" >&2)

      - name: 保存信息到私库
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          HAS_SHOT=0
          if [ -d screenshots ] && [ -n "$(ls -A screenshots 2>/dev/null)" ]; then HAS_SHOT=1; fi
          HAS_FILE=0
          if [ -s vps8_service_expiry.txt ]; then HAS_FILE=1; fi
          if [ -s vps8_stats.json ]; then HAS_FILE=1; fi
          if [ "$HAS_SHOT" = "0" ] && [ "$HAS_FILE" = "0" ]; then
            echo "[保存] 没有可保存的内容，跳过"
            exit 0
          fi
          rm -rf scripts-cache
          echo "[保存] 克隆私库 aoi675145/scripts ..."
          git clone --depth 1 "https://x-access-token:${REPO_TOKEN}@github.com/aoi675145/scripts.git" scripts-cache
          mkdir -p scripts-cache/scripts/vps8/screenshots
          if [ "$HAS_SHOT" = "1" ]; then cp -f screenshots/*.png scripts-cache/scripts/vps8/screenshots/; fi
          if [ -s vps8_service_expiry.txt ]; then cp vps8_service_expiry.txt scripts-cache/scripts/vps8/vps8_service_expiry.txt; fi
          if [ -s vps8_stats.json ]; then cp vps8_stats.json scripts-cache/scripts/vps8/vps8_stats.json; fi
          cd scripts-cache
          if [ -z "$(git status --porcelain -- scripts/vps8/)" ]; then
            echo "[保存] 内容无变化，不需要提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- scripts/vps8/
          git commit -m "更新 VPS8 运行信息 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
          echo "[保存] 截图/到期缓存/题型统计已保存到私库 scripts/vps8/"

      - name: 随机 cron
        if: always()
        run: |
          WORKFLOW=".github/workflows/vps8.yml"
          python3 - "$WORKFLOW" <<'PYEOF'
          import random
          import re
          import sys
          from datetime import datetime, timedelta, timezone

          workflow = sys.argv[1]
          # 目标：北京时间次日 06:00-08:00 随机（= 当天 22:00-23:59 UTC，日期要回退一天）
          bj_tomorrow = (datetime.now(timezone.utc) + timedelta(hours=8)).date() + timedelta(days=1)
          bj_start = datetime(bj_tomorrow.year, bj_tomorrow.month, bj_tomorrow.day, 6, 0)
          run_at = bj_start - timedelta(hours=8) + timedelta(minutes=random.randrange(2 * 60))
          cron_line = f'    - cron: "{run_at.minute} {run_at.hour} {run_at.day} {run_at.month} *"'

          with open(workflow, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r'(?m)(?:^    - cron: "[^"]+"\n?)+'
          updated, count = re.subn(pattern, cron_line + "\n", content, count=1)
          if count != 1:
              raise RuntimeError("未找到 workflow schedule cron 配置")

          with open(workflow, "w", encoding="utf-8") as f:
              f.write(updated)

          bj_text = (run_at + timedelta(hours=8)).strftime("%Y-%m-%d %H:%M")
          print(f"[INFO] 下次运行: {run_at.strftime('%Y-%m-%d %H:%M')} UTC / 北京 {bj_text}")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW"
          git diff --cached --quiet || (git commit -m "更新 VPS8 明天的随机 cron" && git pull --rebase --strategy-option=theirs && git push)

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1

name: Bot-Hosting 金币领取

on:
  workflow_dispatch:
  schedule:
    - cron: "02 0 * * *"

jobs:
  earn:
    name: Bot-Hosting 金币领取
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 从私库拉取脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          echo "[INFO] 从私库拉取 bot.py 与 setup_proxy.sh..."
          curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o bot.py \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/bot/bot.py"
          echo "[INFO] ✅ bot.py 已下载 ($(wc -l < bot.py) 行)"
          curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o setup_proxy.sh \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/setup_proxy.sh"
          echo "[INFO] ✅ setup_proxy.sh 已下载 ($(wc -l < setup_proxy.sh) 行)"

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable xvfb fonts-noto-cjk fonts-wqy-zenhei p7zip-full

      - name: 📦 安装 Python 库
        run: |
          pip install -q seleniumbase 'requests[socks]'

      - name: 📦 安装 ChromeDriver
        run: seleniumbase install chromedriver

      - name: ⚙️ 下载并解压扩展
        run: |
          mkdir -p scripts/extensions/nopecha

          wget -q -O scripts/extensions/nopecha/chromium.zip \
            https://github.com/NopeCHALLC/nopecha-extension/releases/download/0.6.0/chromium.zip
          7z x -y scripts/extensions/nopecha/chromium.zip -oscripts/extensions/nopecha/unpacked

      - name: 🌐 安装并启动代理
        env:
          NODE_LINK: ${{ secrets.Bot_PROXY }}
        run: |
          chmod +x setup_proxy.sh
          NODE_LINK="$NODE_LINK" bash setup_proxy.sh

          # 共享脚本写入 IS_PROXY / PROXY_SERVER 到 GITHUB_ENV
          source "$GITHUB_ENV"
          if [ "${IS_PROXY:-false}" != "true" ] || [ -z "${PROXY_SERVER:-}" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          PROXY_IP=""
          for attempt in 1 2 3 4; do
            if PROXY_IP=$(curl -fsS --max-time 20 --proxy "$PROXY_SERVER" https://api.ipify.org 2>/dev/null) && [ -n "$PROXY_IP" ]; then break; fi
            if PROXY_IP=$(curl -fsS --max-time 15 --proxy "$PROXY_SERVER" https://ifconfig.me/ip 2>/dev/null) && [ -n "$PROXY_IP" ]; then break; fi
            echo "⚠️ 代理探测失败（$attempt/4），3 秒后重试"
            sleep 3
          done
          if [ -z "$PROXY_IP" ]; then
            echo "[ERROR] 代理出口验证失败"
            exit 1
          fi
          MASKED_IP=$(python3 -c 'import sys; p=sys.argv[1].strip().split("."); print(".".join(p[:2]+["***","***"]) if len(p)==4 else "***")' "$PROXY_IP")
          echo "✅ 代理出口 IP: $MASKED_IP"

      - name: 🚀 执行 Bot-Hosting 金币领取
        id: run_script
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          Bot_NOPECHA_KEY: ${{ secrets.Bot_NOPECHA_KEY }}
          Bot_PROXY: ${{ env.PROXY_SERVER }}
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" python -u bot.py

      - name: 🧹 清理 sing-box
        if: always()
        run: |
          pkill -f sing-box 2>/dev/null || true
          rm -f sing-box sing-box-config.json sing-box.log sing-box-*.tar.gz setup_proxy.sh

      - name: 🧹 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1

      - name: ❌ 失败通知（前置步骤）
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "[SKIP] 未配置 TG_BOT_TOKEN / TG_CHAT_ID"
            exit 0
          fi
          MSG="❌ ${GITHUB_WORKFLOW} 失败（脚本未运行）%0A任务: ${GITHUB_JOB}%0A仓库: ${GITHUB_REPOSITORY}%0A运行页: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${MSG}" || true

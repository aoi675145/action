name: Vektal Coins

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: Debug mode
        type: boolean
        default: false

env:
  TZ: Asia/Shanghai

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Checkout scripts repo
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: scripts-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests

      - name: Set proxy env
        id: proxy
        run: |
          if [ -n "$PROXY_URL" ]; then
            echo "proxy=$PROXY_URL" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.Vektal_ROXY }}" ]; then
            echo "proxy=${{ secrets.Vektal_ROXY }}" >> $GITHUB_OUTPUT
          fi

      - name: Run vektal
        id: run
        continue-on-error: true
        env:
          Vektal: ${{ secrets.Vektal }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          Vektal_RUNTIME_PROXY: ${{ steps.proxy.outputs.proxy }}
        run: |
          cd scripts-repo/scripts/vektal
          python vektal.py

      - name: Update cron
        run: |
          if [ -f scripts-repo/scripts/vektal/next_run.txt ]; then
            cron=$(cat scripts-repo/scripts/vektal/next_run.txt)
            echo "cron: $cron"
            git clone https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/aoi675145/action.git cron_repo
            cd cron_repo
            echo "$cron" > cron.txt
            git add cron.txt
            git -c user.name="bot" -c user.email="bot@bot.com" \
              commit -m "auto: cron $cron"
            git push
            cd ..
            rm -rf cron_repo
          fi

      - name: Cleanup old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: aoi675145/action
          retain_days: 3
          keep_minimum_runs: 6

      - name: Upload screenshots
        if: failure() || steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: scripts-repo/scripts/vektal/screenshots/
          retention-days: 7

name: Vektal Register

on:
  workflow_dispatch:

  schedule:
    - cron: '23 */18 * * *'

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # 🟡 1️⃣ 安装系统依赖
      # =========================
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl

      # =========================
      # 🟡 2️⃣ 安装 Playwright
      # =========================
      - name: 安装 Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      # =========================
      # 🟡 3️⃣ 拉取私库脚本
      # =========================
      - name: 拉取私库脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            -o vektal.js \
            "https://api.github.com/repos/aoi675145/scripts/contents/scripts/vektal/vektal.js?ref=main"

      # =========================
      # 🟡 4️⃣ 克隆私库（logs / 截图用）
      # =========================
      - name: 克隆私库
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${REPO_TOKEN}@github.com/aoi675145/scripts.git /tmp/scripts-repo

      # =========================
      # 🟡 5️⃣ 安装 sing-box 代理 (1.13.14)
      # =========================
      - name: 安装 sing-box
        run: |
          SINGBOX_VER="1.13.14"
          curl -Lo /tmp/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo mv /tmp/sing-box-*/sing-box /usr/local/bin/
          sudo chmod +x /usr/local/bin/sing-box
          sing-box version

      # =========================
      # 🟡 6️⃣ 启用 WARP 网络 (兜底)
      # =========================
      - name: 启用 WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      # =========================
      # 🟡 7️⃣ 配置 DNS
      # =========================
      - name: 配置 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          sleep 2

      # =========================
      # 🟡 8️⃣ 配置并启动 sing-box 代理（127.0.0.1:8080）
      # =========================
      - name: 启动代理
        env:
          SINGBOX_SUB_URL: ${{ secrets.SINGBOX_SUB_URL }}
        run: |
          if [ -z "${SINGBOX_SUB_URL}" ]; then
            echo "❌ SINGBOX_SUB_URL 未配置"
            exit 1
          fi
          echo "🔍 转换订阅为 sing-box 配置..."
          node << 'NODE_SCRIPT'
const { URL } = require('url');
const { execSync } = require('child_process');
const fs = require('fs');
const subUrl = process.env.SINGBOX_SUB_URL;
if (!subUrl) { console.error("SINGBOX_SUB_URL not set"); process.exit(1); }
const raw = execSync(`curl -sL "${subUrl}"`, { encoding: 'utf8', timeout: 30000 });
const decoded = Buffer.from(raw, 'base64').toString('utf8');
const urls = decoded.split('\n').map(l=>l.trim()).filter(Boolean);
const target = urls.find(u=>u.startsWith('vless://')) || urls[0];
console.log('使用:', target.split('?')[0].slice(0,70)+'...');
const p = new URL(target), q = Object.fromEntries(p.searchParams.entries());
const o = {
  type:'vless', server:p.hostname, server_port:parseInt(p.port||443),
  uuid:p.username, flow:q.flow||'', packet_encoding:'xudp'
};
if (q.security==='tls'||q.sni) {
  o.tls = {enabled:true, server_name:q.sni||q.host||p.hostname};
  if (q.fp) o.tls.utls = {enabled:true, fingerprint:q.fp};
  if (q.insecure==='1'||q.allowInsecure==='1') o.tls.insecure = true;
}
if (q.type==='ws'||q.path) {
  o.transport = {type:'ws', path:q.path||'/'};
  if (q.host) o.transport.headers = {Host: q.host};
}
fs.writeFileSync('/tmp/singbox-config.json', JSON.stringify({log:{level:'error'},inbounds:[{type:'socks',listen:'127.0.0.1',listen_port:8080}],outbounds:[o]}, null, 2));
console.log('生成完毕 ->', o.type, o.server+':'+o.server_port);
NODE_SCRIPT
          if [ ! -s /tmp/singbox-config.json ]; then
            echo "❌ 配置生成失败"
            echo "⚠️ 回退到 WARP 兜底（无代理）"
            echo "PROXY=" >> $GITHUB_ENV
          else
            echo "✅ 配置生成成功（$(wc -c < /tmp/singbox-config.json) bytes）"
            echo "PROXY=http://127.0.0.1:8080" >> $GITHUB_ENV
            sing-box run -c /tmp/singbox-config.json >/dev/null 2>&1 &
            sleep 5
            if pgrep -x "sing-box" > /dev/null; then
              echo "✅ sing-box 已运行"
            else
              echo "❌ sing-box 启动失败"
              sing-box check -c /tmp/singbox-config.json 2>&1 || echo "配置校验失败"
              echo "⚠️ 回退到 WARP 兜底（无代理）"
              echo "PROXY=" >> $GITHUB_ENV
            fi
          fi

      # =========================
      # 🟡 9️⃣ 查看当前 IP
      # =========================
      - name: 查看当前 IP
        run: |
          echo "🌍 当前 IP (通过代理):"
          curl -sx "$PROXY" https://api.ipify.org
          echo
          echo "🌍 当前 IP (直接):"
          curl -s https://api.ipify.org
          echo

      # =========================
      # 🟡 🔟 运行注册脚本
      # =========================
      - name: 清理旧截图
        run: |
          rm -f "$SCREENSHOT_DIR"/*.png 2>/dev/null || true

      - name: 运行注册脚本
        env:
          TARGET_URL: ${{ vars.vektal_TARGET_URL }}
          REFERRAL_CODE: ${{ vars.vektal_REFERRAL_CODE }}
          MAX_RETRY: ${{ vars.vektal_MAX_RETRY }}
          LOGS_PATH: /tmp/scripts-repo/scripts/vektal/logs.txt
          SCREENSHOT_DIR: /tmp/scripts-repo/scripts/vektal/screenshot
        run: |
          mkdir -p screenshots "$SCREENSHOT_DIR"
          xvfb-run -a node vektal.js

      # =========================
      # 🟡 1️⃣1️⃣ 提交并推送截图 + logs
      # =========================
      - name: 提交并推送
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          cd /tmp/scripts-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add scripts/vektal/
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push https://x-access-token:${REPO_TOKEN}@github.com/aoi675145/scripts.git main
          fi

      # =========================
      # 🟡 1️⃣2️⃣ 清理运行记录
      # =========================
      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

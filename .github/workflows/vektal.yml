name: Vektal Register 

on:
  workflow_dispatch:

  schedule:
    - cron: '23 */18 * * *'

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # 🟡 1️⃣ 安装系统依赖
      # =========================
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # =========================
      # 🟡 2️⃣ 启用 WARP
      # =========================
      - name: 创建 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      # =========================
      # 🟡 3️⃣ 安装 Playwright
      # =========================
      - name: 安装 Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      # =========================
      # 🟡 4️⃣ 拉取私库脚本
      # =========================
      - name: 拉取私库脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            -o vektal.js \
            "https://api.github.com/repos/aoi675145/scripts/contents/scripts/vektal/vektal.js?ref=main"

      # =========================
      # 🟡 5️⃣ 查看当前 IP
      # =========================
      - name: 查看当前 IP
        run: |
          echo "🌍 当前 IP:"
          curl -s https://api.ipify.org
          echo
          curl -s https://ipinfo.io

      # =========================
      # 🟡 6️⃣ 运行注册脚本
      # =========================
      - name: 运行注册脚本
        env:
          TARGET_URL: ${{ vars.vektal_TARGET_URL }}
          REFERRAL_CODE: ${{ vars.vektal_REFERRAL_CODE }}
          MAX_RETRY: ${{ vars.vektal_MAX_RETRY }}
        run: |
          mkdir -p screenshots
          xvfb-run -a node vektal.js

      # =========================
      # 🟡 7️⃣ 上传截图到私库
      # =========================
      - name: 克隆私库
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${REPO_TOKEN}@github.com/aoi675145/scripts.git /tmp/scripts-repo

      - name: 复制截图
        run: |
          mkdir -p /tmp/scripts-repo/scripts/vektal/screenshot
          rm -f /tmp/scripts-repo/scripts/vektal/screenshot/*.png
          cp -r screenshots/* /tmp/scripts-repo/scripts/vektal/screenshot/

      - name: 提交并推送截图
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          cd /tmp/scripts-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add scripts/vektal/screenshot/
          if git diff --cached --quiet; then
            echo "No new screenshots to push"
          else
            git commit -m "Update screenshots $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push https://x-access-token:${REPO_TOKEN}@github.com/aoi675145/scripts.git main
          fi

      # =========================
      # 🟡 8️⃣ 清理运行记录
      # =========================
      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

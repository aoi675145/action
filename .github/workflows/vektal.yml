name: Vektal Register

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */18 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Download proxy tools
        run: |
          # Xray for VLESS
          wget -q https://github.com/oyz6/action/releases/download/proxy/Xray-linux-64.zip -O /tmp/xray.zip
          unzip -q /tmp/xray.zip -d xray && chmod +x xray/xray
          # Hysteria2 for hysteria2 nodes
          wget -q https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64 -O hysteria
          chmod +x hysteria

      - name: Run registration
        env:
          SINGBOX_SUB_URL: ${{ secrets.SINGBOX_SUB_URL }}
          SINGLE_PROXY: ${{ secrets.SINGLE_PROXY }}
          TARGET_URL: ${{ vars.vektal_TARGET_URL }}
          REFERRAL_CODE: ${{ vars.vektal_REFERRAL_CODE }}
          MAX_RETRY: ${{ vars.vektal_MAX_RETRY || '10' }}
        run: |
          pip install pyyaml -q
          mkdir -p "scripts/vektal/screenshots"
          python3 scripts/vektal/proxy_setup.py

      - name: Push logs and screenshots
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add scripts/vektal/
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

      - name: Clean old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

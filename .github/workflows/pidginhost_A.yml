name: pidginhost_A 续期

on:
  workflow_dispatch:
  schedule:
    - cron: '59 1 */10 * *'

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet 'requests[socks]'

      - name: 安装并启动代理
        env:
          PIDGIN_PROXY_NODE: ${{ secrets.PIDGIN_PROXY_NODE_A }}
          TG_BOT_TOKEN:      ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:        ${{ secrets.TG_CHAT_ID }}
        run: |
          fail() {
            echo "[ERROR] $1"
            if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
              MSG="🎮 PidginHost 续期%0A⏰ $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')%0A📊 结果：❌ 代理失败%0A❌ $1"
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT_ID}&text=${MSG}" > /dev/null 2>&1 || true
            fi
            exit 1
          }

          if [ -z "$PIDGIN_PROXY_NODE" ]; then
            fail "PIDGIN_PROXY_NODE 未配置"
          fi

          # Hysteria2 支持
          if [[ "$PIDGIN_PROXY_NODE" == hysteria2://* || "$PIDGIN_PROXY_NODE" == hy2://* ]]; then
            echo "[INFO] 配置 Hysteria2 代理"
            wget -q https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64 -O hysteria
            chmod +x hysteria

            python3 << 'PYEOF'
          import json, os, sys
          from urllib.parse import parse_qs, unquote, urlparse

          url = os.environ.get("PIDGIN_PROXY_NODE", "").strip()
          parsed = urlparse(url)
          auth = unquote(parsed.username or "")
          if not auth or not parsed.hostname or not parsed.port:
              print("[ERROR] Hysteria2 节点解析失败")
              sys.exit(1)
          params = parse_qs(parsed.query)
          sni = params.get("sni", [parsed.hostname])[0]
          insecure = params.get("insecure", params.get("allowInsecure", ["0"]))[0].lower() in {"1", "true", "yes", "on"}
          server = f"{parsed.hostname}:{parsed.port}"
          with open("hy2.yaml", "w", encoding="utf-8") as f:
              f.write(f"server: {json.dumps(server)}\n")
              f.write(f"auth: {json.dumps(auth)}\n")
              f.write("tls:\n")
              f.write(f"  sni: {json.dumps(sni)}\n")
              f.write(f"  insecure: {'true' if insecure else 'false'}\n")
              f.write("socks5:\n")
              f.write("  listen: 127.0.0.1:1080\n")
          print(f"[INFO] Hysteria2 -> {parsed.hostname[:2]}***{parsed.hostname[-2:]}:{parsed.port}")
          PYEOF

            ./hysteria client -c hy2.yaml > hysteria.log 2>&1 &
            sleep 5

            echo "[INFO] 测试 Hysteria2 代理连接..."
            for i in 1 2 3 4 5; do
              if curl -x socks5h://127.0.0.1:1080 -s --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
                echo "[INFO] ✅ Hysteria2 代理连接成功"
                echo "PROXY_URL=socks5://127.0.0.1:1080" >> $GITHUB_ENV
                exit 0
              fi
              echo "[WARN] Hysteria2 尝试 $i/5..."
              sleep 3
            done

            fail "Hysteria2 代理连接失败"
          fi

          wget -q https://github.com/akina005/akina/releases/download/proxy/Xray-linux-64.zip
          mkdir -p xray-bin
          unzip -oq Xray-linux-64.zip -d xray-bin
          chmod +x xray-bin/xray
          sudo mv xray-bin/xray /usr/local/bin/xray

          python3 << 'PYEOF'
          import os, sys, json, base64
          from urllib.parse import parse_qs, unquote

          def mask(s):
              return f"{s[:2]}***{s[-2:]}" if len(s) > 4 else "****"

          url = os.environ.get("PIDGIN_PROXY_NODE", "").strip()
          if not url:
              print("[ERROR] PIDGIN_PROXY_NODE 为空")
              sys.exit(1)

          if url.startswith("vless://"):
              protocol = "vless"
              content = url[8:]
          elif url.startswith("vmess://"):
              protocol = "vmess"
              content = url[8:]
          elif url.startswith("trojan://"):
              protocol = "trojan"
              content = url[9:]
          elif url.startswith("ss://"):
              protocol = "ss"
              content = url[5:]
          elif url.startswith("socks5://") or url.startswith("socks://"):
              protocol = "socks5"
              content = url.split("://")[1].split("#")[0]
              if "@" in content:
                  server = content.split("@")[1].split(":")[0]
              else:
                  server = content.split(":")[0]
              print(f"[INFO] SOCKS5 -> {mask(server)}")
              with open("use_external_socks.txt", "w") as f:
                  f.write(url.split("#")[0])
              sys.exit(0)
          else:
              print(f"[ERROR] 不支持的协议: {url.split('://')[0]}")
              sys.exit(1)

          if "#" in content:
              content = content.rsplit("#", 1)[0]

          config = {
              "log": {"loglevel": "warning"},
              "inbounds": [
                  {"port": 1080, "listen": "127.0.0.1", "protocol": "socks", "settings": {"udp": True}},
                  {"port": 1081, "listen": "127.0.0.1", "protocol": "http"}
              ],
              "outbounds": []
          }

          if protocol == "vless":
              uuid, rest = content.split("@", 1)
              if "?" in rest:
                  host_port, params_str = rest.split("?", 1)
              else:
                  host_port, params_str = rest, ""
              if ":" in host_port:
                  address, port = host_port.rsplit(":", 1)
              else:
                  address, port = host_port, "443"
              params = parse_qs(params_str)
              security = params.get("security", ["none"])[0]
              network = params.get("type", ["tcp"])[0]
              sni = params.get("sni", [address])[0]
              fp = params.get("fp", ["chrome"])[0]
              flow = params.get("flow", [""])[0]
              pbk = params.get("pbk", [""])[0]
              host = params.get("host", [sni])[0]
              path = unquote(params.get("path", ["/"])[0])
              print(f"[INFO] VLESS -> {mask(address)}:{port} (security: {security}, network: {network})")
              outbound = {
                  "protocol": "vless",
                  "settings": {"vnext": [{"address": address, "port": int(port), "users": [{"id": uuid, "encryption": "none"}]}]},
                  "streamSettings": {"network": network, "security": security}
              }
              if flow:
                  outbound["settings"]["vnext"][0]["users"][0]["flow"] = flow
              if security == "reality":
                  outbound["streamSettings"]["realitySettings"] = {"serverName": sni, "fingerprint": fp, "publicKey": pbk}
              elif security == "tls":
                  outbound["streamSettings"]["tlsSettings"] = {"serverName": sni, "fingerprint": fp, "allowInsecure": False}
              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {"path": path, "headers": {"Host": host}}
              elif network == "grpc":
                  outbound["streamSettings"]["grpcSettings"] = {"serviceName": params.get("serviceName", [""])[0]}
              config["outbounds"].append(outbound)

          elif protocol == "vmess":
              try:
                  padding = 4 - len(content) % 4
                  if padding != 4:
                      content += "=" * padding
                  decoded = base64.b64decode(content).decode("utf-8")
                  vm = json.loads(decoded)
              except Exception as e:
                  print(f"[ERROR] VMess 解析失败: {e}")
                  sys.exit(1)
              outbound = {
                  "protocol": "vmess",
                  "settings": {"vnext": [{"address": vm.get("add", ""), "port": int(vm.get("port", 443)), "users": [{"id": vm.get("id", ""), "alterId": int(vm.get("aid", 0)), "security": "auto"}]}]},
                  "streamSettings": {"network": vm.get("net", "tcp"), "security": "tls" if vm.get("tls") == "tls" else "none"}
              }
              sni = vm.get("sni", "") or vm.get("host", vm.get("add", ""))
              if vm.get("tls") == "tls":
                  outbound["streamSettings"]["tlsSettings"] = {"serverName": sni, "fingerprint": vm.get("fp", "chrome"), "allowInsecure": False}
              if vm.get("net") == "ws":
                  outbound["streamSettings"]["wsSettings"] = {"path": vm.get("path", "/"), "headers": {"Host": vm.get("host", sni)}}
              print(f"[INFO] VMess -> {mask(vm.get('add', ''))}:{vm.get('port', 443)}")
              config["outbounds"].append(outbound)

          elif protocol == "trojan":
              password, rest = content.split("@", 1)
              if "?" in rest:
                  host_port, params_str = rest.split("?", 1)
              else:
                  host_port, params_str = rest, ""
              if ":" in host_port:
                  address, port = host_port.rsplit(":", 1)
              else:
                  address, port = host_port, "443"
              params = parse_qs(params_str)
              outbound = {
                  "protocol": "trojan",
                  "settings": {"servers": [{"address": address, "port": int(port), "password": password}]},
                  "streamSettings": {"network": params.get("type", ["tcp"])[0], "security": "tls",
                      "tlsSettings": {"serverName": params.get("sni", [address])[0], "fingerprint": params.get("fp", ["chrome"])[0], "allowInsecure": False}}
              }
              if params.get("type", ["tcp"])[0] == "ws":
                  outbound["streamSettings"]["wsSettings"] = {"path": unquote(params.get("path", ["/"])[0]), "headers": {"Host": params.get("host", [address])[0]}}
              print(f"[INFO] Trojan -> {mask(address)}:{port}")
              config["outbounds"].append(outbound)

          elif protocol == "ss":
              try:
                  if "@" in content:
                      encoded, server_part = content.split("@", 1)
                      server_part = server_part.split("?")[0]
                      decoded = base64.b64decode(encoded + "==").decode("utf-8")
                      method, password = decoded.split(":", 1)
                      address, port = server_part.split(":", 1)
                  else:
                      decoded = base64.b64decode(content + "==").decode("utf-8")
                      if "@" in decoded:
                          user_part, server_part = decoded.split("@", 1)
                          server_part = server_part.split("?")[0]
                          method, password = user_part.split(":", 1)
                          address, port = server_part.split(":", 1)
                      else:
                          raise ValueError("无法解析")
              except Exception as e:
                  print(f"[ERROR] Shadowsocks 解析失败: {e}")
                  sys.exit(1)
              print(f"[INFO] Shadowsocks -> {mask(address)}:{port}")
              config["outbounds"].append({"protocol": "shadowsocks", "settings": {"servers": [{"address": address, "port": int(port), "method": method, "password": password}]}})

          with open("xray_config.json", "w") as f:
              json.dump(config, f, indent=2)
          print("[INFO] ✅ 代理配置已生成")
          PYEOF

          if [ -f "use_external_socks.txt" ]; then
            EXTERNAL_SOCKS=$(cat use_external_socks.txt)
            echo "PROXY_URL=$EXTERNAL_SOCKS" >> $GITHUB_ENV
            echo "[INFO] ✅ 使用外部 SOCKS5 代理"
            exit 0
          fi

          xray run -c xray_config.json > xray.log 2>&1 &
          sleep 5

          echo "[INFO] 测试代理连接..."
          for i in 1 2 3 4 5; do
            if curl -x socks5://127.0.0.1:1080 -s --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
              echo "[INFO] ✅ 代理连接成功"
              echo "PROXY_URL=socks5://127.0.0.1:1080" >> $GITHUB_ENV
              exit 0
            fi
            echo "[WARN] 尝试 $i/5..."
            sleep 3
          done

          fail "代理连接失败"

      - name: 运行保活/续期脚本
        env:
          PIDGIN_COOKIE_FILE: cookies_A.txt
          PIDGINHOST_A:      ${{ secrets.PIDGINHOST_A }}
          TG_BOT_TOKEN:      ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:        ${{ secrets.TG_CHAT_ID }}
          PROXY_URL:         ${{ env.PROXY_URL }}
          PYTHONUNBUFFERED:  1
        run: python scripts/pidginhost/pidginhost.py

      - name: 提交 Cookie 更新
        if: success()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          if [[ -n $(git status -s scripts/pidginhost/cookies_A.txt) ]]; then
            git add scripts/pidginhost/cookies_A.txt
            git commit -m "Auto-update auth cookie A [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Cookie 无变化，跳过提交。"
          fi

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

name: antagonix-debug
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb fonts-noto-cjk
          python -m pip install --upgrade pip --quiet
          pip install --quiet 'requests[socks]' seleniumbase
          seleniumbase install chromedriver
      - name: proxy
        env:
          NODE_LINK: ${{ secrets.ANTAGONIX_PROXY }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${{ secrets.REPO_TOKEN }}" -o /tmp/setup_proxy.sh https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/setup_proxy.sh
          bash /tmp/setup_proxy.sh
      - name: diag
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python -u - <<'PY' 2>&1 | tee /tmp/diag.log
          import os, json, time
          from seleniumbase import SB

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36")
          TOK = (os.environ.get("DISCORD_TOKEN") or "").strip()
          DASH = "https://antagonix.fr/dashboard.php?section=bots&lang=en"


          def info(sb, tag):
              try:
                  txt = (sb.execute_script("document.body.innerText.slice(0,250)") or "").replace("\n", " | ")
              except Exception as e:
                  txt = "ERR " + type(e).__name__
              try:
                  print(tag, "url=", sb.get_current_url()[:80], "text=", txt, flush=True)
              except Exception as e:
                  print(tag, "url-err", type(e).__name__, flush=True)


          with SB(headless=False, incognito=False, agent=UA,
                  locale_code="en", proxy="socks5://127.0.0.1:1080") as sb:
              sb.set_window_size(1280, 860)
              sb.open("https://discord.com/login")
              time.sleep(2)
              sb.execute_script("window.localStorage.setItem('token', %s);" % json.dumps(TOK))
              got = sb.execute_script("return !!window.localStorage.getItem('token');")
              print("A token-written", got, flush=True)
              sb.open("https://discord.com/channels/@me")
              time.sleep(6)
              info(sb, "A me")

              sb.open("https://antagonix.fr/login")
              time.sleep(3)
              info(sb, "B login")
              try:
                  sb.click("a.discord-button", timeout=5)
                  print("B click OK", flush=True)
              except Exception as e:
                  print("B click FAIL", type(e).__name__, str(e)[:150].replace("\n", " "), flush=True)
              time.sleep(6)
              info(sb, "B after-click")

              for _ in range(10):
                  time.sleep(2)
                  if "discord.com" not in (sb.get_current_url() or ""):
                      break
                  hit = False
                  for sel in ('button:contains("Authorize")', '//button[contains(., "Authorize")]',
                              'button:contains("Autoriser")', '//button[contains(., "Autoriser")]',
                              'form button[type="submit"]'):
                      try:
                          sb.click(sel, timeout=3)
                          print("C authorize via", sel, flush=True)
                          hit = True
                          break
                      except Exception:
                          continue
                  if hit:
                      time.sleep(4)
              info(sb, "C after-authorize")

              sb.open(DASH)
              time.sleep(4)
              info(sb, "D dashboard")
              print("D csrf-present",
                    sb.execute_script("!!document.getElementById('antxRenewalConfig')"), flush=True)
              print("D bots",
                    sb.execute_script("document.querySelectorAll('[data-renew-bot]').length"), flush=True)
              sb.save_screenshot("/tmp/oauth_page.png")
              print("shot saved", flush=True)
          PY
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antagonix-diag8
          path: |
            /tmp/diag.log
            /tmp/oauth_page.png
          if-no-files-found: warn

name: antagonix-debug
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb fonts-noto-cjk
          python -m pip install --upgrade pip --quiet
          pip install --quiet 'requests[socks]' seleniumbase
          seleniumbase install chromedriver
      - name: proxy
        env:
          NODE_LINK: ${{ secrets.ANTAGONIX_PROXY }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${{ secrets.REPO_TOKEN }}" -o /tmp/setup_proxy.sh https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/setup_proxy.sh
          bash /tmp/setup_proxy.sh
      - name: diag
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python -u - <<'PY' 2>&1 | tee /tmp/diag.log
          import os, json, time
          from seleniumbase import SB

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36")
          TOK = (os.environ.get("DISCORD_TOKEN") or "").strip()


          def js(sb, expr, tag):
              try:
                  print(tag, "=", sb.execute_script(expr), flush=True)
              except Exception as e:
                  print(tag, "= ERR", type(e).__name__, str(e)[:300].replace("\n", " "), flush=True)


          with SB(uc=True, headless=False, incognito=False, agent=UA,
                  locale_code="en", proxy="socks5://127.0.0.1:1080") as sb:
              sb.set_window_size(1280, 860)
              sb.open("https://discord.com/login")
              time.sleep(2)
              sb.execute_script("window.localStorage.setItem('token', %s)" % json.dumps(TOK))
              sb.open("https://discord.com/channels/@me")
              time.sleep(8)
              print("A url=", sb.get_current_url()[:100], flush=True)
              js(sb, "typeof window.localStorage", "A typeof-ls")
              js(sb, "window.localStorage.getItem('token') ? 'has-token' : 'no-token'", "A token")
              js(sb, "(function(){var x=new XMLHttpRequest();x.open('GET','/api/v9/users/@me',false);"
                     "x.setRequestHeader('Authorization',window.localStorage.getItem('token')||'');"
                     "try{x.send();}catch(e){return 'send-err '+e;}return x.status+' '+(x.responseText||'').slice(0,120);})()", "A me")
              js(sb, "document.cookie.length", "A cookie-len")

              sb.open("https://antagonix.fr/login")
              time.sleep(3)
              js(sb, "document.querySelectorAll('a[data-oauth-button]').length", "B oauth-buttons")
              url = None
              try:
                  url = sb.execute_script("document.querySelector('a[data-oauth-button]').href")
              except Exception as e:
                  print("B href = ERR", type(e).__name__, str(e)[:200].replace("\n", " "), flush=True)
              print("B href=", (url or '')[:200], flush=True)

              sb.open(url)
              time.sleep(20)
              print("C url=", sb.get_current_url()[:160], flush=True)
              js(sb, "document.body.innerText.slice(0,600)", "C text")
              js(sb, "document.querySelectorAll('button').length", "C buttons")
              js(sb, "document.title", "C title")
              sb.save_screenshot("/tmp/oauth_page.png")
              print("shot saved", flush=True)
          PY
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antagonix-diag6
          path: |
            /tmp/diag.log
            /tmp/oauth_page.png
          if-no-files-found: warn

name: antagonix-debug
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb fonts-noto-cjk
          python -m pip install --upgrade pip --quiet
          pip install --quiet 'requests[socks]' seleniumbase
          seleniumbase install chromedriver
      - name: proxy
        env:
          NODE_LINK: ${{ secrets.ANTAGONIX_PROXY }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${{ secrets.REPO_TOKEN }}" -o /tmp/setup_proxy.sh https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/setup_proxy.sh
          bash /tmp/setup_proxy.sh
      - name: diag
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python -u - <<'PY' 2>&1 | tee /tmp/diag.log
          import os, json, time
          from seleniumbase import SB

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36")
          TOK = (os.environ.get("DISCORD_TOKEN") or "").strip()

          with SB(uc=True, headless=False, incognito=False, agent=UA,
                  locale_code="en", proxy="socks5://127.0.0.1:1080") as sb:
              sb.set_window_size(1280, 860)
              sb.open("https://discord.com/login")
              time.sleep(2)
              sb.execute_script("window.localStorage.setItem('token', %s);" % json.dumps(TOK))
              sb.open("https://discord.com/channels/@me")
              time.sleep(8)
              print("A url=", sb.get_current_url()[:100], "title=", sb.get_title(), flush=True)
              print("A hasToken=", sb.execute_script("return !!localStorage.getItem('token');"), flush=True)

              sb.open("https://antagonix.fr/login")
              time.sleep(3)
              href = sb.execute_script("var a=document.querySelector('a.discord-button'); return a ? a.href : '';")
              print("B href_len", len(href or ''), flush=True)

              sb.open(href)
              time.sleep(15)
              print("C url=", sb.get_current_url()[:140], "title=", sb.get_title(), flush=True)
              print("C text=", (sb.execute_script("return document.body.innerText.slice(0,700);") or "").replace("\n", " | "), flush=True)
              print("C buttons=", sb.execute_script("""
                var out = [];
                document.querySelectorAll('button').forEach(function(b){
                  var r = b.getBoundingClientRect();
                  out.push((b.innerText||'').trim().slice(0,40) + '@' + Math.round(r.width) + 'x' + Math.round(r.height));
                });
                return JSON.stringify(out.slice(0, 20));
              """), flush=True)
              print("C forms=", sb.execute_script("""
                var out = [];
                document.querySelectorAll('form').forEach(function(f){ out.push(f.action + ' :: ' + (f.innerText||'').trim().slice(0,150)); });
                return JSON.stringify(out.slice(0, 8));
              """), flush=True)
              sb.save_screenshot("/tmp/oauth_page.png")
              print("shot saved", flush=True)
          PY
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antagonix-diag4
          path: |
            /tmp/diag.log
            /tmp/oauth_page.png
          if-no-files-found: warn

name: antagonix-debug
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb fonts-noto-cjk
          python -m pip install --upgrade pip --quiet
          pip install --quiet 'requests[socks]' seleniumbase
          seleniumbase install chromedriver
      - name: proxy
        env:
          NODE_LINK: ${{ secrets.ANTAGONIX_PROXY }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${{ secrets.REPO_TOKEN }}" -o /tmp/setup_proxy.sh https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/setup_proxy.sh
          bash /tmp/setup_proxy.sh
      - name: diag
        run: |
          python -u - <<'PY' 2>&1 | tee /tmp/diag.log
          import time
          from seleniumbase import SB

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36")

          PROBE = """
          var out = {};
          out.origin = location.origin;
          out.ls = typeof window.localStorage;
          out.ss = typeof window.sessionStorage;
          out.idb = typeof window.indexedDB;
          out.cookieEnabled = navigator.cookieEnabled;
          out.cookieLen = document.cookie.length;
          try { window.localStorage.setItem('probe','1'); out.write = window.localStorage.getItem('probe'); }
          catch (e) { out.write = 'ERR ' + e.name + ': ' + e.message; }
          return JSON.stringify(out);
          """

          def probe(sb, tag):
              try:
                  print(tag, sb.execute_script(PROBE), flush=True)
              except Exception as e:
                  print(tag, "ERR", type(e).__name__, str(e)[:200].replace("\n", " "), flush=True)

          with SB(headless=False, agent=UA, locale_code="en",
                  proxy="socks5://127.0.0.1:1080") as sb:
              sb.set_window_size(1280, 860)
              sb.open("https://example.com")
              time.sleep(2)
              probe(sb, "example")
              sb.open("https://discord.com/login")
              time.sleep(6)
              probe(sb, "discord")
              print("title", sb.get_title(), flush=True)
          PY

name: OverNode 续期
on:
  workflow_dispatch:
  schedule:
    - cron: '46 5 17 8 *' # 自动更新下次运行时间
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/overnode/overnode.py
            scripts/setup_proxy.sh.sh
          sparse-checkout-cone-mode: false

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 设置代理 (sing-box)
        env:
          OVERNODE_PROXY: ${{ secrets.OVERNODE_PROXY }}
        run: |
          NODE_LINK="$OVERNODE_PROXY" bash private-repo/scripts/setup_proxy.sh.sh

      - name: 安装 Python 依赖
        run: pip install 'requests[socks]'

      - name: 执行续期
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT: ${{ secrets.TG_BOT }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        working-directory: private-repo/scripts/overnode
        run: |
          set -o pipefail
          python overnode.py 2>&1 | tee renew.log

      - name: 提取下次运行时间
        id: extract_next_run
        if: success()
        working-directory: private-repo/scripts/overnode
        run: |
          NEXT_RUN=$(grep -oP '下次触发\(UTC\): \K\d{4}-\d{2}-\d{2} \d{2}:\d{2}' renew.log | tail -1 || true)
          if [ -z "$NEXT_RUN" ]; then
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未能提取下次运行时间，跳过 Cron 更新"
            exit 0
          fi
          echo "next_run=$NEXT_RUN" >> "$GITHUB_OUTPUT"
          echo "skip_update=false" >> "$GITHUB_OUTPUT"
          echo "::notice::⏰ 下次运行时间: $NEXT_RUN UTC"

      - name: 自动修改下次 Cron
        if: success() && steps.extract_next_run.outputs.skip_update != 'true'
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          NEXT_RUN: ${{ steps.extract_next_run.outputs.next_run }}
        run: |
          set -e
          NEXT_MINUTE=$(date -u -d "$NEXT_RUN" +"%-M")
          NEXT_HOUR=$(date -u -d "$NEXT_RUN" +"%-H")
          NEXT_DAY=$(date -u -d "$NEXT_RUN" +"%-d")
          NEXT_MONTH=$(date -u -d "$NEXT_RUN" +"%-m")
          NEW_CRON="$NEXT_MINUTE $NEXT_HOUR $NEXT_DAY $NEXT_MONTH *"

          echo "::notice::📟 新 Cron: $NEW_CRON"
          git clone "https://${{ github.actor }}:${REPO_TOKEN}@github.com/${{ github.repository }}.git" workflow-repo
          cd workflow-repo

          WORKFLOW_FILE="overnode.yml"
          if [ ! -f "$WORKFLOW_FILE" ]; then
            WORKFLOW_FILE=".github/workflows/overnode.yml"
          fi
          if [ ! -f "$WORKFLOW_FILE" ]; then
            echo "::error::找不到 overnode.yml"
            exit 1
          fi

          LINE_NUM=$(grep -n "cron: '" "$WORKFLOW_FILE" | head -n1 | cut -d: -f1)
          if [ -z "$LINE_NUM" ]; then
            echo "::error::找不到 cron 行"
            exit 1
          fi

          sed -i "${LINE_NUM}c\\    - cron: '$NEW_CRON' # 自动更新下次运行时间" "$WORKFLOW_FILE"
          if git diff --quiet -- "$WORKFLOW_FILE"; then
            echo "::notice::Cron 无变化，无需提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW_FILE"
          git commit -m "🔄 自动更新 Overnode 续期 Cron" -m "下次运行: $NEXT_RUN UTC" -m "Cron: $NEW_CRON"
          git push
          echo "::notice::✅ Cron 更新成功"

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

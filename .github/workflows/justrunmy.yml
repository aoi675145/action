name: JustRunMy 续期
on:
  workflow_dispatch:
  schedule:
    - cron: '21 0 * * *'
  repository_dispatch:
    types: [just]

# ⚠️ 必须添加权限配置，允许 Action 修改仓库文件
permissions:
  contents: write
  actions: write

jobs:
  run_renewal:
    runs-on: ubuntu-latest

    steps:
    # 👇 替换为拉取私有仓库的逻辑
    - name: 拉取私有仓库
      uses: actions/checkout@v4
      with:
        repository: aoi675145/scripts
        token: ${{ secrets.REPO_TOKEN }}
        path: .  # 拉到根目录

    - name: 安装 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install seleniumbase requests
        
    - name: 安装 Chrome 驱动
      run: |
        seleniumbase install chromedriver

    - name: 配置代理（sing-box）
      env:
        Justrunmy_ROXY_NODE: ${{ secrets.Justrunmy_ROXY_NODE }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        notify_fail() {
          local msg="$1"
          echo "[ERROR] $msg"
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=❌ JustRunMy 续期失败：${msg}" > /dev/null || true
          else
            echo "[WARN] 未配置 TG_BOT_TOKEN 或 TG_CHAT_ID，无法发送失败通知"
          fi
        }

        if [ -z "$Justrunmy_ROXY_NODE" ]; then
          notify_fail "未配置代理节点 Justrunmy_ROXY_NODE，已禁止直连"
          exit 1
        fi

        # 调用私库共享脚本启动 sing-box（与工作区其他项目一致）
        chmod +x scripts/setup_proxy.sh.sh
        NODE_LINK="$Justrunmy_ROXY_NODE" bash scripts/setup_proxy.sh.sh || {
          notify_fail "代理启动失败，已禁止直连"
          exit 1
        }

        # 共享脚本写入 IS_PROXY / PROXY_SERVER 到 GITHUB_ENV
        source "$GITHUB_ENV"
        if [ "${IS_PROXY:-false}" != "true" ] || [ -z "${PROXY_SERVER:-}" ]; then
          notify_fail "代理脚本未生成 PROXY_SERVER，已禁止直连"
          exit 1
        fi

        PROXY_IP=$(curl -fsS --max-time 20 --proxy "$PROXY_SERVER" https://api.ipify.org) || {
          notify_fail "代理出口验证失败，已禁止直连"
          exit 1
        }
        MASKED_IP=$(python3 -c 'import sys; p=sys.argv[1].strip().split("."); print(".".join(p[:2]+["***","***"]) if len(p)==4 else "***")' "$PROXY_IP")
        echo "✅ 代理出口 IP: $MASKED_IP"

    - name: 运行续期脚本
      env:
        JUST_APP_ID: ${{ secrets.JUST_APP_ID }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        if [ -z "$PROXY_SERVER" ]; then
          echo "[ERROR] PROXY_SERVER 为空，禁止直连"
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=❌ JustRunMy 续期失败：PROXY_SERVER 为空，已禁止直连" > /dev/null || true
          fi
          exit 1
        fi

        export PROXY="$PROXY_SERVER"

        # 👇 先进入对应的文件夹，让脚本能在同级目录找到 cookie.txt
        cd scripts/justrunmy
        
        # 使用 xvfb 运行以支持强力过人机验证模式
        xvfb-run -a python justrunmy.py

    # 👇 新增步骤：将更新后的 cookie.txt 提交回仓库
    - name: 提交 Cookie 更新
      if: success() # 只有脚本运行成功才提交
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 👇 检查和提交的也是带实际路径的 cookie.txt
        if [[ -n $(git status -s scripts/justrunmy/cookie.txt) ]]; then
          echo "检测到 Cookie 更新，正在提交..."
          git add scripts/justrunmy/cookie.txt
          git commit -m "Auto-update auth cookie [skip ci]"
          git pull --rebase origin main
          git push
        else
          echo "Cookie 无变化，跳过提交。"
        fi

    - name: 清理 sing-box
      if: always()
      run: |
        pkill -f sing-box 2>/dev/null || true
        rm -f sing-box sing-box-config.json sing-box.log sing-box-*.tar.gz

    - name: 清理运行记录
      if: always()
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.REPO_TOKEN }}
        repository: ${{ github.repository }}
        delete_workflow_pattern: ${{ github.workflow }}
        retain_days: 0
        keep_minimum_runs: 6

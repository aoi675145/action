name: HidenCloud 续期

on:
  workflow_dispatch:
  schedule:
    - cron: '51 3 20 8 *'   # 自动更新下次运行时间

permissions:
  actions: write
  contents: write

jobs:
  Renew-HidenCloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright requests 'requests[socks]'
          python -m playwright install --with-deps chrome
          
      - name: 📦 Clone 私库
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git clone https://aoi675145:${REPO_TOKEN}@github.com/aoi675145/scripts.git private-repo
          
      - name: ⚙ 设置代理 (sing-box)
        env:
          HIDEN_PROXY_NODE: ${{ secrets.HIDEN_PROXY_NODE }}
        run: |
          NODE_LINK="$HIDEN_PROXY_NODE" bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
      - name: 🚀 运行续期脚本
        id: run_renew
        env:
          HIDENCLOUD: ${{ secrets.HIDENCLOUD }}
          HIDEN_COOKIES: ${{ secrets.HIDEN_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        working-directory: private-repo/scripts/hidencloud
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 hidencloud.py 2>&1 | tee renew.log

      - name: 📅 提取到期时间
        id: extract_due
        if: success()
        working-directory: private-repo/scripts/hidencloud
        run: |
          DUE_DATE=$(grep -oP '到期时间\(标准\): \K\d{4}-\d{2}-\d{2}' renew.log | tail -1 || echo "")
          if [ -z "$DUE_DATE" ]; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
            echo "::warning::未能提取到期时间，跳过 Cron 更新"
            exit 0
          fi
          echo "due_date=$DUE_DATE" >> $GITHUB_OUTPUT
          echo "skip_update=false" >> $GITHUB_OUTPUT
          echo "::notice::📅 当前到期时间: $DUE_DATE"

      - name: 🔄 修改下次 Cron 时间
        if: success() && steps.extract_due.outputs.skip_update != 'true'
        run: |
          set -e

          DUE_DATE="${{ steps.extract_due.outputs.due_date }}"
          echo "📅 当前到期时间: $DUE_DATE"

          # 计算距离到期还有多少小时
          CURRENT_EPOCH=$(date -u +%s)
          DUE_EPOCH=$(date -u -d "$DUE_DATE 00:00:00" +%s)
          REMAINING_SECONDS=$((DUE_EPOCH - CURRENT_EPOCH))
          REMAINING_HOURS_DISPLAY=$(echo "scale=2; $REMAINING_SECONDS / 3600" | bc)
          echo "⏳ 距离到期还有 $REMAINING_HOURS_DISPLAY 小时"

          REMAINING_HOURS_INT=$((REMAINING_SECONDS / 3600))

          # 提前 20 小时运行续期
          if [ "$REMAINING_HOURS_INT" -gt 20 ]; then
            HOURS_UNTIL_NEXT_RUN=$((REMAINING_HOURS_INT - 20))
          else
            HOURS_UNTIL_NEXT_RUN=4
            echo "::warning::剩余时间不足 20 小时，4 小时后重试"
          fi

          NEXT_DATE=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%Y-%m-%d %H:%M")
          NEXT_MINUTE=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-M")
          NEXT_HOUR=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-H")
          NEXT_DAY=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-d")
          NEXT_MONTH=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-m")

          NEW_CRON="$NEXT_MINUTE $NEXT_HOUR $NEXT_DAY $NEXT_MONTH *"

          echo "::notice::⏰ 下次运行: $NEXT_DATE UTC"
          echo "::notice::📟 新 Cron: $NEW_CRON"

          # 克隆仓库并修改 workflow 文件
          git clone https://${{ github.actor }}:${{ secrets.REPO_TOKEN }}@github.com/${{ github.repository }}.git workflow_repo
          cd workflow_repo

          WORKFLOW_FILE=".github/workflows/hidencloud.yml"

          LINE_NUM=$(grep -n "cron: '" "$WORKFLOW_FILE" | head -n1 | cut -d: -f1)

          if [ -z "$LINE_NUM" ]; then
            echo "::error::找不到 cron 行"
            exit 1
          fi

          echo "::notice::更新第 $LINE_NUM 行"

          sed -i "${LINE_NUM}c\\    - cron: '$NEW_CRON'   # 自动更新下次运行时间" "$WORKFLOW_FILE"

          if git diff --quiet "$WORKFLOW_FILE"; then
            echo "::notice::没有变化需要提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW_FILE"
          git commit -m "🔄 自动更新 HidenCloud 续期 Cron" \
                     -m "下次运行: $NEXT_DATE UTC" \
                     -m "Cron: $NEW_CRON" \
                     -m "到期时间: $DUE_DATE"
          git push

          echo "::notice::✅ Cron 更新成功"

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          runs=$(gh run list --repo "$REPO" --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete --repo "$REPO" "$run_id" || true
            fi
          done

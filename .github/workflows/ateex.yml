name: Ateex 自动续期

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 拉取脚本库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: scripts_repo
          sparse-checkout: |
            scripts/ateex/ateex.py
          sparse-checkout-cone-mode: false

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装 Python 依赖
        run: python -m pip install --disable-pip-version-check "requests[socks]"

      - name: 执行 Ateex 续期
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN_A: ${{ secrets.DISCORD_TOKEN_A }}
          ATEEX_PROXY: ${{ secrets.ATEEX_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        working-directory: scripts_repo/scripts/ateex
        run: python ateex.py

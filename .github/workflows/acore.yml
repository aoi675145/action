name: Acore 续期

on:
  schedule:
    - cron: '51 4 9 8 *'   # 自动更新下次运行时间
  workflow_dispatch:

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: ☁️ 拉取私有脚本库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: scripts_repo
          sparse-checkout: scripts/acore/acore.py

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装依赖
        run: |
          pip install seleniumbase 'requests[socks]'
          sudo apt-get install -y xvfb

      - name: 🔧 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf

      - name: 🌐 安装并启动代理
        env:
          ACORE_PROXY: ${{ secrets.ACORE_PROXY }}
        run: |
          if [ -z "${ACORE_PROXY}" ]; then
            echo "[ERROR] ACORE_PROXY 未配置，禁止直连"
            exit 1
          fi

          if [[ "$ACORE_PROXY" == hysteria2://* || "$ACORE_PROXY" == hy2://* ]]; then
            echo "[INFO] 配置 Hysteria2 代理"
            wget -q https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64 -O hysteria
            chmod +x hysteria

            python3 << 'PYEOF'
          import json, os, sys
          from urllib.parse import parse_qs, unquote, urlparse

          url = os.environ.get("ACORE_PROXY", "").strip()
          parsed = urlparse(url)
          auth = unquote(parsed.username or "")
          if not auth or not parsed.hostname or not parsed.port:
              print("[ERROR] Hysteria2 节点解析失败")
              sys.exit(1)
          params = parse_qs(parsed.query)
          sni = params.get("sni", [parsed.hostname])[0]
          insecure = params.get("insecure", params.get("allowInsecure", ["0"]))[0].lower() in {"1", "true", "yes", "on"}
          server = f"{parsed.hostname}:{parsed.port}"
          with open("hy2.yaml", "w", encoding="utf-8") as f:
              f.write(f"server: {json.dumps(server)}\n")
              f.write(f"auth: {json.dumps(auth)}\n")
              f.write("tls:\n")
              f.write(f"  sni: {json.dumps(sni)}\n")
              f.write(f"  insecure: {'true' if insecure else 'false'}\n")
              f.write("socks5:\n")
              f.write("  listen: 127.0.0.1:10808\n")
          print(f"[INFO] Hysteria2 -> {parsed.hostname[:2]}***{parsed.hostname[-2:]}:{parsed.port}")
          PYEOF

            ./hysteria client -c hy2.yaml > hysteria.log 2>&1 &
            sleep 5

            echo "[INFO] 测试 Hysteria2 代理连接..."
            for i in 1 2 3 4 5; do
          if curl -x socks5h://127.0.0.1:10808 -s --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
                echo "[INFO] Hysteria2 代理连接成功"
                echo "PROXY_SERVER=socks5://127.0.0.1:10808" >> $GITHUB_ENV
                exit 0
              fi
              echo "[WARN] Hysteria2 尝试 $i/5..."
              sleep 3
            done

            echo "[ERROR] ❌ Hysteria2 代理连接失败"
            echo "--- Hysteria2 日志 ---"
            cat hysteria.log
            exit 1
          fi

          wget -q https://github.com/oyz6/action/releases/download/proxy/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray && chmod +x xray/xray

          python3 << 'PYEOF'
          import os, sys, json, base64
          from urllib.parse import parse_qs, unquote, urlparse

          def mask(s):
              return f"{s[:2]}***{s[-2:]}" if len(s) > 4 else "****"

          url = os.environ.get("ACORE_PROXY", "").strip()
          if not url:
              print("[ERROR] ACORE_PROXY 为空")
              sys.exit(1)

          if url.startswith("vless://"):
              protocol = "vless"
              content = url[8:]
          elif url.startswith("vmess://"):
              protocol = "vmess"
              content = url[8:]
          elif url.startswith("ss://"):
              protocol = "ss"
              content = url[5:]
          else:
              print(f"[ERROR] 不支持的协议: {url.split('://')[0]}")
              sys.exit(1)

          if "#" in content:
              content = content.rsplit("#", 1)[0]

          config = {
              "log": {"loglevel": "warning"},
              "inbounds": [
                  {"port": 10808, "listen": "127.0.0.1", "protocol": "socks", "settings": {"udp": True}},
                  {"port": 10809, "listen": "127.0.0.1", "protocol": "http"}
              ],
              "outbounds": []
          }

          if protocol == "vless":
              uuid, rest = content.split("@", 1)
              if "?" in rest:
                  host_port, params_str = rest.split("?", 1)
              else:
                  host_port, params_str = rest, ""

              if ":" in host_port:
                  address, port = host_port.rsplit(":", 1)
              else:
                  address, port = host_port, "443"

              params = parse_qs(params_str)
              security = params.get("security", ["none"])[0]
              network = params.get("type", ["tcp"])[0]
              sni = params.get("sni", [address])[0]
              fp = params.get("fp", ["chrome"])[0]
              flow = params.get("flow", [""])[0]
              pbk = params.get("pbk", [""])[0]
              sid = params.get("sid", [""])[0]
              host = params.get("host", [sni])[0]
              path = unquote(params.get("path", ["/"])[0])

              print(f"[INFO] VLESS -> {mask(address)}:{port} (security: {security}, network: {network})")

              outbound = {
                  "protocol": "vless",
                  "settings": {
                      "vnext": [{
                          "address": address,
                          "port": int(port),
                          "users": [{"id": uuid, "encryption": "none"}]
                      }]
                  },
                  "streamSettings": {
                      "network": network,
                      "security": security
                  }
              }

              if flow:
                  outbound["settings"]["vnext"][0]["users"][0]["flow"] = flow

              if security == "reality":
                  reality = {"serverName": sni, "fingerprint": fp, "publicKey": pbk}
                  if sid: reality["shortId"] = sid
                  outbound["streamSettings"]["realitySettings"] = reality
              elif security == "tls":
                  outbound["streamSettings"]["tlsSettings"] = {
                      "serverName": sni, "fingerprint": fp, "allowInsecure": False
                  }

              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {"path": path, "headers": {"Host": host}}
              elif network == "grpc":
                  outbound["streamSettings"]["grpcSettings"] = {"serviceName": params.get("serviceName", [""])[0]}

              config["outbounds"].append(outbound)

          elif protocol == "vmess":
              try:
                  padding = 4 - len(content) % 4
                  if padding != 4: content += "=" * padding
                  decoded = base64.b64decode(content).decode("utf-8")
                  vm = json.loads(decoded)
              except Exception as e:
                  print(f"[ERROR] VMess 解析失败: {e}"); sys.exit(1)

              address = vm.get("add", "")
              port = int(vm.get("port", 443))
              uuid = vm.get("id", "")
              aid = int(vm.get("aid", 0))
              network = vm.get("net", "tcp")
              tls = vm.get("tls", "")
              sni = vm.get("sni", "") or vm.get("host", address)
              host = vm.get("host", address)
              path = vm.get("path", "/")
              fp = vm.get("fp", "chrome")

              print(f"[INFO] VMess -> {mask(address)}:{port} (network: {network}, tls: {tls})")

              outbound = {
                  "protocol": "vmess",
                  "settings": {
                      "vnext": [{"address": address, "port": port, "users": [{"id": uuid, "alterId": aid, "security": "auto"}]}]
                  },
                  "streamSettings": {"network": network, "security": "tls" if tls == "tls" else "none"}
              }

              if tls == "tls":
                  outbound["streamSettings"]["tlsSettings"] = {"serverName": sni, "fingerprint": fp, "allowInsecure": False}
              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {"path": path, "headers": {"Host": host}}

              config["outbounds"].append(outbound)

          elif protocol == "ss":
              try:
                  from urllib.parse import urlparse as _up
                  ss_url = _up(url)
                  userinfo = ss_url.username or ""
                  address = ss_url.hostname or ""
                  port = ss_url.port

                  if userinfo and address and port:
                      decoded_userinfo = unquote(userinfo)
                      if ":" not in decoded_userinfo:
                          padding = "=" * (-len(decoded_userinfo) % 4)
                          decoded_userinfo = base64.urlsafe_b64decode(decoded_userinfo + padding).decode("utf-8")
                      method, password = decoded_userinfo.split(":", 1)
                  else:
                      raw = content.split("#", 1)[0].split("?", 1)[0]
                      padding = "=" * (-len(raw) % 4)
                      decoded = base64.urlsafe_b64decode(raw + padding).decode("utf-8")
                      user_part, server_part = decoded.rsplit("@", 1)
                      method, password = user_part.split(":", 1)
                      address, port = server_part.rsplit(":", 1)

                  if not address or not port: raise ValueError("缺少服务器或端口")
              except Exception as e:
                  print(f"[ERROR] Shadowsocks 解析失败: {e}"); sys.exit(1)

              print(f"[INFO] Shadowsocks -> {mask(address)}:{port}")
              config["outbounds"].append({
                  "protocol": "shadowsocks",
                  "settings": {"servers": [{"address": address, "port": int(port), "method": method, "password": password}]}
              })

          with open("xray_config.json", "w") as f:
              json.dump(config, f, indent=2)
          print("[INFO] ✅ 代理配置已生成")
          PYEOF

          ./xray/xray run -c xray_config.json > xray.log 2>&1 &
          sleep 5

          echo "[INFO] 测试代理连接..."
          for i in 1 2 3 4 5; do
            if curl -x socks5h://127.0.0.1:10808 -s --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
              echo "[INFO] ✅ 代理连接成功"
              echo "PROXY_SERVER=socks5://127.0.0.1:10808" >> $GITHUB_ENV
              exit 0
            fi
            echo "[WARN] 尝试 $i/5..."
            sleep 3
          done

          echo "[ERROR] ❌ 代理连接失败"
          echo "--- Xray 日志 ---"
          cat xray.log
          exit 1

      - name: 检查脚本代理出口
        run: |
          if [ -z "${PROXY_SERVER}" ]; then
            echo "[ERROR] PROXY_SERVER 为空，禁止直连"
            exit 1
          fi

          echo "[INFO] 检查代理出口 IP..."
          curl -fsS --max-time 20 --proxy "${PROXY_SERVER}" https://api.ipify.org 2>/dev/null | python3 -c "
          import sys
          ip = sys.stdin.read().strip()
          parts = ip.split('.')
          if len(parts) == 4:
              print(f'[INFO] 代理出口 IP: {parts[0]}.xxx.xxx.{parts[3]}')
          elif len(ip) > 8:
              print(f'[INFO] 代理出口 IP: {ip[:4]}***{ip[-4:]}')
          else:
              print('[INFO] 代理出口 IP: ***')
          "

          echo "[INFO] 检查 Acore Hosting 可访问..."
          STATUS=$(curl -fsSI --max-time 30 --proxy "${PROXY_SERVER}" https://zero.acorehosting.com/ 2>/dev/null | head -1)
          echo "[INFO] $STATUS"

      - name: 🚀 运行续期脚本
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ACORE_PROXY: ${{ env.PROXY_SERVER }}
        run: xvfb-run python scripts_repo/scripts/acore/acore.py 2>&1 | tee renew.log

      - name: 提取到期时间
        id: extract_due
        if: success()
        run: |
          DUE_DATE=$(grep -oP '到期时间: \K\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}\s+UTC' renew.log | tail -1 || echo "")
          if [ -z "$DUE_DATE" ]; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
            echo "::warning::未能提取到期时间，跳过 Cron 更新"
            exit 0
          fi
          echo "due_date=$DUE_DATE" >> $GITHUB_OUTPUT
          echo "skip_update=false" >> $GITHUB_OUTPUT
          echo "::notice::📅 到期时间: $DUE_DATE"

      - name: 修改下次 Cron 时间
        if: success() && steps.extract_due.outputs.skip_update != 'true'
        run: |
          set -e

          DUE_DATE="${{ steps.extract_due.outputs.due_date }}"
          echo "📅 到期时间: $DUE_DATE"

          CURRENT_EPOCH=$(date -u +%s)
          DUE_EPOCH=$(date -u -d "$DUE_DATE" +%s)
          REMAINING_SECONDS=$((DUE_EPOCH - CURRENT_EPOCH))
          REMAINING_HOURS=$(echo "scale=2; $REMAINING_SECONDS / 3600" | bc)
          REMAINING_HOURS_INT=$((REMAINING_SECONDS / 3600))
          echo "⏳ 距离到期还有 ${REMAINING_HOURS} 小时"

          # 续期条件: < 24h 可续，随机在剩余 21~23h 时运行
          if [ "$REMAINING_HOURS_INT" -gt 23 ]; then
            RANDOM_HOURS=$((RANDOM % 3 + 21))
            HOURS_UNTIL_NEXT=$((REMAINING_HOURS_INT - RANDOM_HOURS))
            echo "🎯 目标剩余 ${RANDOM_HOURS}h 时运行"
          elif [ "$REMAINING_HOURS_INT" -gt 1 ]; then
            HOURS_UNTIL_NEXT=1
            echo "::warning::剩余不足 24h，1 小时后重试"
          else
            HOURS_UNTIL_NEXT=1
            echo "::warning::即将到期，1 小时后重试"
          fi

          NEXT_MINUTE=$(date -u -d "+${HOURS_UNTIL_NEXT} hours" +"%-M")
          NEXT_HOUR=$(date -u -d "+${HOURS_UNTIL_NEXT} hours" +"%-H")
          NEXT_DAY=$(date -u -d "+${HOURS_UNTIL_NEXT} hours" +"%-d")
          NEXT_MONTH=$(date -u -d "+${HOURS_UNTIL_NEXT} hours" +"%-m")
          NEXT_DATE=$(date -u -d "+${HOURS_UNTIL_NEXT} hours" +"%Y-%m-%d %H:%M")

          NEW_CRON="$NEXT_MINUTE $NEXT_HOUR $NEXT_DAY $NEXT_MONTH *"

          echo "::notice::⏰ 下次运行: $NEXT_DATE UTC"
          echo "::notice::📟 新 Cron: $NEW_CRON"

          git clone https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/${{ github.repository }}.git workflow_repo
          cd workflow_repo

          WORKFLOW_FILE=".github/workflows/acore.yml"
          LINE_NUM=$(grep -n "cron: '" "$WORKFLOW_FILE" | head -n1 | cut -d: -f1)

          if [ -z "$LINE_NUM" ]; then
            echo "::error::找不到 cron 行"
            exit 1
          fi

          sed -i "${LINE_NUM}c\\    - cron: '$NEW_CRON'   # 自动更新下次运行时间" "$WORKFLOW_FILE"

          if git diff --quiet "$WORKFLOW_FILE"; then
            echo "::notice::没有变化需要提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW_FILE"
          git commit -m "🔄 自动更新 Acore 续期 Cron" \
                     -m "下次运行: $NEXT_DATE UTC" \
                     -m "Cron: $NEW_CRON" \
                     -m "到期时间: $DUE_DATE"
          git push

          echo "::notice::✅ Cron 更新成功"

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 5
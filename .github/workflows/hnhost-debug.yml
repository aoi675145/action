name: Hnhost 诊断

# 临时调试工作流：定位 err=discord_err，跑完删除
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 🔎 诊断版本标记
        run: echo "hnhost-debug v1 $(date -u '+%F %T UTC')"

      - name: 📥 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: pip install --quiet 'requests[socks]'

      - name: 🌐 安装并启动代理
        env:
          NODE_LINK: ${{ secrets.HNHOST_PROXY_NODE }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "[ERROR] HNHOST_PROXY_NODE 未配置"
            exit 1
          fi
          chmod +x scripts/setup_proxy.sh
          NODE_LINK="$NODE_LINK" bash scripts/setup_proxy.sh
          source "$GITHUB_ENV"
          if [ "${IS_PROXY:-false}" != "true" ] || [ -z "${PROXY_SERVER:-}" ]; then
            echo "[ERROR] 代理脚本未生成 PROXY_SERVER"
            exit 1
          fi
          echo "代理已就绪"

      - name: 🚀 跑诊断
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PROXY_URL:     ${{ env.PROXY_SERVER }}
          HNHOST_SCOPE:  ${{ vars.HNHOST_SCOPE }}
          PYTHONUNBUFFERED: 1
        run: python scripts/hnhost/hnhost_debug.py

      - name: 🧹 清理 sing-box
        if: always()
        run: |
          pkill -f sing-box 2>/dev/null || true
          rm -f sing-box sing-box-config.json sing-box.log sing-box-*.tar.gz

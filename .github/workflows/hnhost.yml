name: hnhost 签到

on:
  workflow_dispatch:
  schedule:
    - cron: '36 0 * * *'

permissions:
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取私有仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet 'requests[socks]'

      - name: 安装并启动代理
        env:
          NODE_LINK:     ${{ secrets.HNHOST_PROXY_NODE }}
          TG_BOT_TOKEN:  ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
        run: |
          fail() {
            echo "[ERROR] $1"
            if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
              MSG="🎮 hnhost 签到%0A⏰ $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')%0A📊 结果：❌ 代理失败%0A❌ $1"
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT_ID}&text=${MSG}" > /dev/null 2>&1 || true
            fi
            exit 1
          }

          if [ -z "$NODE_LINK" ]; then
            fail "HNHOST_PROXY_NODE 未配置（已禁止直连）"
          fi

          chmod +x scripts/setup_proxy.sh.sh
          NODE_LINK="$NODE_LINK" bash scripts/setup_proxy.sh.sh

          source "$GITHUB_ENV"
          if [ "${IS_PROXY:-false}" != "true" ] || [ -z "${PROXY_SERVER:-}" ]; then
            fail "代理脚本未生成 PROXY_SERVER（已禁止直连）"
          fi

          PROXY_IP=$(curl -fsS --max-time 20 --proxy "$PROXY_SERVER" https://api.ipify.org) || {
            fail "代理出口验证失败"
          }
          MASKED_IP=$(python3 -c 'import sys; p=sys.argv[1].strip().split("."); print(".".join(p[:2]+["***","***"]) if len(p)==4 else "***")' "$PROXY_IP")
          echo "✅ 代理出口 IP: $MASKED_IP"

      - name: 运行签到脚本
        env:
          DISCORD_TOKEN:                ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN:                 ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:                   ${{ secrets.TG_CHAT_ID }}
          PROXY_URL:                    ${{ env.PROXY_SERVER }}
          SESSION_FILE:                 scripts/hnhost/hnhost_session.json
          # 留空用脚本默认窄 scope；如需恢复原站抓包的完整 scope，
          # 在仓库 Variables 里加 HNHOST_SCOPE=identify email guilds guilds.join
          HNHOST_SCOPE:                 ${{ vars.HNHOST_SCOPE }}
          # 设 HNHOST_TOKEN_PLAINTEXT=1 时 TG 通知附带完整 token（仅临时核对用）
          HNHOST_TOKEN_PLAINTEXT:       ${{ vars.HNHOST_TOKEN_PLAINTEXT }}
          PYTHONUNBUFFERED:             1
        run: python scripts/hnhost/main.py

      - name: 回写会话缓存
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, urllib.request, urllib.error

          path = "scripts/hnhost/hnhost_session.json"
          if not os.path.exists(path):
              print("ℹ️ 无会话缓存文件，跳过回写")
              raise SystemExit(0)
          with open(path, "rb") as f:
              content = f.read()
          token = os.environ["REPO_TOKEN"]
          api = f"https://api.github.com/repos/aoi675145/scripts/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hnhost-session-cache",
          }
          sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=30) as r:
                  sha = json.load(r)["sha"]
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
          payload = {
              "message": "Update hnhost session cache",
              "content": base64.b64encode(content).decode("ascii"),
          }
          if sha:
              payload["sha"] = sha
          req = urllib.request.Request(api, data=json.dumps(payload).encode(),
                                       headers={**headers, "Content-Type": "application/json"},
                                       method="PUT")
          try:
              with urllib.request.urlopen(req, timeout=30):
                  print("✅ 会话缓存已回写私库")
          except urllib.error.HTTPError as e:
              # 409 = 内容未变化，属正常
              if e.code == 409:
                  print("ℹ️ 会话缓存无变化")
              else:
                  print(f"⚠️ 回写失败 HTTP {e.code}: {e.read()[:200]}")
          PYEOF

      - name: 清理 sing-box
        if: always()
        run: |
          pkill -f sing-box 2>/dev/null || true
          rm -f sing-box sing-box-config.json sing-box.log sing-box-*.tar.gz

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2

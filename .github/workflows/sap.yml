name: SAP 保活

on:
  schedule:
    - cron: "28 1 */10 * *"   # 每10天运行一次（UTC 1点）
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest

    steps:
      # 👇 修改 1：改为拉取私有仓库
      - name: 拉取脚本仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: .

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 👇 修改 2：指定工作目录，并补充安装 playwright 浏览器内核
      - name: 安装运行依赖
        working-directory: scripts/sap-login
        run: |
          npm install playwright axios form-data
          npx playwright install chromium --with-deps

      # 👇 修改 3：指定工作目录，并修改 TG 环境变量名匹配你的截图
      - name: 执行 SAP 保活
        working-directory: scripts/sap-login
        run: node login.js
        env:
          SAP_ACCOUNTS: ${{ secrets.SAP_ACCOUNTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      # 👇 修改 4：修正截图收集路径
      - name: 上传运行截图
        if: always() # 建议加上这行，无论成功失败都截个图
        uses: actions/upload-artifact@v4
        with:
          name: sap-btp-screenshots
          path: scripts/sap-login/*.png

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

name: VPS8 签到 

on:
  workflow_dispatch:
    inputs:
      force_renew:
        description: '强制续期（跳过缓存，填 1 启用）'
        required: false
        default: ''
  schedule:
    - cron: "52 3 * * *"

jobs:
  sign:
    name: 执行签到
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 从私库拉取脚本和到期缓存
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          echo "[INFO] 从私库拉取 v8.py..."
          curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o v8.py \
            "https://raw.githubusercontent.com/aoi675145/vps8/main/v8.py"
          echo "[INFO] ✅ v8.py 已下载 ($(wc -l < v8.py) 行)"

          echo "[INFO] 拉取服务到期缓存..."
          if curl -fsSL \
            -H "Authorization: Bearer ${REPO_TOKEN}" \
            -o vps8_service_expiry.txt \
            "https://raw.githubusercontent.com/aoi675145/vps8/main/vps8_service_expiry.txt" 2>/dev/null; then
            echo "[INFO] ✅ vps8_service_expiry.txt 已下载 ($(wc -l < vps8_service_expiry.txt) 行)"
          else
            echo "[INFO] 私库尚无缓存文件，首次运行"
          fi

          echo "[INFO] 清理私库旧截图..."
          git clone --depth 1 "https://x-access-token:${REPO_TOKEN}@github.com/aoi675145/vps8.git" scripts-cleanup
          if [ -f scripts-cleanup/screenshots/*.png ]; then
            git -C scripts-cleanup rm -f screenshots/*.png
            git -C scripts-cleanup config user.name "github-actions[bot]"
            git -C scripts-cleanup config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C scripts-cleanup commit -m "清理上次截图"
            git -C scripts-cleanup push
            echo "[INFO] ✅ 旧截图已清理"
          else
            echo "[INFO] 无私库截图需清理"
          fi
          rm -rf scripts-cleanup

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb fonts-noto-cjk fonts-wqy-zenhei p7zip-full

      - name: 安装 Playwright 及 Python 库
        run: |
          pip install -q playwright requests PySocks
          playwright install chromium
          pip install -q "hcaptcha-challenger @ git+https://github.com/Sliverkiss/hcaptcha.git@main"

      - name: 下载并解压扩展
        run: |
          mkdir -p scripts/extensions/buster

          wget -q -O scripts/extensions/buster/buster.zip \
            https://github.com/dessant/buster/releases/download/v3.4.0/buster_captcha_solver_for_humans-3.4.0-chrome.zip
          7z x -y scripts/extensions/buster/buster.zip -oscripts/extensions/buster/unpacked

      - name: 安装并启动代理
        env:
          VPS8_PROXY: ${{ secrets.VPS8_PROXY }}
        run: |
          if [ -z "$VPS8_PROXY" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          if [[ "$VPS8_PROXY" == hysteria2://* || "$VPS8_PROXY" == hy2://* ]]; then
            echo "[INFO] 配置 Hysteria2 代理"
            wget -q https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64 -O hysteria
            chmod +x hysteria

            python3 << 'PYEOF'
          import json, os, sys
          from urllib.parse import parse_qs, unquote, urlparse

          url = os.environ.get("VPS8_PROXY", "").strip()
          parsed = urlparse(url)
          auth = unquote(parsed.username or "")
          if not auth or not parsed.hostname or not parsed.port:
              print("[ERROR] Hysteria2 节点解析失败")
              sys.exit(1)
          params = parse_qs(parsed.query)
          sni = params.get("sni", [parsed.hostname])[0]
          insecure = params.get("insecure", params.get("allowInsecure", ["0"]))[0].lower() in {"1", "true", "yes", "on"}
          server = f"{parsed.hostname}:{parsed.port}"
          with open("hy2.yaml", "w", encoding="utf-8") as f:
              f.write(f"server: {json.dumps(server)}\n")
              f.write(f"auth: {json.dumps(auth)}\n")
              f.write("tls:\n")
              f.write(f"  sni: {json.dumps(sni)}\n")
              f.write(f"  insecure: {'true' if insecure else 'false'}\n")
              f.write("http:\n")
              f.write("  listen: 127.0.0.1:1080\n")
          print(f"[INFO] Hysteria2 -> {parsed.hostname[:2]}***{parsed.hostname[-2:]}:{parsed.port}")
          PYEOF

            ./hysteria client -c hy2.yaml > hysteria.log 2>&1 &
            sleep 5

            echo "[INFO] 测试 Hysteria2 代理连接..."
            for i in 1 2 3 4 5; do
              if curl -x http://127.0.0.1:1080 -s --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
                echo "[INFO] ✅ Hysteria2 代理连接成功"
                echo "PROXY_SOCKS5=http://127.0.0.1:1080" >> $GITHUB_ENV
                exit 0
              fi
              echo "[WARN] Hysteria2 尝试 $i/5..."
              sleep 3
            done

            echo "[ERROR] ❌ Hysteria2 代理连接失败"
            echo "--- Hysteria2 日志 ---"
            cat hysteria.log
            exit 1
          fi

          wget -q https://github.com/oyz6/action/releases/download/proxy/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray && chmod +x xray/xray

          python3 << 'PYEOF'
          import os, sys, json, base64
          from urllib.parse import parse_qs, unquote, urlparse

          def mask(s):
              return f"{s[:2]}***{s[-2:]}" if len(s) > 4 else "****"

          url = os.environ.get("VPS8_PROXY", "").strip()
          if not url:
              print("[ERROR] VPS8_PROXY 为空")
              sys.exit(1)

          if url.startswith("vless://"):
              protocol = "vless"
              content = url[8:]
          elif url.startswith("vmess://"):
              protocol = "vmess"
              content = url[8:]
          elif url.startswith("trojan://"):
              protocol = "trojan"
              content = url[9:]
          elif url.startswith("ss://"):
              protocol = "ss"
              content = url[5:]
          elif url.startswith("socks5://") or url.startswith("socks://"):
              protocol = "socks5"
              content = url.split("://")[1].split("#")[0]
              if "@" in content:
                  server = content.split("@")[1].split(":")[0]
              else:
                  server = content.split(":")[0]
              print(f"[INFO] SOCKS5 -> {mask(server)}")
              with open("use_external_socks.txt", "w") as f:
                  f.write(url.split("#")[0])
              sys.exit(0)
          else:
              print(f"[ERROR] 不支持的协议: {url.split('://')[0]}")
              sys.exit(1)

          if "#" in content:
              content = content.rsplit("#", 1)[0]

          config = {
              "log": {"loglevel": "warning"},
              "inbounds": [
                  {"port": 10808, "listen": "127.0.0.1", "protocol": "socks", "settings": {"udp": True}},
                  {"port": 10809, "listen": "127.0.0.1", "protocol": "http"}
              ],
              "outbounds": []
          }

          if protocol == "vless":
              uuid, rest = content.split("@", 1)
              if "?" in rest:
                  host_port, params_str = rest.split("?", 1)
              else:
                  host_port, params_str = rest, ""

              if ":" in host_port:
                  address, port = host_port.rsplit(":", 1)
              else:
                  address, port = host_port, "443"

              params = parse_qs(params_str)
              security = params.get("security", ["none"])[0]
              network = params.get("type", ["tcp"])[0]
              sni = params.get("sni", [address])[0]
              fp = params.get("fp", ["chrome"])[0]
              flow = params.get("flow", [""])[0]
              pbk = params.get("pbk", [""])[0]
              sid = params.get("sid", [""])[0]
              host = params.get("host", [sni])[0]
              path = unquote(params.get("path", ["/"])[0])

              print(f"[INFO] VLESS -> {mask(address)}:{port} (security: {security}, network: {network})")

              outbound = {
                  "protocol": "vless",
                  "settings": {
                      "vnext": [{
                          "address": address,
                          "port": int(port),
                          "users": [{"id": uuid, "encryption": "none"}]
                      }]
                  },
                  "streamSettings": {
                      "network": network,
                      "security": security
                  }
              }

              if flow:
                  outbound["settings"]["vnext"][0]["users"][0]["flow"] = flow

              if security == "reality":
                  reality = {
                      "serverName": sni,
                      "fingerprint": fp,
                      "publicKey": pbk,
                  }
                  if sid:
                      reality["shortId"] = sid
                  outbound["streamSettings"]["realitySettings"] = reality
              elif security == "tls":
                  outbound["streamSettings"]["tlsSettings"] = {
                      "serverName": sni,
                      "fingerprint": fp,
                      "allowInsecure": False
                  }

              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {
                      "path": path,
                      "headers": {"Host": host}
                  }
              elif network == "grpc":
                  service_name = params.get("serviceName", [""])[0]
                  outbound["streamSettings"]["grpcSettings"] = {
                      "serviceName": service_name
                  }

              config["outbounds"].append(outbound)

          elif protocol == "vmess":
              try:
                  padding = 4 - len(content) % 4
                  if padding != 4:
                      content += "=" * padding
                  decoded = base64.b64decode(content).decode("utf-8")
                  vm = json.loads(decoded)
              except Exception as e:
                  print(f"[ERROR] VMess 解析失败: {e}")
                  sys.exit(1)

              address = vm.get("add", "")
              port = int(vm.get("port", 443))
              uuid = vm.get("id", "")
              aid = int(vm.get("aid", 0))
              network = vm.get("net", "tcp")
              tls = vm.get("tls", "")
              sni = vm.get("sni", "") or vm.get("host", address)
              host = vm.get("host", address)
              path = vm.get("path", "/")
              fp = vm.get("fp", "chrome")

              print(f"[INFO] VMess -> {mask(address)}:{port} (network: {network}, tls: {tls})")

              outbound = {
                  "protocol": "vmess",
                  "settings": {
                      "vnext": [{
                          "address": address,
                          "port": port,
                          "users": [{"id": uuid, "alterId": aid, "security": "auto"}]
                      }]
                  },
                  "streamSettings": {
                      "network": network,
                      "security": "tls" if tls == "tls" else "none"
                  }
              }

              if tls == "tls":
                  outbound["streamSettings"]["tlsSettings"] = {
                      "serverName": sni,
                      "fingerprint": fp,
                      "allowInsecure": False
                  }

              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {
                      "path": path,
                      "headers": {"Host": host}
                  }

              config["outbounds"].append(outbound)

          elif protocol == "trojan":
              password, rest = content.split("@", 1)
              if "?" in rest:
                  host_port, params_str = rest.split("?", 1)
              else:
                  host_port, params_str = rest, ""

              if ":" in host_port:
                  address, port = host_port.rsplit(":", 1)
              else:
                  address, port = host_port, "443"

              params = parse_qs(params_str)
              sni = params.get("sni", [address])[0]
              network = params.get("type", ["tcp"])[0]
              host = params.get("host", [sni])[0]
              path = unquote(params.get("path", ["/"])[0])
              fp = params.get("fp", ["chrome"])[0]

              print(f"[INFO] Trojan -> {mask(address)}:{port} (network: {network})")

              outbound = {
                  "protocol": "trojan",
                  "settings": {
                      "servers": [{
                          "address": address,
                          "port": int(port),
                          "password": password
                      }]
                  },
                  "streamSettings": {
                      "network": network,
                      "security": "tls",
                      "tlsSettings": {
                          "serverName": sni,
                          "fingerprint": fp,
                          "allowInsecure": False
                      }
                  }
              }

              if network == "ws":
                  outbound["streamSettings"]["wsSettings"] = {
                      "path": path,
                      "headers": {"Host": host}
                  }

              config["outbounds"].append(outbound)

          elif protocol == "ss":
              try:
                   if "@" in content:
                       encoded, server_part = content.split("@", 1)
                       server_part = server_part.split("?")[0]
                       decoded = base64.b64decode(encoded + "==").decode("utf-8")
                       method, password = decoded.split(":", 1)
                       address, port = server_part.split(":", 1)
                   else:
                       decoded = base64.b64decode(content + "==").decode("utf-8")
                       if "@" in decoded:
                           user_part, server_part = decoded.split("@", 1)
                           server_part = server_part.split("?")[0]
                           method, password = user_part.split(":", 1)
                           address, port = server_part.split(":", 1)
                       else:
                           raise ValueError("无法解析")
              except Exception as e:
                  print(f"[ERROR] Shadowsocks 解析失败: {e}")
                  sys.exit(1)

              print(f"[INFO] Shadowsocks -> {mask(address)}:{port}")

              outbound = {
                  "protocol": "shadowsocks",
                  "settings": {
                      "servers": [{
                          "address": address,
                          "port": int(port),
                          "method": method,
                          "password": password
                      }]
                  }
              }

              config["outbounds"].append(outbound)

          with open("xray_config.json", "w") as f:
              json.dump(config, f, indent=2)

          print("[INFO] ✅ 代理配置已生成")
          PYEOF

          if [ -f "use_external_socks.txt" ]; then
            EXTERNAL_SOCKS=$(cat use_external_socks.txt)
            echo "PROXY_SOCKS5=$EXTERNAL_SOCKS" >> $GITHUB_ENV
            echo "[INFO] ✅ 使用外部 SOCKS5 代理"
            exit 0
          fi

          ./xray/xray run -c xray_config.json > xray.log 2>&1 &
          sleep 5

          echo "[INFO] 测试代理连接..."
          for i in 1 2 3 4 5; do
            if curl -x socks5://127.0.0.1:10808 -s --max-time 15 https://api.ipify.org > /dev/null 2>&1; then
              echo "[INFO] ✅ 代理连接成功"
              echo "PROXY_SOCKS5=socks5://127.0.0.1:10808" >> $GITHUB_ENV
              exit 0
            fi
            echo "[WARN] 尝试 $i/5..."
            sleep 3
          done

          echo "[ERROR] ❌ 代理连接失败"
          echo "--- Xray 日志 ---"
          cat xray.log
          exit 1

      - name: 清理旧截图
        run: rm -rf screenshots

      - name: 执行 VPS8 签到
        env:
          VPS8: ${{ secrets.VPS8 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_HTTP: ${{ env.PROXY_SOCKS5 }}
          VPS8_FORCE_RENEW: ${{ github.event.inputs.force_renew || '' }}
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" python -u v8.py

      - name: 保存截图到私库（覆盖上一次）
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ ! -d screenshots ] || [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "[截图] screenshots 目录不存在或为空，跳过"
            exit 0
          fi
          echo "[截图] 克隆私库 aoi675145/vps8，保存截图..."
          git clone --depth 1 "https://x-access-token:${REPO_TOKEN}@github.com/aoi675145/vps8.git" scripts-cache
          mkdir -p scripts-cache/screenshots
          cp screenshots/*.png scripts-cache/screenshots/
          cd scripts-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A screenshots/
          if [ -z "$(git status --porcelain -- screenshots/)" ]; then
            echo "[截图] 截图无变化，跳过提交"
            exit 0
          fi
          git commit -m "更新 VPS8 截图 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
          echo "[截图] 截图已保存到私库 vps8/screenshots/"

      - name: 保存服务到期缓存到私库
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ ! -s vps8_service_expiry.txt ]; then
            echo "[缓存] vps8_service_expiry.txt 不存在或为空，本次不提交私库"
            exit 0
          fi
          rm -rf scripts-cache
          echo "[缓存] 克隆私库 aoi675145/vps8，保存 vps8_service_expiry.txt"
          git clone --depth 1 "https://x-access-token:${REPO_TOKEN}@github.com/aoi675145/vps8.git" scripts-cache
          mkdir -p scripts-cache
          cp vps8_service_expiry.txt scripts-cache/vps8_service_expiry.txt
          cd scripts-cache
          if [ -z "$(git status --porcelain -- vps8_service_expiry.txt)" ]; then
            echo "[缓存] 服务到期缓存无变化，不需要提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vps8_service_expiry.txt
          git commit -m "更新 VPS8 服务到期缓存"
          git push
          echo "[缓存] vps8_service_expiry.txt 已保存到私库 vps8/"

      - name: 随机化下次 cron 运行时间 (UTC 7-10时 = 北京 15-18时)
        if: always()
        run: |
          RND_HOUR=$((7 + RANDOM % 4))
          RND_MINUTE=$((RANDOM % 60))
          WORKFLOW=".github/workflows/v8.yml"
          sed -i "s/- cron: \".*\"/- cron: \"$RND_MINUTE $RND_HOUR * * *\"/" "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW"
          git diff --cached --quiet || (git commit -m "随机化下次 cron: $RND_MINUTE $RND_HOUR * * * (UTC)" && git pull --rebase --strategy-option=theirs && git push)

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1

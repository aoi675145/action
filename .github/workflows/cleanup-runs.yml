name: Cleanup

on:
  schedule:
    - cron: '0 16 */10 * *'  
  workflow_dispatch:         

permissions:
  actions: write             
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 删除 15 天前的运行记录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "15 days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "将删除 $cutoff 之前的运行记录..."

          ids=$(gh run list --repo "$REPO" \
                 --json databaseId,createdAt,status --limit 1000 \
               | jq -r --arg cutoff "$cutoff" '
                   .[]
                   | select(.createdAt < $cutoff and .status == "completed")
                   | .databaseId')

          total=$(printf '%s\n' "$ids" | grep -c . || true)
          echo "共 $total 条待删除"

          deleted=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if err=$(gh api -X DELETE "repos/$REPO/actions/runs/$id" --silent 2>&1); then
              deleted=$((deleted+1))
            else
              echo "  删除失败: run id $id — $err"
            fi
            sleep 1
          done <<< "$ids"

          echo "完成: 成功删除 $deleted / $total 条"

      - name: Kamikaze (自毁本次运行记录)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "任务完成，后台延迟自毁本次运行记录..."
          # API 不能直接删除 in_progress 的记录，
          # 用 nohup 挂后台延迟 3 秒执行，趁工作流已判定完成、Runner 还没销毁的间隙完成自杀
          nohup bash -c "sleep 3 && gh api -X DELETE /repos/$REPO/actions/runs/$RUN_ID --silent" > /dev/null 2>&1 &

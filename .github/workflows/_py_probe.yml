name: py probe (temp)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: verify
        run: |
          python -V
          pip install -q requests --retries 5 --timeout 60
          python -c "import requests, sys; print('PY_OK', sys.version.split()[0], requests.__version__)"

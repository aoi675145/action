name: Openworld 续期

on:
  workflow_dispatch:
  schedule:
    - cron: '26 1 */5 * *' # 每5天 UTC 1:26 (北京时间 9:26),自行调整

# 同一时刻只允许一个续期 run，避免并发提交 cookies.txt 互相顶掉
concurrency:
  group: openworld-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          # 只取最新一次提交：私库 500MB+ 历史，全量拉一次几十秒；推送前 rebase 用下面的 fetch 补
          fetch-depth: 1
          sparse-checkout: |
            scripts/openworld/openworld.py
            scripts/openworld/cookies.txt
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🌐 设置代理 (sing-box)
        env:
          Openworld_PROXY: ${{ secrets.Openworld_PROXY }}
        run: |
          NODE_LINK="$Openworld_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 📦 修复 apt 源
        run: |
          # runner 自带的 azure 镜像走 http，避开 apt https 方法里会卡死的 TLS select 路径；
          # archive / security 做备用源。22.04 和 24.04 一律写成旧版 sources.list（apt 两边都认），
          # 顺手清掉 ubuntu.sources 与 apt-mirrors.txt，否则 22.04 会报 "no longer has a Release file"。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          # apt 默认是"单次 read"超时，慢源会一直滴漏不触发，这里配小并加重试
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 📦 安装依赖
        timeout-minutes: 10
        run: |
          # 系统包按需安装：镜像自带就不碰 apt，源不可达也不会把 job 拖死（脚本见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/action/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh \
              --need-pkg "xvfb fonts-wqy-microhei"
          fi
          pip install playwright requests ddddocr Pillow 'requests[socks]' websocket-client opencv-python-headless --retries 5 --timeout 60
          playwright install --with-deps chromium

      - name: 🚀 运行 Openworld 续期脚本
        id: run_script
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: "true"
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          # 定时触发=续期+检查开机；手动触发=仅检查状态+开机，不续期
          START_ONLY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        working-directory: private-repo/scripts/openworld
        run: |
          set -o pipefail
          xvfb-run --auto-servernum python3 openworld.py 2>&1 | tee renew.log

      - name: 📥 提交更新的 cookies.txt 回私库
        if: success()
        working-directory: private-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/openworld/cookies.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ cookies.txt 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(openworld): update cookies.txt [skip ci]"

          PUSH_URL="https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/aoi675145/scripts.git"
          PUSH_OK=""
          for i in 1 2 3; do
            # 推送前先同步远端（其他 run 可能已推过 cookies.txt），避免 non-fast-forward
            git fetch origin main
            if ! git rebase -X ours origin/main; then
              echo "⚠️ rebase 失败，重试 $i/3"
              git rebase --abort 2>/dev/null || true
              sleep 5
              continue
            fi
            if git push "$PUSH_URL" HEAD:main; then
              PUSH_OK=1
              break
            fi
            echo "⚠️ 推送被拒绝（远端有新提交），重试 $i/3"
            sleep 5
          done
          if [ -z "$PUSH_OK" ]; then
            echo "❌ 重试 3 次后仍未推送成功"
            exit 1
          fi
          echo "✅ cookies.txt 已推送到私库"

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromium || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4

      - name: ❌ 失败通知（前置步骤）
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "[SKIP] 未配置 TG_BOT_TOKEN / TG_CHAT_ID"
            exit 0
          fi
          MSG="❌ ${GITHUB_WORKFLOW} 失败（脚本未运行）%0A任务: ${GITHUB_JOB}%0A仓库: ${GITHUB_REPOSITORY}%0A运行页: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${MSG}" || true

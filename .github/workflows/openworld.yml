name: Openworld 续期

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 */2 * *' # 每2天UTC 2点 (北京时间10点),自行调整

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/openworld/openworld.py
            scripts/openworld/cookies.txt
            scripts/setup_proxy.sh.sh
          sparse-checkout-cone-mode: false

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 设置代理 (sing-box)
        env:
          Openworld_PROXY: ${{ secrets.Openworld_PROXY }}
        run: |
          NODE_LINK="$Openworld_PROXY" bash private-repo/scripts/setup_proxy.sh.sh

      - name: 🛠️ 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          pip install playwright requests ddddocr Pillow 'requests[socks]' websocket-client
          playwright install --with-deps chromium

      - name: 🚀 运行 Openworld 续期脚本
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: "true"
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        working-directory: private-repo/scripts/openworld
        run: |
          set -o pipefail
          xvfb-run --auto-servernum python3 openworld.py 2>&1 | tee renew.log

      - name: 📤 提交更新的 cookies.txt 回私库
        if: success()
        working-directory: private-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/openworld/cookies.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ cookies.txt 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(openworld): update cookies.txt [skip ci]"
          git push https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/aoi675145/scripts.git HEAD:main

      - name: 📸 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            *.gif
          if-no-files-found: ignore
          retention-days: 3

      - name: 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromium || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4

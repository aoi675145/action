name: searcade 保活

on:
  schedule:
    # 每 3 天跑一次，UTC 01:17 = 北京时间 09:17
    - cron: '17 1 */3 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install --upgrade pip
          pip install seleniumbase requests pyvirtualdisplay

      - name: 拉取私库脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: token ${REPO_TOKEN}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o searcade.py \
            https://api.github.com/repos/aoi675145/scripts/contents/scripts/searcade/searcade.py
          test -s searcade.py && echo "✅ searcade.py 拉取成功"
          head -5 searcade.py

          curl -fsSL \
            -H "Authorization: token ${REPO_TOKEN}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o setup_proxy.sh \
            https://api.github.com/repos/aoi675145/scripts/contents/scripts/setup_proxy.sh.sh
          test -s setup_proxy.sh && echo "✅ setup_proxy.sh 拉取成功"

      - name: 设置代理
        env:
          SEARCADE_PROXY: ${{ secrets.SEARCADE_PROXY }}
        run: |
          NODE_LINK="$SEARCADE_PROXY" bash setup_proxy.sh

      - name: 执行保活
        env:
          SEARCADE: ${{ secrets.SEARCADE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python searcade.py

      - name: 清理代理进程
        if: always()
        run: |
          pkill -f sing-box || true

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6

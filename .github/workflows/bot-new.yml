name: Bot-New 续期

on:
  schedule:
    # 自动更新：每次运行后脚本写入 next_run.txt，本行被改为固定日期（北京 09:17）
    - cron: "10 8 15 11 *"
  workflow_dispatch:

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: ☁️ 拉取私有脚本库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: scripts_repo
          sparse-checkout: scripts/bot-new/bot-new.py

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 修复 apt 源
        run: |
          # runner 自带的 azure 镜像走 http，避开 apt https 方法里会卡死的 TLS select 路径；
          # archive / security 做备用源。22.04 和 24.04 一律写成旧版 sources.list（apt 两边都认），
          # 顺手清掉 ubuntu.sources 与 apt-mirrors.txt，否则 22.04 会报 "no longer has a Release file"。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          # apt 默认是"单次 read"超时，慢源会一直滴漏不触发，这里配小并加重试
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF
          # 索引刷新失败不阻断：真缺包时后面那步的 ensure-apt 会点名报错，避免源滴漏把 job 拖死
          timeout 90 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=8 -o Acquire::https::Timeout=8 -o Acquire::ForceIPv4=true \
            || timeout 120 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=8 -o Acquire::https::Timeout=8 -o Acquire::ForceIPv4=true \
            || echo "::warning::apt 索引刷新失败（源不可达），继续"
      - name: 📦 安装依赖
        timeout-minutes: 10
        run: |
          pip install seleniumbase Pillow --retries 5 --timeout 60
          # 系统包按需安装：镜像自带就不碰 apt，源不可达也不会把 job 拖死（脚本见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/action/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh \
              --need-pkg "xvfb"
          fi


      - name: 🌐 安装并启动代理
        env:
          BOTNEW_PROXY: ${{ secrets.BOTNEW_PROXY }}
        run: |
          if [ -z "${BOTNEW_PROXY}" ]; then
            echo "[ERROR] BOTNEW_PROXY 未配置，禁止直连"
            exit 1
          fi

          wget -q https://github.com/akina005/akina/releases/download/proxy/Xray-linux-64.zip
          mkdir -p xray-bin
          unzip -oq Xray-linux-64.zip -d xray-bin
          chmod +x xray-bin/xray
          sudo mv xray-bin/xray /usr/local/bin/xray

          python3 << 'PYEOF'
          import base64
          import json
          import os
          from urllib.parse import parse_qs, unquote, urlparse

          proxy_url = os.environ["BOTNEW_PROXY"].strip()
          parsed = urlparse(proxy_url)
          scheme = parsed.scheme

          if scheme not in {"vless", "vmess", "ss", "hysteria2", "h2"}:
              raise SystemExit(f"Unsupported proxy scheme: {scheme}")

          def truthy(value):
              return str(value).lower() in {"1", "true", "yes"}

          def build_stream_settings(query, host):
              transport_type = query.get("type", "tcp")
              if transport_type == "h2":
                  transport_type = "http"
              stream_settings = {"network": transport_type, "security": query.get("security", "none")}
              if stream_settings["security"] == "reality":
                  reality = {"serverName": query.get("sni", host), "fingerprint": query.get("fp", "chrome"), "publicKey": query.get("pbk", "")}
                  if query.get("sid"): reality["shortId"] = query["sid"]
                  if query.get("spx"): reality["spiderX"] = query["spx"]
                  stream_settings["realitySettings"] = reality
              elif stream_settings["security"] == "tls":
                  stream_settings["tlsSettings"] = {"serverName": query.get("sni", host), "fingerprint": query.get("fp", "chrome"), "allowInsecure": truthy(query.get("allowInsecure", query.get("insecure", "0")))}
              if transport_type == "tcp":
                  stream_settings["tcpSettings"] = {"header": {"type": query.get("headerType", "none")}}
              elif transport_type == "ws":
                  headers = {}
                  if query.get("host"): headers["Host"] = query["host"]
                  stream_settings["wsSettings"] = {"path": query.get("path", "/"), "headers": headers}
              elif transport_type == "http":
                  stream_settings["httpSettings"] = {"host": [h for h in query.get("host", "").split(",") if h], "path": query.get("path", "/")}
              elif transport_type == "grpc":
                  stream_settings["grpcSettings"] = {"serviceName": query.get("serviceName", ""), "authority": query.get("authority", "")}
              return stream_settings

          if scheme == "vless":
              qs = {k: v[-1] for k, v in parse_qs(parsed.query).items()}
              host, port, user_id = parsed.hostname, parsed.port, unquote(parsed.username or "")
              if not host or not port or not user_id:
                  raise SystemExit("Invalid VLESS URL")
              outbound = {"protocol": "vless", "settings": {"vnext": [{"address": host, "port": port, "users": [{"id": user_id, "encryption": qs.get("encryption", "none"), "flow": qs.get("flow", "")}]}]}, "streamSettings": build_stream_settings(qs, host)}
          elif scheme == "vmess":
              payload = parsed.netloc + parsed.path
              padded = payload + "=" * (-len(payload) % 4)
              vmess = json.loads(base64.urlsafe_b64decode(padded).decode("utf-8"))
              host, port, user_id = vmess.get("add"), int(vmess.get("port", 0)), vmess.get("id", "")
              if not host or not port or not user_id:
                  raise SystemExit("Invalid VMess URL")
              query = {"type": vmess.get("net", "tcp"), "security": vmess.get("tls", "none"), "path": vmess.get("path", "/") or "/", "host": vmess.get("host", ""), "sni": vmess.get("sni", "") or host, "fp": vmess.get("fp", "chrome"), "allowInsecure": vmess.get("allowInsecure", vmess.get("insecure", "0")), "serviceName": vmess.get("path", ""), "authority": vmess.get("host", ""), "headerType": vmess.get("type", "none") or "none"}
              outbound = {"protocol": "vmess", "settings": {"vnext": [{"address": host, "port": port, "users": [{"id": user_id, "alterId": int(vmess.get("aid", 0) or 0), "security": vmess.get("scy", "auto")}]}]}, "streamSettings": build_stream_settings(query, host)}
          elif scheme in {"hysteria2", "h2"}:
              qs = {k: v[-1] for k, v in parse_qs(parsed.query).items()}
              host = parsed.hostname
              port = parsed.port or 443
              password = unquote(parsed.password or parsed.username or "")
              sni = qs.get("sni", host)
              insecure = qs.get("insecure", "0") in {"1", "true", "yes"}
              outbound = {"protocol": "hysteria2", "settings": {"servers": [{"address": host, "port": port, "password": password}]}, "streamSettings": {"security": "tls", "tlsSettings": {"serverName": sni, "allowInsecure": insecure}}}
          elif scheme == "ss":
              content = parsed.netloc + parsed.path
              if "@" in content:
                  encoded, server_part = content.split("@", 1)
                  decoded = base64.b64decode(encoded + "==").decode("utf-8")
                  method, password = decoded.split(":", 1)
                  address, port = server_part.split(":", 1)
              else:
                  decoded = base64.b64decode(content + "==").decode("utf-8")
                  if "@" in decoded:
                      user_part, server_part = decoded.split("@", 1)
                      method, password = user_part.split(":", 1)
                      address, port = server_part.split(":", 1)
                  else:
                      raise SystemExit("Invalid SS URL")
              outbound = {"protocol": "shadowsocks", "settings": {"servers": [{"address": address, "port": int(port), "method": method, "password": password}]}}
          else:
              raise SystemExit(f"Unsupported proxy scheme: {scheme}")

          config = {"log": {"loglevel": "warning"}, "inbounds": [{"listen": "127.0.0.1", "port": 8080, "protocol": "http"}], "outbounds": [outbound]}
          with open("xray-config.json", "w", encoding="ascii") as f:
              json.dump(config, f, indent=2)
          PYEOF

          xray run -c xray-config.json > xray.log 2>&1 &
          sleep 2
          xray version
          sed -n '1,20p' xray.log || true

          if curl -fsS --max-time 15 --proxy "http://127.0.0.1:8080" https://api.ipify.org >/tmp/bothost_proxy_ip; then
          python3 - <<'PYEOF'
          ip = open("/tmp/bothost_proxy_ip", encoding="utf-8").read().strip()
          parts = ip.split(".")
          if len(parts) == 4:
              ip = f"{parts[0]}.xxx.xxx.{parts[3]}"
          elif len(ip) > 8:
              ip = f"{ip[:4]}***{ip[-4:]}"
          else:
              ip = "***"
          print(f"[INFO] ✅ 代理可用，出口 IP: {ip}")
          PYEOF
            echo "PROXY_SERVER=http://127.0.0.1:8080" >> "$GITHUB_ENV"
          else
            echo "[ERROR] ❌ 代理不可用，禁止直连"
            cat xray.log
            exit 1
          fi

      - name: 🌐 检查脚本代理出口
        run: |
          if [ -z "${PROXY_SERVER}" ]; then
            echo "[ERROR] PROXY_SERVER 为空，禁止直连"
            exit 1
          fi

          echo "[INFO] 检查代理出口 IP..."
          curl -fsS --max-time 20 --proxy "${PROXY_SERVER}" https://api.ipify.org >/tmp/freeze_check_ip
          python3 - <<'PYEOF'
          ip = open("/tmp/freeze_check_ip", encoding="utf-8").read().strip()
          parts = ip.split(".")
          if len(parts) == 4:
              ip = f"{parts[0]}.xxx.xxx.{parts[3]}"
          elif len(ip) > 8:
              ip = f"{ip[:4]}***{ip[-4:]}"
          else:
              ip = "***"
          print(f"[INFO] 代理出口 IP: {ip}")
          PYEOF

          echo "[INFO] 检查 Bot-Hosting 可访问..."
          curl -fsSI --max-time 30 --proxy "${PROXY_SERVER}" https://bot-hosting.net/ | sed -n '1,8p'

      - name: 🚀 运行续期脚本
        id: run_renew
        env:
          DISCORD_TOKEN_A: ${{ secrets.DISCORD_TOKEN_A }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BOTNEW_PROXY: ${{ env.PROXY_SERVER }}
        run: xvfb-run python scripts_repo/scripts/bot-new/bot-new.py

      - name: ⏰ 修改 cron
        if: always()
        run: |
          if [ ! -f next_run.txt ]; then
            echo "next_run.txt 不存在，跳过 cron 更新"
            exit 0
          fi
          next_cron=$(tr -d '\n\r' < next_run.txt)
          echo "cron: $next_cron"
          git clone https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/${{ github.repository }}.git cron_repo
          cd cron_repo
          sed -i "s/- cron: \".*\"/- cron: \"$next_cron\"/" .github/workflows/bot-new.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/bot-new.yml
          read -r _MM _HH _DD _MO _ <<< "$next_cron"
          _TS=$(date -u -d "$(date -u +%Y)-$_MO-$_DD $_HH:$_MM" +%s 2>/dev/null || echo 0)
          if [ "$_TS" -lt "$(date -u +%s)" ]; then _TS=$(date -u -d "$(( $(date -u +%Y) + 1 ))-$_MO-$_DD $_HH:$_MM" +%s); fi
          NEXT_LABEL=$(date -u -d "@$_TS" '+%Y-%m-%d %H:%M UTC')
          git diff --cached --quiet || (git commit -m "🔄 下次运行: $NEXT_LABEL" -m "Cron: $next_cron" && git push)

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2

      - name: ❌ 失败通知（前置步骤）
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "[SKIP] 未配置 TG_BOT_TOKEN / TG_CHAT_ID"
            exit 0
          fi
          MSG="❌ ${GITHUB_WORKFLOW} 失败（脚本未运行）%0A任务: ${GITHUB_JOB}%0A仓库: ${GITHUB_REPOSITORY}%0A运行页: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${MSG}" || true
